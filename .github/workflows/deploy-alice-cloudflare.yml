          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            verifyAliceDeploymentManifest,
          } from "./deploy/modal/alice_deployment_manifest.mjs";
          import { canonicalAliceJson } from "./workers/alice-effective-config.js";

          const manifestBytes = fs.readFileSync(process.env.MANIFEST, "utf8");
          const preimportManifestBytes = fs.readFileSync(
            process.env.PREIMPORT_MANIFEST,
            "utf8",
          );
          verifyAliceDeploymentManifest(manifestBytes);
          verifyAliceDeploymentManifest(preimportManifestBytes);
          const preimportProvider = JSON.parse(
            fs.readFileSync(process.env.PREIMPORT_PROVIDER, "utf8"),
          );
          const freshProvider = JSON.parse(
            fs.readFileSync(process.env.PROVIDER, "utf8"),
          );
          const canonicalTimestamp = (value) => {
            try {
              return typeof value === "string" && new Date(value).toISOString() === value;
            } catch {
              return false;
            }
          };
          if (
            !canonicalTimestamp(preimportProvider.observedAt) ||
            !canonicalTimestamp(freshProvider.observedAt)
          ) {
            throw new Error("ALICE_PREIMPORT_PROVIDER_TIMESTAMP_INVALID");
          }
          const preimportObservedAtMs = Date.parse(preimportProvider.observedAt);
          const freshObservedAtMs = Date.parse(freshProvider.observedAt);
          if (
            preimportObservedAtMs > freshObservedAtMs ||
            freshObservedAtMs - preimportObservedAtMs > 7_200_000 ||
            Math.abs(Date.now() - freshObservedAtMs) > 300_000
          ) {
            throw new Error("ALICE_PREIMPORT_PROVIDER_FRESHNESS_INVALID");
          }
          delete preimportProvider.observedAt;
          delete freshProvider.observedAt;
          if (
            canonicalAliceJson(preimportProvider) !==
              canonicalAliceJson(freshProvider)
