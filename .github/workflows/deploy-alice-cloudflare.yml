name: Deploy Alice Cloudflare Production
run-name: Alice production deploy watchdog-${{ inputs.recovery_watchdog_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact protected Alice release commit"
        required: true
        type: string
      recovery_watchdog_run_id:
        description: "In-progress protected push recovery watchdog run ID"
        required: true
        type: string
      build_run_id:
        description: "Successful Build Cloud Agent run ID for source_sha"
        required: true
        type: string
      worker_artifact_name:
        description: "Immutable Worker bundle artifact name from build_run_id"
        required: true
        type: string
      worker_artifact_digest:
        description: "Server-reported sha256 digest of the immutable artifact"
        required: true
        type: string
      preimport_run_id:
        description: "Successful exact-image preimport workflow run ID"
        required: true
        type: string
      preimport_run_attempt:
        description: "Exact successful preimport workflow run attempt"
        required: true
        type: number
      preimport_workflow_sha:
        description: "Exact reviewed preimport workflow source commit"
        required: true
        type: string
      preimport_workflow_ref:
        description: "Exact temporary preimport workflow refs/heads ref"
        required: true
        type: string
      preimport_artifact_id:
        description: "Exact immutable preimport evidence artifact ID"
        required: true
        type: string
      preimport_artifact_name:
        description: "Exact immutable preimport evidence artifact name"
        required: true
        type: string
      preimport_artifact_digest:
        description: "Server-reported sha256 preimport artifact digest"
        required: true
        type: string
      runtime_image:
        description: "Smoke-qualified source GHCR image pinned by sha256 digest"
        required: true
        type: string
      release_epoch:
        description: "Signed Program release epoch"
        required: true
        type: number
      runtime_revision:
        description: "Admitted Container Program runtime revision"
        required: true
        type: number
      policy_hash:
        description: "Exact signed Alice policy sha256"
        required: true
        type: string

concurrency:
  group: alice-cloudflare-production
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

jobs:
  deploy:
    name: Promote attested Alice Worker bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: alice-production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RECOVERY_WATCHDOG_RUN_ID: ${{ inputs.recovery_watchdog_run_id }}

    steps:
      - name: Checkout exact protected release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Enforce protected source and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_NAME: ${{ inputs.worker_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.worker_artifact_digest }}
          PREIMPORT_RUN_ID: ${{ inputs.preimport_run_id }}
          PREIMPORT_RUN_ATTEMPT: ${{ inputs.preimport_run_attempt }}
          PREIMPORT_WORKFLOW_SHA: ${{ inputs.preimport_workflow_sha }}
          PREIMPORT_WORKFLOW_REF: ${{ inputs.preimport_workflow_ref }}
          PREIMPORT_ARTIFACT_ID: ${{ inputs.preimport_artifact_id }}
          PREIMPORT_ARTIFACT_NAME: ${{ inputs.preimport_artifact_name }}
          PREIMPORT_ARTIFACT_DIGEST: ${{ inputs.preimport_artifact_digest }}
          SOURCE_RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          RUNTIME_REVISION: ${{ inputs.runtime_revision }}
          RELEASE_EPOCH: ${{ inputs.release_epoch }}
          POLICY_HASH: ${{ inputs.policy_hash }}
          EXPECTED_REF: refs/heads/release/alice-production-core-2026-08-22
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$RECOVERY_WATCHDOG_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BUILD_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s' "$PREIMPORT_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          test "$PREIMPORT_RUN_ATTEMPT" = "1"
          printf '%s' "$PREIMPORT_WORKFLOW_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$PREIMPORT_WORKFLOW_REF" | grep -Eq \
            '^refs/heads/ops/alice-preimport-[a-z0-9-]+-20260828$'
          printf '%s' "$PREIMPORT_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$PREIMPORT_ARTIFACT_DIGEST" | grep -Eq \
            '^sha256:[a-f0-9]{64}$'
          test "$PREIMPORT_ARTIFACT_NAME" = \
            "alice-preimport-${SOURCE_SHA}-${PREIMPORT_RUN_ID}-${PREIMPORT_RUN_ATTEMPT}"
          printf '%s' "$SOURCE_RUNTIME_IMAGE" | grep -Eq \
            '^ghcr\.io/rndrntwrk/milaidy-agent@sha256:[a-f0-9]{64}$'
          printf '%s' "$RUNTIME_REVISION" | grep -Eq \
            '^(49|[5-9][0-9]|[1-9][0-9]{2,})$'
          printf '%s' "$RELEASE_EPOCH" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$POLICY_HASH" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s' "$ARTIFACT_NAME" | grep -Eq "^alice-worker-bundles-${SOURCE_SHA}-${BUILD_RUN_ID}-[1-9][0-9]*$"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/alice-production-core-2026-08-22" \
            --jq .object.sha)" = "$SOURCE_SHA"

          watchdog_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}")"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_branch)" = \
            "release/alice-production-core-2026-08-22"
          test "$(printf '%s' "$watchdog_json" | jq -r .event)" = "push"
          test "$(printf '%s' "$watchdog_json" | jq -r .run_attempt)" = "1"
          test "$(printf '%s' "$watchdog_json" | jq -r .path)" = \
            ".github/workflows/recover-alice-production-watchdog.yml"
          test "$(printf '%s' "$watchdog_json" | jq -r .status)" = "in_progress"
          test "$(printf '%s' "$watchdog_json" | jq -r .conclusion)" = "null"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$run_json" | jq -r .head_branch)" = "release/alice-production-core-2026-08-22"
          test "$(printf '%s' "$run_json" | jq -r .event)" = "workflow_dispatch"
          test "$(printf '%s' "$run_json" | jq -r .run_attempt)" = "1"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = "success"
          test "$(printf '%s' "$run_json" | jq -r .path)" = ".github/workflows/build-cloud-agent.yml"

          artifact_record="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | [.digest, .expired] | @tsv")"
          artifact_record_count="$(printf '%s' "$artifact_record" | awk 'NF { count++ } END { print count + 0 }')"
          test "$artifact_record_count" = "1"
          test "$(printf '%s' "$artifact_record" | cut -f1)" = "$ARTIFACT_DIGEST"
          test "$(printf '%s' "$artifact_record" | cut -f2)" = "false"

          preimport_run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREIMPORT_RUN_ID}")"
          test "$(printf '%s' "$preimport_run_json" | jq -r .head_sha)" = \
            "$PREIMPORT_WORKFLOW_SHA"
          test "refs/heads/$(printf '%s' "$preimport_run_json" | jq -r .head_branch)" = \
            "$PREIMPORT_WORKFLOW_REF"
          test "$(printf '%s' "$preimport_run_json" | jq -r .event)" = \
            "workflow_dispatch"
          test "$(printf '%s' "$preimport_run_json" | jq -r .run_attempt)" = \
            "$PREIMPORT_RUN_ATTEMPT"
          test "$(printf '%s' "$preimport_run_json" | jq -r .conclusion)" = \
            "success"
          test "$(printf '%s' "$preimport_run_json" | jq -r .path)" = \
            ".github/workflows/alice-cloudflare-container-bringup.yml"

          preimport_record="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREIMPORT_ARTIFACT_ID}")"
          test "$(printf '%s' "$preimport_record" | jq -r .name)" = \
            "$PREIMPORT_ARTIFACT_NAME"
          test "$(printf '%s' "$preimport_record" | jq -r .digest)" = \
            "$PREIMPORT_ARTIFACT_DIGEST"
          test "$(printf '%s' "$preimport_record" | jq -r .expired)" = "false"
          test "$(printf '%s' "$preimport_record" | jq -r .workflow_run.id)" = \
            "$PREIMPORT_RUN_ID"
          preimport_artifact_record="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREIMPORT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${PREIMPORT_ARTIFACT_NAME}\") | [.id, .digest, .expired] | @tsv")"
          preimport_artifact_record_count="$(printf '%s' "$preimport_artifact_record" | \
            awk 'NF { count++ } END { print count + 0 }')"
          test "$preimport_artifact_record_count" = "1"
          test "$(printf '%s' "$preimport_artifact_record" | cut -f1)" = \
            "$PREIMPORT_ARTIFACT_ID"
          test "$(printf '%s' "$preimport_artifact_record" | cut -f2)" = \
            "$PREIMPORT_ARTIFACT_DIGEST"
          test "$(printf '%s' "$preimport_artifact_record" | cut -f3)" = "false"

      - name: Hydrate exact reviewed Eliza PR head
        env:
          EXPECTED_ELIZA_SHA: c23902bf3f43969736bb9a0f52c99f32239b8aab
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules --get submodule.eliza.url)" = \
            "https://github.com/rndrntwrk/eliza.git"
          test "$(git config -f .gitmodules --get submodule.eliza.branch)" = \
            "alice/runtime-stable-2026-08-22"
          reviewed_eliza_ref="refs/pull/6/head"
          eliza_sha="$(git ls-tree HEAD eliza | awk '{print $3}')"
          test "$eliza_sha" = "$EXPECTED_ELIZA_SHA"
          git clone --no-checkout --filter=blob:none \
            https://github.com/rndrntwrk/eliza.git eliza
          git -C eliza fetch --depth=1 origin \
            "$reviewed_eliza_ref:refs/remotes/origin/alice-reviewed-pr-6"
          reviewed_eliza_sha="$(git -C eliza rev-parse \
            refs/remotes/origin/alice-reviewed-pr-6)"
          test "$reviewed_eliza_sha" = "$EXPECTED_ELIZA_SHA"
          test "$eliza_sha" = "$reviewed_eliza_sha"
          git -C eliza fetch --depth=1 origin "$eliza_sha"
          git -C eliza checkout --detach "$eliza_sha"
          test "$(git -C eliza rev-parse HEAD)" = "$eliza_sha"
          test -f eliza/package.json

      - name: Establish global mutation cutoff and recovery reserve
        run: |
          set -euo pipefail
          node deploy/modal/alice_release_deadline.mjs initialize >> "$GITHUB_ENV"

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Bind exact protected tool paths
        run: |
          set -euo pipefail
          echo "ALICE_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Install exact release dependencies
        run: bash scripts/alice-frozen-install-retry.sh

      - name: Download immutable Worker bundle artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: ${{ inputs.worker_artifact_name }}
          path: ${{ runner.temp }}/alice-worker-bundles

      - name: Download exact preimport evidence artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preimport_run_id }}
          artifact-ids: ${{ inputs.preimport_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/alice-preimport-evidence

      - name: Verify exact source runtime image and derive immutable identities
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          ELIZA_SHA: c23902bf3f43969736bb9a0f52c99f32239b8aab
        run: |
          set -euo pipefail
          printf '%s' "$RUNTIME_IMAGE" | grep -Eq '^ghcr\.io/rndrntwrk/milaidy-agent@sha256:[a-f0-9]{64}$'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://${RUNTIME_IMAGE}" \
            --repo rndrntwrk/milaidy \
            --signer-workflow rndrntwrk/milaidy/.github/workflows/build-cloud-agent.yml \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/release/alice-production-core-2026-08-22 \
            --deny-self-hosted-runners
          docker pull --platform linux/amd64 "$RUNTIME_IMAGE"
          test "$(docker image inspect "$RUNTIME_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          runtime_build_manifest_sha256="$(docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            "$RUNTIME_IMAGE" \
            --input-type=module \
            -e 'import fs from "node:fs"; import crypto from "node:crypto"; const bytes = fs.readFileSync("/app/alice-runtime-build-manifest.json"); process.stdout.write(`sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`);')"
          printf '%s' "$runtime_build_manifest_sha256" | grep -Eq '^sha256:[a-f0-9]{64}$'
          capability_bom_sha256="$(docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            "$RUNTIME_IMAGE" \
            --input-type=module \
            -e 'import fs from "node:fs"; import crypto from "node:crypto"; const bytes = fs.readFileSync("/app/alice-capability-bom.json"); process.stdout.write(`sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`);')"
          printf '%s' "$capability_bom_sha256" | grep -Eq '^sha256:[a-f0-9]{64}$'
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            --env ALICE_SOURCE_COMMIT="$SOURCE_SHA" \
            --env ALICE_ELIZA_COMMIT="$ELIZA_SHA" \
            --env ALICE_RUNTIME_BUILD_MANIFEST_SHA256="$runtime_build_manifest_sha256" \
            --env ALICE_CAPABILITY_BOM_SHA256="$capability_bom_sha256" \
            "$RUNTIME_IMAGE" \
            deploy/modal/verify_alice_runtime_build_manifest.mjs
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            --env ALICE_CAPABILITY_BOM_SHA256="$capability_bom_sha256" \
            "$RUNTIME_IMAGE" \
            --import ./node_modules/tsx/dist/loader.mjs \
            deploy/modal/verify_alice_capability_bom.mjs
          echo "ALICE_RUNTIME_BUILD_MANIFEST_SHA256=$runtime_build_manifest_sha256" >> "$GITHUB_ENV"
          echo "ALICE_CAPABILITY_BOM_SHA256=$capability_bom_sha256" >> "$GITHUB_ENV"

      - name: Verify immutable Worker attestations before unrouted fail-closed bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-worker-bundles.json" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-access-gateway/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-production-control/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-ai-gateway/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-state-plane/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-connector-plane/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-state-plane/migrations/0001_alice_state.sql" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-state-plane/migrations/0002_execution_records.sql" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-state-plane/migrations/0003_eliza_database.sql"
          do
            gh attestation verify "$subject" \
              --repo rndrntwrk/milaidy \
              --signer-workflow rndrntwrk/milaidy/.github/workflows/build-cloud-agent.yml \
              --source-digest "$SOURCE_SHA" \
              --source-ref refs/heads/release/alice-production-core-2026-08-22 \
              --deny-self-hosted-runners
          done

      - name: Verify exact preimport evidence and bind immutable Cloudflare image
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SOURCE_IMAGE: ${{ inputs.runtime_image }}
          EXPECTED_RUNTIME_REVISION: ${{ inputs.runtime_revision }}
          PREIMPORT_ROOT: ${{ runner.temp }}/alice-preimport-evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import {
            verifyAliceCloudflareContainerImageEvidence,
          } from "./deploy/modal/alice_cloudflare_container_image.mjs";
          import {
            verifyAliceDeploymentManifest,
          } from "./deploy/modal/alice_deployment_manifest.mjs";

          const root = process.env.PREIMPORT_ROOT;
          const expectedFiles = [
            "alice-deployment-manifest.json",
            "container-image-evidence.json",
            "deployment-output-digests.json",
            "provider-readback.json",
          ];
          const actualFiles = fs.readdirSync(root).sort();
          if (JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)) {
            throw new Error("ALICE_PREIMPORT_EVIDENCE_INVALID");
          }
          const bytes = {};
          for (const name of expectedFiles) {
            const filePath = path.join(root, name);
            const stat = fs.lstatSync(filePath);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size === 0) {
              throw new Error("ALICE_PREIMPORT_EVIDENCE_INVALID");
            }
            bytes[name] = fs.readFileSync(filePath);
          }
          const digest = (value) =>
            `sha256:${crypto.createHash("sha256").update(value).digest("hex")}`;
          const output = JSON.parse(bytes["deployment-output-digests.json"]);
          const exactOutputKeys = [
            "buildRunId",
            "containerImageEvidenceSha256",
            "deploymentManifestSha256",
            "providerReadbackSha256",
            "runtimeImage",
            "schemaVersion",
            "sourceSha",
            "watchdogRunId",
          ].sort();
          if (
            JSON.stringify(Object.keys(output).sort()) !==
              JSON.stringify(exactOutputKeys) ||
            output.schemaVersion !== "alice.preimport-output-digests.v1" ||
            output.sourceSha !== process.env.SOURCE_SHA ||
            output.buildRunId !== process.env.BUILD_RUN_ID ||
            output.watchdogRunId !== process.env.RECOVERY_WATCHDOG_RUN_ID ||
            output.deploymentManifestSha256 !==
              digest(bytes["alice-deployment-manifest.json"]) ||
            output.providerReadbackSha256 !==
              digest(bytes["provider-readback.json"]) ||
            output.containerImageEvidenceSha256 !==
              digest(bytes["container-image-evidence.json"])
          ) {
            throw new Error("ALICE_PREIMPORT_EVIDENCE_INVALID");
          }
          const manifest = verifyAliceDeploymentManifest(
            bytes["alice-deployment-manifest.json"].toString("utf8"),
          );
          JSON.parse(bytes["provider-readback.json"].toString("utf8"));
          const evidence = verifyAliceCloudflareContainerImageEvidence(
            JSON.parse(bytes["container-image-evidence.json"].toString("utf8")),
          );
          if (
            evidence.sourceCommit !== process.env.SOURCE_SHA ||
            evidence.sourceImage !== process.env.EXPECTED_SOURCE_IMAGE ||
            evidence.runtimeRevision !==
              Number(process.env.EXPECTED_RUNTIME_REVISION) ||
            evidence.runtimeBuildManifestSha256 !==
              process.env.ALICE_RUNTIME_BUILD_MANIFEST_SHA256 ||
            evidence.capabilityBomSha256 !==
              process.env.ALICE_CAPABILITY_BOM_SHA256 ||
            evidence.runtimeImage !== output.runtimeImage ||
            manifest.source.sourceCommit !== process.env.SOURCE_SHA ||
            manifest.source.runtimeImage !== evidence.runtimeImage ||
            manifest.release.runtimeRevision !== evidence.runtimeRevision
          ) {
            throw new Error("ALICE_PREIMPORT_EVIDENCE_INVALID");
          }
          fs.mkdirSync(path.join(process.env.RUNNER_TEMP, "alice-release"), {
            recursive: true,
          });
          fs.copyFileSync(
            path.join(root, "container-image-evidence.json"),
            path.join(process.env.RUNNER_TEMP, "alice-release", "container-image-evidence.json"),
            fs.constants.COPYFILE_EXCL,
          );
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `ALICE_CLOUDFLARE_RUNTIME_IMAGE=${evidence.runtimeImage}`,
              `ALICE_CLOUDFLARE_RUNTIME_TAG=${evidence.tag}`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Revalidate protected head before first provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/alice-production-core-2026-08-22" \
            --jq .object.sha)"
          test "$protected_sha" = "$SOURCE_SHA"

      - name: Verify Cloudflare recovery readiness before first mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readiness_root="${RUNNER_TEMP}/alice-watchdog-readiness"
          mkdir -p "$readiness_root" "${RUNNER_TEMP}/alice-release"
          provider=cloudflare
          artifact_name="alice-watchdog-ready-${provider}-${SOURCE_SHA}-${RECOVERY_WATCHDOG_RUN_ID}-1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_json=''
          for attempt in $(seq 1 120)
          do
            artifacts_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}/artifacts?per_page=100")"
            matches="$(printf '%s' "$artifacts_json" | jq \
              --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)]')"
            count="$(printf '%s' "$matches" | jq 'length')"
            test "$count" = "0" || test "$count" = "1"
            if test "$count" = "1"
            then
              artifact_json="$(printf '%s' "$matches" | jq '.[0]')"
              break
            fi
            sleep 5
          done
          test -n "$artifact_json"
          mkdir "$readiness_root/$provider"
          gh run download "$RECOVERY_WATCHDOG_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$readiness_root/$provider"
          readiness="$readiness_root/$provider/readiness.json"
          test -f "$readiness"
          jq -e \
            --arg source "$SOURCE_SHA" \
            --arg watchdog "$RECOVERY_WATCHDOG_RUN_ID" \
            --arg parent "$GITHUB_RUN_ID" \
            --arg provider "$provider" \
            '.schemaVersion == 1 and
             .sourceSha == $source and
             (.watchdogRunId | tostring) == $watchdog and
             .watchdogRunAttempt == 1 and
             (.parentRunId | tostring) == $parent and
             .parentRunAttempt == 1 and
             .provider == $provider and
             .providerReadback == "verified" and
             (.credentialIdSha256 | test("^sha256:[a-f0-9]{64}$")) and
