            "$readiness" >/dev/null
          cp -- "$readiness" \
            "${RUNNER_TEMP}/alice-release/watchdog-${provider}-readiness.json"

          watchdog_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}")"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$watchdog_json" | jq -r .status)" = "in_progress"
          test "$(printf '%s' "$watchdog_json" | jq -r .conclusion)" = "null"
          jobs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}/jobs?filter=all&per_page=100")"
          job_matches="$(printf '%s' "$jobs_json" | jq \
            --arg name "Prestarted independent Cloudflare recovery" \
            '[.jobs[] | select(.name == $name and .run_attempt == 1 and
              .status == "in_progress" and .conclusion == null)]')"
          test "$(printf '%s' "$job_matches" | jq 'length')" = "1"

