  accept:
    name: Independently recover and accept terminal Alice
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: alice-production-cloudflare-recovery
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Checkout exact promoted release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate independent recovery-operator source
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$GITHUB_REF" = "refs/heads/release/alice-production-core-2026-08-22"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Download exact qualified candidate evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: alice-qualified-candidate-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-release

      - name: Validate exact qualified candidate handoff
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/alice-release"
          for required in \
            alice-deployment-manifest.json \
            program-admission.json \
            deployment-pause-evidence.json \
            rollback-anchor.json \
            cloudflare-rollback-proof.json \
            live-readback.json \
            container-image-evidence.json
          do
            test -s "$release_root/$required"
          done
          test "$(jq -r .sourceCommit "$release_root/program-admission.json")" = "$SOURCE_SHA"
          test "$(jq -r .source.sourceCommit "$release_root/alice-deployment-manifest.json")" = "$SOURCE_SHA"

      - name: Prove terminal authenticated Alice production acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALICE_OWNER_AUTHORIZATION: ${{ secrets.ALICE_OWNER_AUTHORIZATION }}
          ALICE_ACCESS_ISSUER: https://rndrntwrk.cloudflareaccess.com
          ALICE_ACCESS_AUDIENCE: ${{ secrets.ALICE_ACCESS_AUDIENCE }}
          ALICE_OWNER_EMAIL_SHA256: ${{ secrets.ALICE_OWNER_EMAIL_SHA256 }}
          ALICE_CONTROL_RECOVERY_TOKEN: ${{ secrets.ALICE_CONTROL_RECOVERY_TOKEN }}
          ALICE_RELEASE_ACCESS_CLIENT_ID: ${{ secrets.ALICE_RELEASE_ACCESS_CLIENT_ID }}
          ALICE_RELEASE_ACCESS_CLIENT_SECRET: ${{ secrets.ALICE_RELEASE_ACCESS_CLIENT_SECRET }}
          ALICE_DEPLOYMENT_PAUSE_TOKEN: ${{ secrets.ALICE_DEPLOYMENT_PAUSE_TOKEN }}
          ALICE_DEPLOYMENT_RUN_ID: ${{ github.run_id }}
          ALICE_DEPLOYMENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALICE_RECOVERY_OPERATOR_RUN_ID: ${{ github.run_id }}
          ALICE_RECOVERY_OPERATOR_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALICE_RECOVERY_OPERATOR_JOB: accept
          ALICE_EXPECTED_WORKFLOW_CONCLUSION: success
          ALICE_DEPLOYMENT_MANIFEST_PATH: ${{ runner.temp }}/alice-release/alice-deployment-manifest.json
          ALICE_PROGRAM_ADMISSION_EVIDENCE_PATH: ${{ runner.temp }}/alice-release/program-admission.json
          ALICE_DEPLOYMENT_PAUSE_EVIDENCE_PATH: ${{ runner.temp }}/alice-release/deployment-pause-evidence.json
          ALICE_CLOUDFLARE_ROLLBACK_ANCHOR_PATH: ${{ runner.temp }}/alice-release/rollback-anchor.json
          ALICE_CLOUDFLARE_ROLLBACK_PROOF_PATH: ${{ runner.temp }}/alice-release/cloudflare-rollback-proof.json
          ALICE_CLOUDFLARE_READBACK_PATH: ${{ runner.temp }}/alice-release/live-readback.json
          ALICE_CONTAINER_IMAGE_EVIDENCE_PATH: ${{ runner.temp }}/alice-release/container-image-evidence.json
          ALICE_PRODUCTION_ACCEPTANCE_PATH: ${{ runner.temp }}/alice-release/alice-production-acceptance.json
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1200s \
            "$(command -v bun)" deploy/modal/alice_production_acceptance.ts

      - name: Remove recovery-operator ephemeral material before publication
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/alice-recovery-operator-private" 2>/dev/null || true

      - name: Persist terminal production acceptance evidence as final success action
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-production-acceptance-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alice-release/alice-deployment-manifest.json
            ${{ runner.temp }}/alice-release/provider-readback.json
            ${{ runner.temp }}/alice-release/continuity-readback.json
            ${{ runner.temp }}/alice-release/durable-object-namespace-ids.json
            ${{ runner.temp }}/alice-release/rollback-anchor.json
            ${{ runner.temp }}/alice-release/cloudflare-rollback-proof.json
            ${{ runner.temp }}/alice-release/live-readback.json
            ${{ runner.temp }}/alice-release/program-admission.json
            ${{ runner.temp }}/alice-release/container-image-evidence.json
            ${{ runner.temp }}/alice-release/alice-production-acceptance.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  recover-cloudflare:
    name: Independently restore Cloudflare after deploy-job loss
    needs: [deploy, accept]
    if: ${{ always() && (needs.deploy.result != 'success' || needs.accept.result != 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: alice-production-cloudflare-recovery
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Checkout exact failed release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate trusted recovery source before setup or secrets
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$GITHUB_REF" = "refs/heads/release/alice-production-core-2026-08-22"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Hydrate exact reviewed Eliza PR head
        env:
          EXPECTED_ELIZA_SHA: c23902bf3f43969736bb9a0f52c99f32239b8aab
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules --get submodule.eliza.url)" = \
            "https://github.com/rndrntwrk/eliza.git"
          test "$(git config -f .gitmodules --get submodule.eliza.branch)" = \
            "alice/runtime-stable-2026-08-22"
          reviewed_eliza_ref="refs/pull/6/head"
          eliza_sha="$(git ls-tree HEAD eliza | awk '{print $3}')"
          test "$eliza_sha" = "$EXPECTED_ELIZA_SHA"
          git clone --no-checkout --filter=blob:none \
            https://github.com/rndrntwrk/eliza.git eliza
          git -C eliza fetch --depth=1 origin \
            "$reviewed_eliza_ref:refs/remotes/origin/alice-reviewed-pr-6"
          reviewed_eliza_sha="$(git -C eliza rev-parse \
            refs/remotes/origin/alice-reviewed-pr-6)"
          test "$reviewed_eliza_sha" = "$EXPECTED_ELIZA_SHA"
          test "$eliza_sha" = "$reviewed_eliza_sha"
          git -C eliza fetch --depth=1 origin "$eliza_sha"
          git -C eliza checkout --detach "$eliza_sha"
          test "$(git -C eliza rev-parse HEAD)" = "$eliza_sha"
          test -f eliza/package.json

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install exact recovery dependencies
        run: bash scripts/alice-frozen-install-retry.sh

      - name: Consume external journal and recover Cloudflare independently
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
        run: |
          set -euo pipefail
          recovery_root="${RUNNER_TEMP}/alice-independent-cloudflare-recovery"
          terminal_root="${RUNNER_TEMP}/alice-independent-cloudflare-terminal"
          mkdir -p "$recovery_root" "$terminal_root"
          artifacts_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          download_optional() {
            artifact_name="$1"
            destination="$2"
            count="$(printf '%s' "$artifacts_json" | jq \
              --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            if test "$count" = "1"
            then
              timeout --signal=TERM --kill-after=10s 120s gh run download \
                "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "$destination"
            elif test "$count" != "0"
            then
              exit 1
            fi
          }
          download_optional \
            "alice-cloudflare-anchor-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$recovery_root"
          if test ! -f "$recovery_root/alice-release/rollback-anchor.json"
          then
            exit 0
          fi
          for worker in \
            alice-access-gateway \
            alice-production-control \
            alice-ai-gateway \
            alice-state-plane \
            alice-connector-plane
          do
            test -s "$recovery_root/alice-worker-bundles/$worker/index.js"
            test ! -L "$recovery_root/alice-worker-bundles/$worker/index.js"
          done
          for migration in \
            0001_alice_state.sql \
            0002_execution_records.sql \
            0003_eliza_database.sql
          do
            test -s "$recovery_root/alice-worker-bundles/alice-state-plane/migrations/$migration"
            test ! -L "$recovery_root/alice-worker-bundles/alice-state-plane/migrations/$migration"
          done
          download_optional \
            "alice-recovery-evidence-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$terminal_root"
          if test -f "$terminal_root/cloudflare-emergency-rollback.json"
          then
            exit 0
          fi
          manifest="$recovery_root/alice-release/alice-deployment-manifest.json"
          manifest_sha256="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
          export ALICE_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export ALICE_SOURCE_COMMIT="$SOURCE_SHA"
          export ALICE_RELEASE_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export ALICE_WRANGLER_BIN="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          export ALICE_BUN_BIN="$(command -v bun)"
          export ALICE_WORKER_BUNDLE_ROOT="$recovery_root/alice-worker-bundles"
          export ALICE_WORKER_BUNDLE_ARTIFACT_PATH="$recovery_root/alice-worker-bundles/alice-worker-bundles.json"
          export ALICE_DEPLOYMENT_MANIFEST_PATH="$manifest"
          export ALICE_WRANGLER_OUTPUT_DIR="$recovery_root/alice-release/wrangler"
          export ALICE_CLOUDFLARE_ROLLBACK_ANCHOR_PATH="$recovery_root/alice-release/rollback-anchor.json"
          export ALICE_CLOUDFLARE_PREPARE_EVIDENCE_PATH="$recovery_root/alice-release/cloudflare-prepare-evidence.json"
          export ALICE_DEPLOYMENT_PAUSE_EVIDENCE_PATH="$recovery_root/alice-release/deployment-pause-evidence.json"
          export ALICE_CLOUDFLARE_READBACK_PATH="$recovery_root/alice-release/cloudflare-independent-recovery.json"
          export ALICE_CLOUDFLARE_ROLLBACK_PROOF_PATH="$recovery_root/alice-release/cloudflare-independent-rollback-proof.json"
          export ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH="$recovery_root/alice-release/durable-object-namespace-ids.json"
          export ALICE_PROGRAM_ADMISSION_EVIDENCE_PATH="$recovery_root/alice-release/program-admission.json"
          export ALICE_CLOUDFLARE_RELEASE_PHASE=rollback
          export ALICE_PRODUCTION_RELEASE_CONFIRM="${SOURCE_SHA}:${manifest_sha256}"
          timeout --signal=TERM --kill-after=30s 900s \
            node deploy/modal/alice_cloudflare_release.mjs

      - name: Preserve independent Cloudflare recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-independent-cloudflare-recovery-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-independent-cloudflare-recovery/alice-release/cloudflare-independent-recovery.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false
