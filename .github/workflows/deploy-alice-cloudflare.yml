name: Deploy Alice Cloudflare Production
run-name: Alice production deploy watchdog-${{ inputs.recovery_watchdog_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact protected Alice release commit"
        required: true
        type: string
      recovery_watchdog_run_id:
        description: "In-progress protected push recovery watchdog run ID"
        required: true
        type: string
      build_run_id:
        description: "Successful Build Cloud Agent run ID for source_sha"
        required: true
        type: string
      worker_artifact_name:
        description: "Immutable Worker bundle artifact name from build_run_id"
        required: true
        type: string
      worker_artifact_digest:
        description: "Server-reported sha256 digest of the immutable artifact"
        required: true
        type: string
      runtime_image:
        description: "Smoke-qualified GHCR image pinned by sha256 digest"
        required: true
        type: string
      release_epoch:
        description: "Signed Program release epoch"
        required: true
        type: number
      modal_revision:
        description: "Admitted Modal Alice revision"
        required: true
        type: number
      policy_hash:
        description: "Exact signed Alice policy sha256"
        required: true
        type: string

concurrency:
  group: alice-cloudflare-production
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

jobs:
  deploy:
    name: Promote attested Alice Worker bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: alice-production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RECOVERY_WATCHDOG_RUN_ID: ${{ inputs.recovery_watchdog_run_id }}

    steps:
      - name: Checkout exact protected release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Enforce protected source and build identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_NAME: ${{ inputs.worker_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.worker_artifact_digest }}
          EXPECTED_REF: refs/heads/release/alice-production-core-2026-08-22
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$RECOVERY_WATCHDOG_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$BUILD_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          printf '%s' "$ARTIFACT_NAME" | grep -Eq "^alice-worker-bundles-${SOURCE_SHA}-${BUILD_RUN_ID}-[1-9][0-9]*$"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/alice-production-core-2026-08-22" \
            --jq .object.sha)" = "$SOURCE_SHA"

          watchdog_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}")"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_branch)" = \
            "release/alice-production-core-2026-08-22"
          test "$(printf '%s' "$watchdog_json" | jq -r .event)" = "push"
          test "$(printf '%s' "$watchdog_json" | jq -r .run_attempt)" = "1"
          test "$(printf '%s' "$watchdog_json" | jq -r .path)" = \
            ".github/workflows/recover-alice-production-watchdog.yml"
          test "$(printf '%s' "$watchdog_json" | jq -r .status)" = "in_progress"
          test "$(printf '%s' "$watchdog_json" | jq -r .conclusion)" = "null"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$run_json" | jq -r .head_branch)" = "release/alice-production-core-2026-08-22"
          test "$(printf '%s' "$run_json" | jq -r .event)" = "workflow_dispatch"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = "success"
          test "$(printf '%s' "$run_json" | jq -r .path)" = ".github/workflows/build-cloud-agent.yml"

          artifact_record="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | [.digest, .expired] | @tsv")"
          test "$(printf '%s' "$artifact_record" | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s' "$artifact_record" | cut -f1)" = "$ARTIFACT_DIGEST"
          test "$(printf '%s' "$artifact_record" | cut -f2)" = "false"

      - name: Hydrate exact protected Eliza workspace
        env:
          EXPECTED_ELIZA_SHA: e219c232e21d8b61017129647130830d811ee45a
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules --get submodule.eliza.url)" = \
            "https://github.com/rndrntwrk/eliza.git"
          test "$(git config -f .gitmodules --get submodule.eliza.branch)" = \
            "alice/runtime-stable-2026-08-22"
          eliza_sha="$(git ls-tree HEAD eliza | awk '{print $3}')"
          test "$eliza_sha" = "$EXPECTED_ELIZA_SHA"
          git clone --no-checkout --filter=blob:none \
            https://github.com/rndrntwrk/eliza.git eliza
          git -C eliza fetch --depth=1 origin \
            refs/heads/alice/runtime-stable-2026-08-22:refs/remotes/origin/alice/runtime-stable-2026-08-22
          protected_eliza_sha="$(git -C eliza rev-parse \
            refs/remotes/origin/alice/runtime-stable-2026-08-22)"
          test "$protected_eliza_sha" = "$EXPECTED_ELIZA_SHA"
          test "$eliza_sha" = "$protected_eliza_sha"
          git -C eliza fetch --depth=1 origin "$eliza_sha"
          git -C eliza checkout --detach "$eliza_sha"
          test "$(git -C eliza rev-parse HEAD)" = "$eliza_sha"
          test -f eliza/package.json

      - name: Establish global mutation cutoff and recovery reserve
        run: |
          set -euo pipefail
          node deploy/modal/alice_release_deadline.mjs initialize >> "$GITHUB_ENV"

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Python 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Bind exact protected tool paths
        run: |
          set -euo pipefail
          echo "ALICE_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"

      - name: Install exact Modal 1.5.4 deployment client
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/alice-modal-client"
          "${RUNNER_TEMP}/alice-modal-client/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement deploy/modal/requirements-modal-1.5.4.lock
          test "$("${RUNNER_TEMP}/alice-modal-client/bin/python" --version)" = "Python 3.13.14"
          test "$("${RUNNER_TEMP}/alice-modal-client/bin/modal" --version)" = \
            "modal client version: 1.5.4"
          echo "ALICE_MODAL_PYTHON_BIN=${RUNNER_TEMP}/alice-modal-client/bin/python" >> "$GITHUB_ENV"
          echo "ALICE_MODAL_BIN=${RUNNER_TEMP}/alice-modal-client/bin/modal" >> "$GITHUB_ENV"

      - name: Install exact release dependencies
        run: bash scripts/alice-frozen-install-retry.sh

      - name: Download immutable Worker bundle artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: ${{ inputs.worker_artifact_name }}
          path: ${{ runner.temp }}/alice-worker-bundles

      - name: Verify exact runtime image and derive build-manifest identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          ELIZA_SHA: e219c232e21d8b61017129647130830d811ee45a
        run: |
          set -euo pipefail
          printf '%s' "$RUNTIME_IMAGE" | grep -Eq '^ghcr\.io/rndrntwrk/milaidy-agent@sha256:[a-f0-9]{64}$'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://${RUNTIME_IMAGE}" \
            --repo rndrntwrk/milaidy \
            --signer-workflow rndrntwrk/milaidy/.github/workflows/build-cloud-agent.yml \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/release/alice-production-core-2026-08-22 \
            --deny-self-hosted-runners
          docker pull --platform linux/amd64 "$RUNTIME_IMAGE"
          test "$(docker image inspect "$RUNTIME_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_SHA"
          runtime_build_manifest_sha256="$(docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            "$RUNTIME_IMAGE" \
            --input-type=module \
            -e 'import fs from "node:fs"; import crypto from "node:crypto"; const bytes = fs.readFileSync("/app/alice-runtime-build-manifest.json"); process.stdout.write(`sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`);')"
          printf '%s' "$runtime_build_manifest_sha256" | grep -Eq '^sha256:[a-f0-9]{64}$'
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            --env ALICE_SOURCE_COMMIT="$SOURCE_SHA" \
            --env ALICE_ELIZA_COMMIT="$ELIZA_SHA" \
            --env ALICE_RUNTIME_BUILD_MANIFEST_SHA256="$runtime_build_manifest_sha256" \
            "$RUNTIME_IMAGE" \
            deploy/modal/verify_alice_runtime_build_manifest.mjs
          echo "ALICE_RUNTIME_BUILD_MANIFEST_SHA256=$runtime_build_manifest_sha256" >> "$GITHUB_ENV"

      - name: Verify immutable Worker attestations before unrouted fail-closed bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-worker-bundles.json" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-access-gateway/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-production-control/index.js" \
            "${RUNNER_TEMP}/alice-worker-bundles/alice-ai-gateway/index.js"
          do
            gh attestation verify "$subject" \
              --repo rndrntwrk/milaidy \
              --signer-workflow rndrntwrk/milaidy/.github/workflows/build-cloud-agent.yml \
              --source-digest "$SOURCE_SHA" \
              --source-ref refs/heads/release/alice-production-core-2026-08-22 \
              --deny-self-hosted-runners
          done

      - name: Revalidate protected head before first provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          protected_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/alice-production-core-2026-08-22" \
            --jq .object.sha)"
          test "$protected_sha" = "$SOURCE_SHA"

      - name: Verify two-way provider recovery readiness before first mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readiness_root="${RUNNER_TEMP}/alice-watchdog-readiness"
          mkdir "$readiness_root" "${RUNNER_TEMP}/alice-release"
          for provider in modal cloudflare
          do
            artifact_name="alice-watchdog-ready-${provider}-${SOURCE_SHA}-${RECOVERY_WATCHDOG_RUN_ID}-1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            artifact_json=''
            for attempt in $(seq 1 120)
            do
              artifacts_json="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}/artifacts?per_page=100")"
              matches="$(printf '%s' "$artifacts_json" | jq \
                --arg name "$artifact_name" \
                '[.artifacts[] | select(.name == $name and .expired == false)]')"
              count="$(printf '%s' "$matches" | jq 'length')"
              test "$count" = "0" || test "$count" = "1"
              if test "$count" = "1"
              then
                artifact_json="$(printf '%s' "$matches" | jq '.[0]')"
                break
              fi
              sleep 5
            done
            test -n "$artifact_json"
            mkdir "$readiness_root/$provider"
            gh run download "$RECOVERY_WATCHDOG_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" \
              --dir "$readiness_root/$provider"
            readiness="$readiness_root/$provider/readiness.json"
            test -f "$readiness"
            jq -e \
              --arg source "$SOURCE_SHA" \
              --arg watchdog "$RECOVERY_WATCHDOG_RUN_ID" \
              --arg parent "$GITHUB_RUN_ID" \
              --arg provider "$provider" \
              '.schemaVersion == 1 and
               .sourceSha == $source and
               (.watchdogRunId | tostring) == $watchdog and
               .watchdogRunAttempt == 1 and
               (.parentRunId | tostring) == $parent and
               .parentRunAttempt == 1 and
               .provider == $provider and
               .providerReadback == "verified" and
               (.credentialIdSha256 | test("^sha256:[a-f0-9]{64}$")) and
               (.credentialPolicySha256 | test("^sha256:[a-f0-9]{64}$"))' \
              "$readiness" >/dev/null
            cp -- "$readiness" \
              "${RUNNER_TEMP}/alice-release/watchdog-${provider}-readiness.json"
          done

          watchdog_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}")"
          test "$(printf '%s' "$watchdog_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$watchdog_json" | jq -r .status)" = "in_progress"
          test "$(printf '%s' "$watchdog_json" | jq -r .conclusion)" = "null"
          jobs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_WATCHDOG_RUN_ID}/jobs?filter=all&per_page=100")"
          for job_name in \
            "Prestarted independent Modal recovery" \
            "Prestarted independent Cloudflare recovery"
          do
            job_matches="$(printf '%s' "$jobs_json" | jq \
              --arg name "$job_name" \
              '[.jobs[] | select(.name == $name and .run_attempt == 1 and
                .status == "in_progress" and .conclusion == null)]')"
            test "$(printf '%s' "$job_matches" | jq 'length')" = "1"
          done

      - name: Bootstrap unrouted fail-closed continuity identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          ALICE_SOURCE_ROOT: ${{ github.workspace }}
          ALICE_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          ALICE_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ALICE_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          ALICE_WORKER_BUNDLE_ROOT: ${{ runner.temp }}/alice-worker-bundles
          ALICE_WORKER_BUNDLE_ARTIFACT_PATH: ${{ runner.temp }}/alice-worker-bundles/alice-worker-bundles.json
          ALICE_BOOTSTRAP_OUTPUT_DIR: ${{ runner.temp }}/alice-bootstrap
          ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH: ${{ runner.temp }}/alice-release/durable-object-namespace-ids.json
          ALICE_CLOUDFLARE_CONTINUITY_READBACK_PATH: ${{ runner.temp }}/alice-release/continuity-readback.json
          ALICE_BOOTSTRAP_PREFLIGHT_PATH: ${{ runner.temp }}/alice-release/bootstrap-preflight.json
          ALICE_BOOTSTRAP_STATE_PATH: ${{ runner.temp }}/alice-release/bootstrap-state.json
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/alice-release"
          phase_seconds="$(node deploy/modal/alice_release_deadline.mjs mutation)"
          timeout --signal=TERM --kill-after=30s "${phase_seconds}s" \
            node deploy/modal/alice_cloudflare_bootstrap.mjs

      - name: Assert independently preprovisioned recovery boundary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          ALICE_SOURCE_ROOT: ${{ github.workspace }}
          ALICE_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          ALICE_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          ALICE_BOOTSTRAP_CONTROL_CONFIG_PATH: ${{ runner.temp }}/alice-bootstrap/control.bootstrap.wrangler.json
          ALICE_BOOTSTRAP_STATE_PATH: ${{ runner.temp }}/alice-release/bootstrap-state.json
        run: |
          set -euo pipefail
          phase_seconds="$(node deploy/modal/alice_release_deadline.mjs mutation)"
          timeout --signal=TERM --kill-after=30s "${phase_seconds}s" \
            node deploy/modal/alice_cloudflare_recovery_preprovision.mjs

      - name: Materialize signed manifest and exact-byte Worker configs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          ALICE_SOURCE_ROOT: ${{ github.workspace }}
          ALICE_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          ALICE_DEPLOYMENT_CONTROLLER_COMMIT: ${{ env.SOURCE_SHA }}
          ALICE_ELIZA_COMMIT: e219c232e21d8b61017129647130830d811ee45a
          ALICE_RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          ALICE_RELEASE_EPOCH: ${{ inputs.release_epoch }}
          ALICE_MODAL_REVISION: ${{ inputs.modal_revision }}
          ALICE_POLICY_HASH: ${{ inputs.policy_hash }}
          ALICE_ROLLBACK_BOUNDARY: "modal:alice-runtime:v${{ inputs.modal_revision }}"
          ALICE_ACCESS_ISSUER: https://rndrntwrk.cloudflareaccess.com
          ALICE_ACCESS_AUDIENCE: ${{ secrets.ALICE_ACCESS_AUDIENCE }}
          ALICE_OWNER_EMAIL_SHA256: ${{ secrets.ALICE_OWNER_EMAIL_SHA256 }}
          ALICE_RELEASE_ACCESS_AUDIENCE: ${{ secrets.ALICE_RELEASE_ACCESS_AUDIENCE }}
          ALICE_RELEASE_SERVICE_TOKEN_ID_SHA256: ${{ secrets.ALICE_RELEASE_SERVICE_TOKEN_ID_SHA256 }}
          ALICE_UPSTREAM_ORIGIN: https://rndrntwrk--alice.modal.run
          ALICE_MODEL_DAILY_BUDGET_UNITS: "10000"
          ALICE_PROGRAM_ENVELOPE_B64: ${{ secrets.ALICE_PROGRAM_ENVELOPE_B64 }}
          ALICE_PROGRAM_SIGNATURE_B64: ${{ secrets.ALICE_PROGRAM_SIGNATURE_B64 }}
          ALICE_PROGRAM_PUBLIC_JWK_B64: ${{ secrets.ALICE_PROGRAM_PUBLIC_JWK_B64 }}
          ALICE_WORKER_BUNDLE_ROOT: ${{ runner.temp }}/alice-worker-bundles
          ALICE_WORKER_BUNDLE_ARTIFACT_PATH: ${{ runner.temp }}/alice-worker-bundles/alice-worker-bundles.json
          ALICE_DEPLOYMENT_MANIFEST_PATH: ${{ runner.temp }}/alice-release/alice-deployment-manifest.json
          ALICE_CLOUDFLARE_PROVIDER_READBACK_PATH: ${{ runner.temp }}/alice-release/provider-readback.json
          ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH: ${{ runner.temp }}/alice-release/durable-object-namespace-ids.json
          ALICE_WRANGLER_OUTPUT_DIR: ${{ runner.temp }}/alice-release/wrangler
        run: |
          set -euo pipefail
          node deploy/modal/alice_deployment_manifest.mjs
          node deploy/modal/alice_cloudflare_config.mjs
          manifest_sha256="sha256:$(sha256sum "${RUNNER_TEMP}/alice-release/alice-deployment-manifest.json" | cut -d' ' -f1)"
          echo "ALICE_PRODUCTION_RELEASE_CONFIRM=${SOURCE_SHA}:${manifest_sha256}" >> "$GITHUB_ENV"

      - name: Derive one release-bound runtime credential set
        env:
          ALICE_WRANGLER_OUTPUT_DIR: ${{ runner.temp }}/alice-release/wrangler
          ALICE_PROGRAM_ADMISSION_EVIDENCE_PATH: ${{ runner.temp }}/alice-release/program-admission.json
          ALICE_RUNTIME_RELEASE_TOKEN_FILE: ${{ runner.temp }}/alice-release/.alice-runtime-release-token
          ALICE_RUNTIME_RELEASE_TOKEN_SHA256_FILE: ${{ runner.temp }}/alice-release/.alice-runtime-release-token-sha256
          ALICE_EVIDENCE_QUEUE_HMAC_KEY_FILE: ${{ runner.temp }}/alice-release/.alice-evidence-queue-hmac-key
          ALICE_ACCESS_CONTROL_SERVICE_TOKEN: ${{ secrets.ALICE_ACCESS_CONTROL_SERVICE_TOKEN }}
          ALICE_ACCESS_GATEWAY_SERVICE_TOKEN: ${{ secrets.ALICE_ACCESS_GATEWAY_SERVICE_TOKEN }}
          ALICE_AI_CONTROL_SERVICE_TOKEN: ${{ secrets.ALICE_AI_CONTROL_SERVICE_TOKEN }}
          ALICE_AI_GATEWAY_SERVICE_TOKEN: ${{ secrets.ALICE_AI_GATEWAY_SERVICE_TOKEN }}
          ALICE_ACCESS_PROXY_SECRET: ${{ secrets.ALICE_ACCESS_PROXY_SECRET }}
          MILADY_CLOUDFLARE_ACCESS_PROXY_SECRET: ${{ secrets.ALICE_ACCESS_PROXY_SECRET }}
          ALICE_MODAL_PROXY_KEY: ${{ secrets.ALICE_MODAL_PROXY_KEY }}
          ALICE_MODAL_PROXY_SECRET: ${{ secrets.ALICE_MODAL_PROXY_SECRET }}
          ALICE_DEPLOYMENT_PAUSE_TOKEN: ${{ secrets.ALICE_DEPLOYMENT_PAUSE_TOKEN }}
          ALICE_RUNTIME_RELEASE_TOKEN_ROOT: ${{ secrets.ALICE_RUNTIME_RELEASE_TOKEN_ROOT }}
          MILADY_API_TOKEN: ${{ secrets.MILADY_API_TOKEN }}
          ELIZA_VAULT_PASSPHRASE: ${{ secrets.ELIZA_VAULT_PASSPHRASE }}
        run: |
          set -euo pipefail
          bun deploy/modal/verify_alice_program_admission.ts
          release_digest="$(jq -r .releaseDigest "${RUNNER_TEMP}/alice-release/program-admission.json")"
          printf '%s' "$release_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "ALICE_MODAL_RELEASE_SECRET_NAME=alice-production-core-${release_digest#sha256:}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Capture immutable Cloudflare rollback journal
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          ALICE_SOURCE_ROOT: ${{ github.workspace }}
          ALICE_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          ALICE_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          ALICE_BUN_BIN: ${{ env.ALICE_BUN_BIN }}
          ALICE_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ALICE_WORKER_BUNDLE_ROOT: ${{ runner.temp }}/alice-worker-bundles
          ALICE_WORKER_BUNDLE_ARTIFACT_PATH: ${{ runner.temp }}/alice-worker-bundles/alice-worker-bundles.json
          ALICE_DEPLOYMENT_MANIFEST_PATH: ${{ runner.temp }}/alice-release/alice-deployment-manifest.json
          ALICE_WRANGLER_OUTPUT_DIR: ${{ runner.temp }}/alice-release/wrangler
          ALICE_CLOUDFLARE_ROLLBACK_ANCHOR_PATH: ${{ runner.temp }}/alice-release/rollback-anchor.json
          ALICE_CLOUDFLARE_PREPARE_EVIDENCE_PATH: ${{ runner.temp }}/alice-release/cloudflare-prepare-evidence.json
