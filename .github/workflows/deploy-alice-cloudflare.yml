          import fs from "node:fs";
          import {
            verifyAliceCloudflareContainerImageEvidence,
          } from "./deploy/modal/alice_cloudflare_container_image.mjs";

          const evidence = verifyAliceCloudflareContainerImageEvidence(
            JSON.parse(fs.readFileSync(process.argv[2], "utf8")),
          );
          const expectedRuntimeImage = process.argv[3];
          const expectedTag = process.argv[4];
          const runtimeDigest = evidence.runtimeDigest;
          if (
            evidence.runtimeImage !== expectedRuntimeImage ||
            evidence.tag !== expectedTag ||
            evidence.runtimeImage !==
              `registry.cloudflare.com/${evidence.accountId}/alice-runtime@${runtimeDigest}`
          ) {
            throw new Error("ALICE_PREIMPORT_REGISTRY_ADMISSION_INVALID");
          }
          NODE

      - name: Capture exact active Durable Object identities read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH: ${{ runner.temp }}/alice-release/durable-object-namespace-ids.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            ALICE_CLOUDFLARE_TARGET,
            canonicalAliceJson,
          } from "./workers/alice-effective-config.js";
          import {
            extractAliceBootstrapNamespaceIds,
          } from "./deploy/modal/alice_cloudflare_bootstrap.mjs";

          const base = "https://api.cloudflare.com/client/v4";
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const outputPath = process.env.ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH;
          const versionId = /^[a-f0-9]{8}-[a-f0-9]{4}-[1-8][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/;
          const workers = {
            access: ALICE_CLOUDFLARE_TARGET.accessWorker,
            control: ALICE_CLOUDFLARE_TARGET.controlWorker,
            statePlane: ALICE_CLOUDFLARE_TARGET.statePlaneWorker,
            connectorPlane: ALICE_CLOUDFLARE_TARGET.connectorPlaneWorker,
          };

          function invalid() {
            throw new Error("ALICE_PREIMPORT_PROVIDER_READ_INVALID");
          }

          async function get(pathname) {
            const response = await fetch(`${base}${pathname}`, {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            });
            let payload;
            try {
              payload = await response.json();
            } catch {
              invalid();
            }
            if (
              !response.ok || payload?.success !== true ||
              !Array.isArray(payload?.errors) || payload.errors.length !== 0
            ) invalid();
            return payload.result;
          }

          async function capture() {
            const versions = { aiGateway: null };
            for (const [role, worker] of Object.entries(workers)) {
              const deployments = await get(
                `/accounts/${accountId}/workers/scripts/${worker}/deployments`,
              );
              const active = deployments?.deployments?.[0];
              if (
                !Array.isArray(active?.versions) || active.versions.length !== 1 ||
                active.versions[0]?.percentage !== 100 ||
                !versionId.test(active.versions[0]?.version_id ?? "")
              ) invalid();
              const id = active.versions[0].version_id;
              versions[role] = await get(
                `/accounts/${accountId}/workers/scripts/${worker}/versions/${id}`,
              );
            }
            return extractAliceBootstrapNamespaceIds(versions);
          }

          const verify = await get("/user/tokens/verify");
          if (verify?.status !== "active" || !/^[a-f0-9]{32}$/.test(verify?.id ?? "")) {
            invalid();
          }
          const first = await capture();
          const second = await capture();
          if (canonicalAliceJson(first) !== canonicalAliceJson(second)) invalid();
          fs.writeFileSync(outputPath, `${canonicalAliceJson(second)}\n`, {
            encoding: "utf8",
            flag: "wx",
            mode: 0o444,
          });
          NODE

