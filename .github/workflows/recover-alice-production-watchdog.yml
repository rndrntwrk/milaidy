name: Recover Alice Production Watchdog
run-name: Alice production recovery watchdog ${{ github.sha }}

on:
  push:
    branches:
      - release/alice-production-core-2026-08-22

concurrency:
  group: alice-production-recovery-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  recover-modal:
    name: Prestarted independent Modal recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: alice-production-modal-recovery
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact protected push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate exact protected push source
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$GITHUB_REF" = "refs/heads/release/alice-production-core-2026-08-22"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Python 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Install exact Modal 1.5.4 recovery client
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/alice-modal-recovery-client"
          "${RUNNER_TEMP}/alice-modal-recovery-client/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement deploy/modal/requirements-modal-1.5.4.lock
          test "$("${RUNNER_TEMP}/alice-modal-recovery-client/bin/modal" --version)" = \
            "modal client version: 1.5.4"

      - name: Verify Modal recovery credential and provider readback
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          readback="${RUNNER_TEMP}/alice-modal-recovery-readback.json"
          timeout --signal=TERM --kill-after=10s 120s \
            "${RUNNER_TEMP}/alice-modal-recovery-client/bin/python" \
            deploy/modal/alice_modal_provider_readback.py --capture-current \
            > "$readback"
          jq -e \
            '.environment == "main" and
             (.appId | test("^ap-[A-Za-z0-9]{20,32}$")) and
             (.providerVersion | type == "number")' "$readback" >/dev/null

      - name: Select one exact parent deployment
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="Alice production deploy watchdog-${GITHUB_RUN_ID}"
          parent_json=''
          for attempt in $(seq 1 360)
          do
            runs_json="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-alice-cloudflare.yml/runs?branch=release%2Falice-production-core-2026-08-22&event=workflow_dispatch&per_page=100")"
            matches="$(printf '%s' "$runs_json" | jq \
              --arg title "$expected_title" --arg sha "$SOURCE_SHA" \
              '[.[].workflow_runs[] |
                select(.display_title == $title and .head_sha == $sha and
                  .run_attempt == 1 and
                  .path == ".github/workflows/deploy-alice-cloudflare.yml")] |
                sort_by(.id)')"
            count="$(printf '%s' "$matches" | jq 'length')"
            if test "$count" -ge 1
            then
              parent_json="$(printf '%s' "$matches" | jq '.[0]')"
              break
            fi
            sleep 15
          done
          test -n "$parent_json"
          parent_run_id="$(printf '%s' "$parent_json" | jq -r .id)"
          printf '%s' "$parent_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$parent_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$parent_json" | jq -r .display_title)" = "$expected_title"
          test "$(printf '%s' "$parent_json" | jq -r .run_attempt)" = "1"
          echo "parent_run_id=$parent_run_id" >> "$GITHUB_OUTPUT"

      - name: Write exact Modal recovery readiness
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          ALICE_RECOVERY_PROVIDER: modal
          ALICE_SOURCE_COMMIT: ${{ github.sha }}
          ALICE_WATCHDOG_RUN_ID: ${{ github.run_id }}
          ALICE_WATCHDOG_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALICE_PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          ALICE_PARENT_RUN_ATTEMPT: "1"
          ALICE_RECOVERY_CREDENTIAL_POLICY_B64URL: ${{ vars.ALICE_RECOVERY_CREDENTIAL_POLICY_B64URL }}
          ALICE_RECOVERY_CREDENTIAL_POLICY_SHA256: ${{ vars.ALICE_RECOVERY_CREDENTIAL_POLICY_SHA256 }}
          ALICE_RECOVERY_PROVIDER_READBACK_PATH: ${{ runner.temp }}/alice-modal-recovery-readback.json
          ALICE_RECOVERY_READINESS_PATH: ${{ runner.temp }}/alice-modal-watchdog-readiness/readiness.json
        run: |
          set -euo pipefail
          readiness_root="${RUNNER_TEMP}/alice-modal-watchdog-readiness"
          mkdir "$readiness_root"
          node deploy/modal/alice_recovery_credential_binding.mjs

      - name: Publish exact Modal recovery readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-watchdog-ready-modal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.parent.outputs.parent_run_id }}-1
          path: ${{ runner.temp }}/alice-modal-watchdog-readiness/readiness.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      - name: Monitor the selected parent deployment
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480)
          do
            parent_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
            test "$(printf '%s' "$parent_json" | jq -r .head_sha)" = "$SOURCE_SHA"
            test "$(printf '%s' "$parent_json" | jq -r .run_attempt)" = "1"
            test "$(printf '%s' "$parent_json" | jq -r .path)" = \
              ".github/workflows/deploy-alice-cloudflare.yml"
            status="$(printf '%s' "$parent_json" | jq -r .status)"
            if test "$status" = "completed"
            then
              break
            fi
            test "$status" = "queued" || test "$status" = "in_progress" || \
              test "$status" = "waiting" || test "$status" = "pending"
            sleep 15
          done
          test "$(printf '%s' "$parent_json" | jq -r .status)" = "completed"
          parent_run_attempt="$(printf '%s' "$parent_json" | jq -r .run_attempt)"
          printf '%s' "$parent_run_attempt" | grep -Eq '^[1-9][0-9]*$'
          conclusion="$(printf '%s' "$parent_json" | jq -r .conclusion)"
          test -n "$conclusion"
          echo "parent_run_attempt=$parent_run_attempt" >> "$GITHUB_OUTPUT"
          if test "$conclusion" = "success"
          then
            echo "recovery_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "recovery_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Consume external journals and recover Modal independently
        if: ${{ steps.monitor.outputs.recovery_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ steps.monitor.outputs.parent_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$PARENT_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$PARENT_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          recovery_root="${RUNNER_TEMP}/alice-independent-modal-recovery"
          mkdir -p "$recovery_root" "$recovery_root/modal-legacy" \
            "$recovery_root/modal-safe" "$recovery_root/modal-journal" \
            "$recovery_root/terminal"
          artifacts_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100")"
          download_optional() {
            artifact_name="$1"
            destination="$2"
            count="$(printf '%s' "$artifacts_json" | jq \
              --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            if test "$count" = "1"
            then
              timeout --signal=TERM --kill-after=10s 120s gh run download \
                "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "$destination"
            elif test "$count" != "0"
            then
              exit 1
            fi
          }
          download_optional \
            "alice-cloudflare-anchor-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root"
          if test ! -d "$recovery_root/alice-release"
          then
            exit 0
          fi
          download_optional \
            "alice-modal-legacy-transition-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root/modal-legacy"
          download_optional \
            "alice-modal-safe-anchor-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root/modal-safe"
          download_optional \
            "alice-modal-anchor-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root/modal-journal"
          download_optional \
            "alice-recovery-evidence-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root/terminal"
          for artifact_dir in modal-legacy modal-safe modal-journal terminal
          do
            for artifact_file in \
              modal-legacy-transition.json \
              modal-rollback-anchor.json \
              modal-safe-bootstrap-evidence.json \
              modal-mutation-journal.json \
              modal-promotion-evidence.json \
              modal-emergency-rollback-evidence.json
            do
              if test -f "$recovery_root/$artifact_dir/$artifact_file"
              then
                cp -- "$recovery_root/$artifact_dir/$artifact_file" \
                  "$recovery_root/alice-release/$artifact_file"
              fi
            done
          done
          if test -f "$recovery_root/alice-release/modal-emergency-rollback-evidence.json"
          then
            exit 0
          fi
          admission="$recovery_root/alice-release/program-admission.json"
          test -f "$admission"
          release_digest="$(jq -r .releaseDigest "$admission")"
          printf '%s' "$release_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          export ALICE_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export ALICE_DEPLOYMENT_MANIFEST_PATH="$recovery_root/alice-release/alice-deployment-manifest.json"
          export ALICE_PROGRAM_ADMISSION_EVIDENCE_PATH="$admission"
          export ALICE_MODAL_LEGACY_TRANSITION_PATH="$recovery_root/alice-release/modal-legacy-transition.json"
          export ALICE_MODAL_ROLLBACK_ANCHOR_PATH="$recovery_root/alice-release/modal-rollback-anchor.json"
          export ALICE_MODAL_SAFE_BOOTSTRAP_EVIDENCE_PATH="$recovery_root/alice-release/modal-safe-bootstrap-evidence.json"
          export ALICE_MODAL_MUTATION_JOURNAL_PATH="$recovery_root/alice-release/modal-mutation-journal.json"
          export ALICE_MODAL_PROMOTION_EVIDENCE_PATH="$recovery_root/alice-release/modal-promotion-evidence.json"
          export ALICE_MODAL_EMERGENCY_ROLLBACK_EVIDENCE_PATH="$recovery_root/alice-release/modal-independent-recovery-evidence.json"
          export ALICE_MODAL_BIN="${RUNNER_TEMP}/alice-modal-recovery-client/bin/modal"
          export ALICE_MODAL_PYTHON_BIN="${RUNNER_TEMP}/alice-modal-recovery-client/bin/python"
          export ALICE_MODAL_RELEASE_SECRET_NAME="alice-production-core-${release_digest#sha256:}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}"
          export ALICE_MODAL_REVISION="$(jq -r .modalRevision "$admission")"
          export ALICE_RUNTIME_IMAGE="$(jq -r .runtimeImage "$admission")"
          if test -f "$ALICE_MODAL_ROLLBACK_ANCHOR_PATH" && \
             test -f "$ALICE_MODAL_MUTATION_JOURNAL_PATH"
          then
            timeout --signal=TERM --kill-after=30s 900s \
              node deploy/modal/alice_modal_emergency_rollback.mjs
          elif test ! -f "$ALICE_MODAL_ROLLBACK_ANCHOR_PATH" && \
               test -f "$ALICE_MODAL_LEGACY_TRANSITION_PATH"
          then
            export ALICE_MODAL_SAFE_BOOTSTRAP_PHASE=stop-if-unanchored
            timeout --signal=TERM --kill-after=30s 900s \
              node deploy/modal/alice_modal_safe_bootstrap_cli.mjs
          elif test -f "$ALICE_MODAL_ROLLBACK_ANCHOR_PATH"
          then
            exit 0
          else
            exit 1
          fi

      - name: Preserve watchdog Modal evidence
        if: ${{ always() && steps.monitor.outputs.recovery_required == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-watchdog-modal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-independent-modal-recovery/alice-release/modal-independent-recovery-evidence.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

      - name: Remove ephemeral Modal recovery material
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/alice-independent-modal-recovery" "${RUNNER_TEMP}/alice-modal-recovery-client" "${RUNNER_TEMP}/alice-modal-watchdog-readiness" "${RUNNER_TEMP}/alice-modal-recovery-readback.json"

  recover-cloudflare:
    name: Prestarted independent Cloudflare recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: alice-production-cloudflare-recovery
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact protected push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate exact protected push source
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'
          test "$GITHUB_REF" = "refs/heads/release/alice-production-core-2026-08-22"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Hydrate exact protected Eliza workspace
        env:
          EXPECTED_ELIZA_SHA: e219c232e21d8b61017129647130830d811ee45a
        run: |
          set -euo pipefail
          test "$(git config -f .gitmodules --get submodule.eliza.url)" = \
            "https://github.com/rndrntwrk/eliza.git"
          test "$(git config -f .gitmodules --get submodule.eliza.branch)" = \
            "alice/runtime-stable-2026-08-22"
          eliza_sha="$(git ls-tree HEAD eliza | awk '{print $3}')"
          test "$eliza_sha" = "$EXPECTED_ELIZA_SHA"
          git clone --no-checkout --filter=blob:none \
            https://github.com/rndrntwrk/eliza.git eliza
          git -C eliza fetch --depth=1 origin \
            refs/heads/alice/runtime-stable-2026-08-22:refs/remotes/origin/alice/runtime-stable-2026-08-22
          protected_eliza_sha="$(git -C eliza rev-parse \
            refs/remotes/origin/alice/runtime-stable-2026-08-22)"
          test "$protected_eliza_sha" = "$EXPECTED_ELIZA_SHA"
          test "$eliza_sha" = "$protected_eliza_sha"
          git -C eliza fetch --depth=1 origin "$eliza_sha"
          git -C eliza checkout --detach "$eliza_sha"
          test "$(git -C eliza rev-parse HEAD)" = "$eliza_sha"
          test -f eliza/package.json

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install exact recovery dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Verify Cloudflare recovery credential and provider readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TOKEN_POLICY_READ_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_POLICY_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
        run: |
          set -euo pipefail
          verify_file="${RUNNER_TEMP}/alice-cloudflare-recovery-verify.json"
          readback_root="${RUNNER_TEMP}/alice-cloudflare-recovery-readbacks"
          mkdir "$readback_root"
          fetch_json() {
            pathname="$1"
            output="$2"
            bearer="${3:-${CLOUDFLARE_API_TOKEN}}"
            status="$(curl --silent --show-error \
              --output "$output" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${bearer}" \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "https://api.cloudflare.com/client/v4${pathname}")"
            test "$status" = "200"
            jq -e '.success == true and has("result")' "$output" >/dev/null
          }
          fetch_json "/user/tokens/verify" "$verify_file"
          token_id="$(jq -er '.result.id | select(test("^[a-f0-9]{32}$"))' \
            "$verify_file")"
          token_policy_file="${RUNNER_TEMP}/alice-cloudflare-recovery-token-policy.json"
          token_detail_file="${RUNNER_TEMP}/alice-cloudflare-recovery-token-detail.json"
          permission_groups_file="${RUNNER_TEMP}/alice-cloudflare-recovery-permission-groups.json"
          fetch_json "/user/tokens/${token_id}" "$token_detail_file" \
            "$CLOUDFLARE_TOKEN_POLICY_READ_TOKEN"
          fetch_json "/user/tokens/permission_groups" "$permission_groups_file" \
            "$CLOUDFLARE_TOKEN_POLICY_READ_TOKEN"
          jq -n --slurpfile token "$token_detail_file" \
            --slurpfile permissionGroups "$permission_groups_file" \
            '{token: $token[0], permissionGroups: $permissionGroups[0]}' \
            > "$token_policy_file"
          fetch_json "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            "$readback_root/workers.json"
          fetch_json "/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?page=1&per_page=100" \
            "$readback_root/queues.json"
          fetch_json "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows" \
            "$readback_root/workflows.json"
          fetch_json "/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" \
            "$readback_root/r2.json"
          fetch_json "/zones/7b24984479ee4cddb6c5d8a9b7a0f2c6/workers/routes?page=1&per_page=100" \
            "$readback_root/routes.json"

      - name: Select one exact parent deployment
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="Alice production deploy watchdog-${GITHUB_RUN_ID}"
          parent_json=''
          for attempt in $(seq 1 360)
          do
            runs_json="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-alice-cloudflare.yml/runs?branch=release%2Falice-production-core-2026-08-22&event=workflow_dispatch&per_page=100")"
            matches="$(printf '%s' "$runs_json" | jq \
              --arg title "$expected_title" --arg sha "$SOURCE_SHA" \
              '[.[].workflow_runs[] |
                select(.display_title == $title and .head_sha == $sha and
                  .run_attempt == 1 and
                  .path == ".github/workflows/deploy-alice-cloudflare.yml")] |
                sort_by(.id)')"
            count="$(printf '%s' "$matches" | jq 'length')"
            if test "$count" -ge 1
            then
              parent_json="$(printf '%s' "$matches" | jq '.[0]')"
              break
            fi
            sleep 15
          done
          test -n "$parent_json"
          parent_run_id="$(printf '%s' "$parent_json" | jq -r .id)"
          printf '%s' "$parent_run_id" | grep -Eq '^[1-9][0-9]*$'
          test "$(printf '%s' "$parent_json" | jq -r .head_sha)" = "$SOURCE_SHA"
          test "$(printf '%s' "$parent_json" | jq -r .display_title)" = "$expected_title"
          test "$(printf '%s' "$parent_json" | jq -r .run_attempt)" = "1"
          echo "parent_run_id=$parent_run_id" >> "$GITHUB_OUTPUT"

      - name: Write exact Cloudflare recovery readiness
        env:
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          ALICE_RECOVERY_PROVIDER: cloudflare
          ALICE_SOURCE_COMMIT: ${{ github.sha }}
          ALICE_WATCHDOG_RUN_ID: ${{ github.run_id }}
          ALICE_WATCHDOG_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALICE_PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          ALICE_PARENT_RUN_ATTEMPT: "1"
          ALICE_RECOVERY_CREDENTIAL_POLICY_B64URL: ${{ vars.ALICE_RECOVERY_CREDENTIAL_POLICY_B64URL }}
          ALICE_RECOVERY_CREDENTIAL_POLICY_SHA256: ${{ vars.ALICE_RECOVERY_CREDENTIAL_POLICY_SHA256 }}
          ALICE_RECOVERY_PROVIDER_READBACK_PATH: ${{ runner.temp }}/alice-cloudflare-recovery-verify.json
          ALICE_RECOVERY_PROVIDER_POLICY_READBACK_PATH: ${{ runner.temp }}/alice-cloudflare-recovery-token-policy.json
          ALICE_RECOVERY_READINESS_PATH: ${{ runner.temp }}/alice-cloudflare-watchdog-readiness/readiness.json
        run: |
          set -euo pipefail
          readiness_root="${RUNNER_TEMP}/alice-cloudflare-watchdog-readiness"
          mkdir "$readiness_root"
          node deploy/modal/alice_recovery_credential_binding.mjs

      - name: Publish exact Cloudflare recovery readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-watchdog-ready-cloudflare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.parent.outputs.parent_run_id }}-1
          path: ${{ runner.temp }}/alice-cloudflare-watchdog-readiness/readiness.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      - name: Monitor the selected parent deployment
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480)
          do
            parent_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
            test "$(printf '%s' "$parent_json" | jq -r .head_sha)" = "$SOURCE_SHA"
            test "$(printf '%s' "$parent_json" | jq -r .run_attempt)" = "1"
            test "$(printf '%s' "$parent_json" | jq -r .path)" = \
              ".github/workflows/deploy-alice-cloudflare.yml"
            status="$(printf '%s' "$parent_json" | jq -r .status)"
            if test "$status" = "completed"
            then
              break
            fi
            test "$status" = "queued" || test "$status" = "in_progress" || \
              test "$status" = "waiting" || test "$status" = "pending"
            sleep 15
          done
          test "$(printf '%s' "$parent_json" | jq -r .status)" = "completed"
          parent_run_attempt="$(printf '%s' "$parent_json" | jq -r .run_attempt)"
          printf '%s' "$parent_run_attempt" | grep -Eq '^[1-9][0-9]*$'
          conclusion="$(printf '%s' "$parent_json" | jq -r .conclusion)"
          test -n "$conclusion"
          echo "parent_run_attempt=$parent_run_attempt" >> "$GITHUB_OUTPUT"
          if test "$conclusion" = "success"
          then
            echo "recovery_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "recovery_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Consume external journal and recover Cloudflare independently
        if: ${{ steps.monitor.outputs.recovery_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 036df6c823669b8fa2f66cf4c16eeb29
          PARENT_RUN_ID: ${{ steps.parent.outputs.parent_run_id }}
          PARENT_RUN_ATTEMPT: ${{ steps.monitor.outputs.parent_run_attempt }}
        run: |
          set -euo pipefail
          printf '%s' "$PARENT_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$PARENT_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'
          recovery_root="${RUNNER_TEMP}/alice-independent-cloudflare-recovery"
          terminal_root="${RUNNER_TEMP}/alice-independent-cloudflare-terminal"
          mkdir -p "$recovery_root" "$terminal_root"
          artifacts_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100")"
          download_optional() {
            artifact_name="$1"
            destination="$2"
            count="$(printf '%s' "$artifacts_json" | jq \
              --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            if test "$count" = "1"
            then
              timeout --signal=TERM --kill-after=10s 120s gh run download \
                "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "$destination"
            elif test "$count" != "0"
            then
              exit 1
            fi
          }
          download_optional \
            "alice-cloudflare-anchor-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$recovery_root"
          if test ! -f "$recovery_root/alice-release/rollback-anchor.json"
          then
            exit 0
          fi
          download_optional \
            "alice-recovery-evidence-${SOURCE_SHA}-${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}" \
            "$terminal_root"
          if test -f "$terminal_root/cloudflare-emergency-rollback.json"
          then
            exit 0
          fi
          manifest="$recovery_root/alice-release/alice-deployment-manifest.json"
          manifest_sha256="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
          export ALICE_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export ALICE_SOURCE_COMMIT="$SOURCE_SHA"
          export ALICE_RELEASE_RUN_ID="${PARENT_RUN_ID}-${PARENT_RUN_ATTEMPT}"
          export ALICE_WRANGLER_BIN="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          export ALICE_BUN_BIN="$(command -v bun)"
          export ALICE_WORKER_BUNDLE_ROOT="$recovery_root/alice-worker-bundles"
          export ALICE_WORKER_BUNDLE_ARTIFACT_PATH="$recovery_root/alice-worker-bundles/alice-worker-bundles.json"
          export ALICE_DEPLOYMENT_MANIFEST_PATH="$manifest"
          export ALICE_WRANGLER_OUTPUT_DIR="$recovery_root/alice-release/wrangler"
          export ALICE_CLOUDFLARE_ROLLBACK_ANCHOR_PATH="$recovery_root/alice-release/rollback-anchor.json"
          export ALICE_CLOUDFLARE_PREPARE_EVIDENCE_PATH="$recovery_root/alice-release/cloudflare-prepare-evidence.json"
          export ALICE_DEPLOYMENT_PAUSE_EVIDENCE_PATH="$recovery_root/alice-release/deployment-pause-evidence.json"
          export ALICE_CLOUDFLARE_READBACK_PATH="$recovery_root/alice-release/cloudflare-watchdog-recovery.json"
          export ALICE_CLOUDFLARE_ROLLBACK_PROOF_PATH="$recovery_root/alice-release/cloudflare-watchdog-rollback-proof.json"
          export ALICE_EXPECTED_DO_NAMESPACE_IDS_PATH="$recovery_root/alice-release/durable-object-namespace-ids.json"
          export ALICE_PROGRAM_ADMISSION_EVIDENCE_PATH="$recovery_root/alice-release/program-admission.json"
          export ALICE_CLOUDFLARE_RELEASE_PHASE=rollback
          export ALICE_PRODUCTION_RELEASE_CONFIRM="${SOURCE_SHA}:${manifest_sha256}"
          timeout --signal=TERM --kill-after=30s 900s \
            node deploy/modal/alice_cloudflare_release.mjs

      - name: Preserve watchdog Cloudflare evidence
        if: ${{ always() && steps.monitor.outputs.recovery_required == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-watchdog-cloudflare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-independent-cloudflare-recovery/alice-release/cloudflare-watchdog-recovery.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

      - name: Remove ephemeral Cloudflare recovery material
        if: always()
        run: rm -rf -- "${RUNNER_TEMP}/alice-independent-cloudflare-recovery" "${RUNNER_TEMP}/alice-independent-cloudflare-terminal" "${RUNNER_TEMP}/alice-cloudflare-watchdog-readiness" "${RUNNER_TEMP}/alice-cloudflare-recovery-readbacks" "${RUNNER_TEMP}/alice-cloudflare-recovery-verify.json"
