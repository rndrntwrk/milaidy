name: Alice Corpus Exact Workspace Diagnostic

on:
  push:
    branches:
      - feat/alice-corpus-runtime-binding-2026-08-22
    paths:
      - ".github/workflows/alice-corpus-exact-workspace-diagnostic.yml"
      - "package.json"
      - "bun.lock"
      - "packages/agent/vitest.config.ts"
      - "packages/agent/tsconfig.json"
      - "packages/agent/tsconfig.build.json"
      - "packages/agent/src/runtime/eliza.alice-corpus-admission.test.ts"
  pull_request:
    branches:
      - release/alice-production-core-2026-08-22
    paths:
      - ".github/workflows/alice-corpus-exact-workspace-diagnostic.yml"
      - "package.json"
      - "bun.lock"
      - "packages/agent/vitest.config.ts"
      - "packages/agent/tsconfig.json"
      - "packages/agent/tsconfig.build.json"
      - "packages/agent/src/runtime/eliza.alice-corpus-admission.test.ts"
  workflow_dispatch:

concurrency:
  group: alice-corpus-exact-workspace-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  BUN_VERSION: "1.3.14"

jobs:
  diagnose:
    name: Rebuild exact workspace without mutating the PR merge ref
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python build support
        run: pip install setuptools

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Initialize pinned Eliza workspace
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- eliza
          git submodule update --init eliza

          EXPECTED_SHA="$(git ls-tree HEAD eliza | awk '{print $3}')"
          ACTUAL_SHA="$(git -C eliza rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::Eliza submodule mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

          git -C eliza submodule sync --recursive
          git -C eliza submodule update --init --recursive
          echo "ELIZA_EXACT_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Apply repository Eliza patches
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply-eliza-ci-patches.mjs ]; then
            node scripts/apply-eliza-ci-patches.mjs
          fi

      - name: Prepare private-channel workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.before.json"
          cp bun.lock "$RUNNER_TEMP/bun.before.lock"

          test -f plugins/plugin-bluebubbles/typescript/package.json || {
            echo "::error::Required local BlueBubbles workspace is missing"
            exit 1
          }
          test -f eliza/plugins/plugin-signal/package.json || {
            echo "::error::Pinned Eliza Signal workspace is missing"
            exit 1
          }
          if [ -f eliza/plugins/plugin-bluebubbles/package.json ]; then
            echo "::error::Pinned Eliza unexpectedly contains BlueBubbles; workspace ownership must be re-evaluated"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.workspaces = pkg.workspaces.filter(
            (entry) => entry !== "!plugins/plugin-bluebubbles/typescript",
          );
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Regenerate lock in the exact workspace
        shell: bash
        run: bun install --no-frozen-lockfile --ignore-scripts
        env:
          npm_config_python: ${{ env.pythonLocation }}/bin/python3

      - name: Verify regenerated exact lock is frozen-installable
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          npm_config_python: ${{ env.pythonLocation }}/bin/python3

      - name: Record workspace delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff -- package.json bun.lock > "$RUNNER_TEMP/exact-workspace.diff" || true
          git diff --stat -- package.json bun.lock || true
          git status --short -- package.json bun.lock || true

      - name: Require PR workspace reconciliation to be committed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- package.json bun.lock; then
            echo "::error::Exact package.json/bun.lock reconciliation is not committed on the PR head"
            exit 1
          fi

      - name: Generate local Eliza protobuf types
        shell: bash
        run: |
          set -euo pipefail
          if [ -d eliza/packages/schemas ] \
            && [ -f eliza/packages/schemas/buf.gen.yaml ] \
            && [ ! -f eliza/packages/core/src/types/generated/eliza/v1/agent_pb.ts ]; then
            cd eliza/packages/schemas
            node node_modules/@bufbuild/buf/install.js 2>/dev/null || true
            bunx @bufbuild/buf@1.67.0 generate
          fi

      - name: Generate Eliza keyword data
        shell: bash
        run: |
          set -euo pipefail
          if [ -f eliza/packages/shared/scripts/generate-keywords.mjs ]; then
            cd eliza
            node packages/shared/scripts/generate-keywords.mjs
          fi

      - name: Run exact corpus admission regression
        working-directory: packages/agent
        run: >-
          bunx vitest run
          src/runtime/eliza.alice-corpus-admission.test.ts

      - name: Typecheck agent package
        working-directory: packages/agent
        run: bun run typecheck

      - name: Build agent package
        working-directory: packages/agent
        run: bun run build

      - name: Persist exact workspace reconciliation on the feature branch
        if: >-
          github.event_name == 'push' &&
          github.ref_name == 'feat/alice-corpus-runtime-binding-2026-08-22'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo "Exact workspace already reconciled; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(alice): reconcile exact release workspace lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload exact workspace diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alice-corpus-exact-workspace-${{ github.sha }}
          path: |
            package.json
            bun.lock
            ${{ runner.temp }}/package.before.json
            ${{ runner.temp }}/bun.before.lock
            ${{ runner.temp }}/exact-workspace.diff
          if-no-files-found: error
          retention-days: 3

      - name: Report diagnostic run on PR 212
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Exact workspace diagnostic completed.

          - status: \`$JOB_STATUS\`
          - PR head: \`$HEAD_SHA\`
          - run: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID
          - attempt: \`$RUN_ATTEMPT\`
          - artifact: \`alice-corpus-exact-workspace-${{ github.sha }}\`

          The PR lane is read-only and fails unless the exact workspace reconciliation is already committed.
          EOF
          )
          gh api \
            --method POST \
            repos/${{ github.repository }}/issues/212/comments \
            -f body="$body"
