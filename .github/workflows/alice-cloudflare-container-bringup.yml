name: Alice Cloudflare Container Bring-up

on:
  workflow_dispatch:
    inputs:
      user_test_window_minutes:
        description: Keep the verified temporary chat surface available for owner testing
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "60"
          - "300"

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: alice-cloudflare-container-bringup
  cancel-in-progress: false

jobs:
  bringup:
    name: Import, converse, and tear down
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: alice-cloudflare-bringup
    env:
      CLOUDFLARE_ACCOUNT_ID: "036df6c823669b8fa2f66cf4c16eeb29"
      SOURCE_IMAGE: ghcr.io/rndrntwrk/milaidy-agent@sha256:983041c9d8691bcebda35872f07e8a8d43912fb8594e84f3af5d04d25cc165e2
      SOURCE_DIGEST: sha256:983041c9d8691bcebda35872f07e8a8d43912fb8594e84f3af5d04d25cc165e2
      SOURCE_COMMIT: 91db832dbb423e360c0be5771fedcebcbbded8e7
      ELIZA_COMMIT: a21d401bf7429bc8c794698b20832512b5315187
      RUNTIME_BUILD_MANIFEST_SHA256: sha256:9605b9b42263f02585a2cc2db41cf0b854555d19e1193d413d22aa5c4270aaeb
      WORKERS_SUBDOMAIN: gl4sspr1sm
      WRANGLER_VERSION: 4.122.0
      CONTAINERS_PACKAGE_VERSION: 0.3.7
      USER_TEST_WINDOW_MINUTES: ${{ inputs.user_test_window_minutes }}
    steps:
      - name: Record bounded staging contract
        shell: bash
        run: |
          set -euo pipefail
          expiry_contract="30 minutes after Worker/Container creation"
          case "$USER_TEST_WINDOW_MINUTES" in
            60)
              expiry_contract="60 minutes after verified link readiness; absolute provider-resource ceiling: 85 minutes after creation"
              ;;
            300)
              expiry_contract="300 minutes after verified link readiness; absolute provider-resource ceiling: 325 minutes after creation"
              ;;
          esac
          {
            echo "### Alice Cloudflare Container bring-up contract"
            echo "- Owner: Alice Cloudflare bring-up operator"
            echo "- Provider/account: Cloudflare / ${CLOUDFLARE_ACCOUNT_ID}"
            echo "- Source: ${SOURCE_IMAGE}"
            echo "- Surface: one uniquely named workers.dev Worker and one Container application"
            echo "- Capacity: standard-4, max_instances=1, sleepAfter=5m, SSH disabled"
            echo "- Routes: workers.dev only; no custom route or domain"
            echo "- Hard expiry: ${expiry_contract}"
            echo "- Teardown: delete Worker, remaining Container application, and unique registry image tag"
            echo "- Manual teardown: \`gh run cancel ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY}\` (triggers both cleanup owners)"
            echo "- Completion evidence: live health, one conversational response, singleton instance readback, then Worker/Container/image absence"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import exact image, run live conversation, and prove teardown
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_BRINGUP_TOKEN }}
          ALICE_USER_TEST_LINK_TOKEN: ${{ secrets.ALICE_USER_TEST_LINK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROVIDER_CREATE_CUTOFF_EPOCH="$(( $(date +%s) + 1800 ))"

          if ! [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid immutable source digest" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_CONTAINER_BRINGUP_TOKEN is not configured" >&2
            exit 1
          fi
          if ! [[ "$USER_TEST_WINDOW_MINUTES" =~ ^(0|60|300)$ ]]; then
            echo "USER_TEST_WINDOW_INVALID" >&2
            exit 1
          fi
          if [ "$USER_TEST_WINDOW_MINUTES" != "0" ] &&
            ! [[ "${ALICE_USER_TEST_LINK_TOKEN:-}" =~ ^[A-Za-z0-9_-]{43,128}$ ]]; then
            echo "ALICE_USER_TEST_LINK_TOKEN_INVALID" >&2
            exit 1
          fi

          WORKER_NAME="alice-cf-bringup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APP_NAME="${WORKER_NAME}-app"
          CF_IMAGE="${WORKER_NAME}"
          CF_TAG="ghcr-${SOURCE_DIGEST#sha256:}"
          CF_IMAGE_TAG="${CF_IMAGE}:${CF_TAG}"
          CF_IMAGE_REF="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${CF_IMAGE_TAG}"
          WORKER_HOST="${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          WORKER_URL="https://${WORKER_HOST}"
          PROJECT_DIR="${RUNNER_TEMP}/alice-cloudflare-container-bringup"
          TAIL_LOG="${RUNNER_TEMP}/alice-cloudflare-container-tail.log"
          CLEANUP_COMPLETE=0
          TAIL_PID=""

          EDGE_TOKEN="$(openssl rand -hex 32)"
          RUNTIME_TOKEN="$(openssl rand -hex 32)"
          ACCESS_SECRET="$(openssl rand -hex 32)"
          MODEL_TOKEN="$(openssl rand -hex 32)"
          VAULT_PASSPHRASE="$(openssl rand -hex 32)"
          for masked in "$EDGE_TOKEN" "$RUNTIME_TOKEN" "$ACCESS_SECRET" "$MODEL_TOKEN" "$VAULT_PASSPHRASE" "${ALICE_USER_TEST_LINK_TOKEN:-}"; do
            if [ -n "$masked" ]; then
              echo "::add-mask::${masked}"
            fi
          done

          mkdir -p "$PROJECT_DIR/src"
          cd "$PROJECT_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@cloudflare/containers@${CONTAINERS_PACKAGE_VERSION}" \
            "wrangler@${WRANGLER_VERSION}"

          list_all_container_apps() (
            set -euo pipefail
            local all_apps='[]'
            local page_token=''
            local previous_page_token=''
            local response_file="${RUNNER_TEMP}/alice-container-apps-${BASHPID}.json"
            trap '/bin/rm -f "$response_file"' EXIT

            for page in $(seq 1 20); do
              curl_args=(
                --silent --show-error --max-time 5
                --output "$response_file" --write-out '%{http_code}'
                --get
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
                --data-urlencode 'per_page=1000'
              )
              if [ -n "$page_token" ]; then
                curl_args+=(--data-urlencode "page_token=${page_token}")
              fi
              http_status="$(curl "${curl_args[@]}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/dash/applications")"
              if [ "$http_status" != "200" ] || ! jq -e \
                '.success == true and (.result | type == "array") and ((.result_info // {}) | type == "object")' \
                "$response_file" >/dev/null; then
                echo "CONTAINER_INVENTORY_INVALID page=${page} http=${http_status}" >&2
                return 1
              fi
              page_apps="$(jq -c '.result' "$response_file")"
              all_apps="$(jq -cn --argjson prior "$all_apps" --argjson page "$page_apps" '$prior + $page')"
              previous_page_token="$page_token"
              page_token="$(jq -r '.result_info.next_page_token // empty' "$response_file")"
              if [ -z "$page_token" ]; then
                printf '%s\n' "$all_apps"
                return 0
              fi
              if [ "$page_token" = "$previous_page_token" ]; then
                echo "CONTAINER_INVENTORY_PAGINATION_INVALID page=${page}" >&2
                return 1
              fi
            done
            echo "CONTAINER_INVENTORY_PAGE_LIMIT" >&2
            return 1
          )

          cleanup() (
            local cleanup_rc=0
            set +e
            if [ -n "$TAIL_PID" ]; then
              kill "$TAIL_PID" >/dev/null 2>&1 || true
              wait "$TAIL_PID" >/dev/null 2>&1 || true
            fi

            echo "TEARDOWN_START worker=${WORKER_NAME} app=${APP_NAME} image=${CF_IMAGE_TAG}"
            npx wrangler delete "$WORKER_NAME" --force >/tmp/alice-worker-delete.log 2>&1 || true

            for _attempt in $(seq 1 18); do
              apps_json="$(list_all_container_apps 2>/tmp/alice-container-list.err)" || {
                cat /tmp/alice-container-list.err >&2
                cleanup_rc=1
                apps_json='[]'
                break
              }
              app_id="$(printf '%s' "$apps_json" | jq -r --arg name "$APP_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else empty end')"
              if [ -z "$app_id" ]; then
                break
              fi
              npx wrangler containers delete "$app_id" >/tmp/alice-container-delete.log 2>&1 || true
              sleep 5
            done

            npx wrangler containers images delete "$CF_IMAGE_TAG" --skip-confirmation >/tmp/alice-image-delete.log 2>&1 || true

            worker_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" || true)"
            final_apps="$(list_all_container_apps 2>/tmp/alice-final-container-list.err)" || {
              cat /tmp/alice-final-container-list.err >&2
              cleanup_rc=1
              final_apps='[]'
            }
            final_images="$(npx wrangler containers images list --filter "^(${CLOUDFLARE_ACCOUNT_ID}/)?${CF_IMAGE}$" --json 2>/tmp/alice-final-image-list.err)" || {
              cat /tmp/alice-final-image-list.err >&2
              cleanup_rc=1
              final_images='[]'
            }
            remaining_apps="$(printf '%s' "$final_apps" | jq --arg name "$APP_NAME" '[.[] | select(.name == $name)] | length')"
            remaining_tags="$(printf '%s' "$final_images" | jq --arg name "$CF_IMAGE" --arg tag "$CF_TAG" '[.[] | select(.name == $name and (.tags | index($tag)))] | length')"

            if [ "$worker_status" != "404" ] || [ "$remaining_apps" != "0" ] || [ "$remaining_tags" != "0" ]; then
              echo "TEARDOWN_INVALID worker_http=${worker_status} remaining_apps=${remaining_apps} remaining_tags=${remaining_tags}" >&2
              cleanup_rc=1
            else
              echo "TEARDOWN_GREEN worker_http=404 remaining_apps=0 remaining_tags=0"
            fi
            /bin/rm -rf "$PROJECT_DIR"
            /bin/rm -f /tmp/alice-*.log /tmp/alice-*.err /tmp/alice-health.json /tmp/alice-chat.json
            return "$cleanup_rc"
          )

          on_exit() {
            local original_rc=$?
            if [ "$CLEANUP_COMPLETE" != "1" ]; then
              cleanup || true
            fi
            exit "$original_rc"
          }
          trap on_exit EXIT INT TERM

          cat > src/index.ts <<'EOF'
          import { Container } from "@cloudflare/containers";
          import { env as cfEnv } from "cloudflare:workers";

          type AliceEnv = {
            AI: Ai;
            ALICE_CONTAINER: DurableObjectNamespace<AliceBringupContainer>;
            BRINGUP_ACCESS_SECRET: string;
            BRINGUP_EDGE_TOKEN: string;
            BRINGUP_MODEL_TOKEN: string;
            BRINGUP_RUNTIME_TOKEN: string;
            BRINGUP_USER_TEST_TOKEN?: string;
            BRINGUP_VAULT_PASSPHRASE: string;
            BRINGUP_WORKER_ORIGIN: string;
          };

          const sourceImage = "ghcr.io/rndrntwrk/milaidy-agent@sha256:983041c9d8691bcebda35872f07e8a8d43912fb8594e84f3af5d04d25cc165e2";

          export class AliceBringupContainer extends Container {
            defaultPort = 2138;
            sleepAfter = "5m";
            enableInternet = true;
            envVars = {
              NODE_ENV: "production",
              PORT: "2138",
              APP_PORT: "2138",
              APP_API_BIND: "0.0.0.0",
              MILADY_API_BIND: "0.0.0.0",
              ELIZA_API_BIND: "0.0.0.0",
              MILADY_DISABLE_LOCAL_EMBEDDINGS: "1",
              ELIZA_AUTH_DISABLED: "0",
              MILADY_API_TOKEN: cfEnv.BRINGUP_RUNTIME_TOKEN,
              MILADY_TRUST_CLOUDFLARE_ACCESS: "1",
              MILADY_CLOUDFLARE_ACCESS_PROXY_SECRET: cfEnv.BRINGUP_ACCESS_SECRET,
              ALICE_RUNTIME_AUTHORITY_MODE: "proposer-only",
              ENABLE_AUTONOMY: "false",
              ELIZA_TRIGGERS_ENABLED: "false",
              MILADY_ALLOWED_ORIGINS: cfEnv.BRINGUP_WORKER_ORIGIN,
              ELIZA_ALLOWED_ORIGINS: cfEnv.BRINGUP_WORKER_ORIGIN,
              OPENAI_API_KEY: cfEnv.BRINGUP_MODEL_TOKEN,
              OPENAI_BASE_URL: `${cfEnv.BRINGUP_WORKER_ORIGIN}/internal-model/v1`,
              OPENAI_EMBEDDING_URL: `${cfEnv.BRINGUP_WORKER_ORIGIN}/internal-model/v1`,
              ELIZA_VAULT_PASSPHRASE: cfEnv.BRINGUP_VAULT_PASSPHRASE,
              ALICE_PROGRAM_DIGEST: "sha256:1111111111111111111111111111111111111111111111111111111111111111",
              ALICE_RELEASE_DIGEST: "sha256:2222222222222222222222222222222222222222222222222222222222222222",
              ALICE_POLICY_HASH: "sha256:3333333333333333333333333333333333333333333333333333333333333333",
              ALICE_SOURCE_COMMIT: "91db832dbb423e360c0be5771fedcebcbbded8e7",
              ALICE_DEPLOYMENT_CONTROLLER_COMMIT: "91db832dbb423e360c0be5771fedcebcbbded8e7",
              ALICE_RUNTIME_IMAGE: sourceImage,
              ALICE_RUNTIME_BUILD_MANIFEST_SHA256: "sha256:9605b9b42263f02585a2cc2db41cf0b854555d19e1193d413d22aa5c4270aaeb",
              ALICE_DEPLOYMENT_MANIFEST_SHA256: "sha256:9999999999999999999999999999999999999999999999999999999999999999",
              ALICE_ELIZA_COMMIT: "a21d401bf7429bc8c794698b20832512b5315187",
              ALICE_MODAL_REVISION: "49",
              ELIZA_SKIP_PLUGINS: "@rndrntwrk/plugin-555stream,@miladyai/agent/plugins/five55-games,@elizaos/plugin-evm,@elizaos/plugin-solana,@elizaos/plugin-wallet,@stwd/eliza-plugin,@elizaos/plugin-x402,@elizaos/plugin-agent-orchestrator,@elizaos/plugin-agent-skills,@elizaos/plugin-commands,@elizaos/plugin-shell,@elizaos/plugin-code,@elizaos/plugin-cua,@elizaos/plugin-computeruse,@elizaos/plugin-browser,@miladyai/plugin-milady-browser,@miladyai/plugin-lifeops-browser,@elizaos/plugin-repoprompt,@elizaos/plugin-claude-code-workbench,@elizaos/plugin-twitter,@elizaos/plugin-discord,@miladyai/plugin-discord-local,@elizaos/plugin-telegram,@elizaos-plugins/client-telegram-account,@elizaos/plugin-whatsapp,@elizaos/plugin-signal,@elizaos/plugin-imessage,@elizaos/plugin-farcaster,@elizaos/plugin-lens,@elizaos/plugin-slack,@elizaos/plugin-twitch,@elizaos/plugin-streaming-base,@elizaos/plugin-twitch-streaming,@elizaos/plugin-youtube-streaming,@elizaos/plugin-custom-rtmp,@elizaos/plugin-pumpfun-streaming,@elizaos/plugin-x-streaming,@elizaos/plugin-webhooks,@elizaos/plugin-gmail-watch",
            };

            override onStart() {
              console.log("ALICE_TEMP_CONTAINER_STARTED");
            }

            override onStop() {
              console.log("ALICE_TEMP_CONTAINER_STOPPED");
            }

            override onError(error: unknown) {
              console.error("ALICE_TEMP_CONTAINER_ERROR", error);
              throw error;
            }

            override async fetch(request: Request): Promise<Response> {
              try {
                await this.startAndWaitForPorts({
                  ports: [this.defaultPort],
                  cancellationOptions: {
                    abort: request.signal,
                    instanceGetTimeoutMS: 60_000,
                    portReadyTimeoutMS: 120_000,
                  },
                });
              } catch (error) {
                const message = String(error).toLowerCase();
                if (message.includes("there is no container instance that can be provided to this durable object")) {
                  return new Response("Container provisioning in progress", { status: 503 });
                }
                throw error;
              }
              return this.containerFetch(request);
            }
          }

          function json(body: unknown, status = 200) {
            return Response.json(body, { status, headers: { "cache-control": "no-store" } });
          }

          function bearer(request: Request) {
            const value = request.headers.get("authorization") ?? "";
            return value.startsWith("Bearer ") ? value.slice(7) : "";
          }

          function userTestPage(env: AliceEnv) {
            if (!env.BRINGUP_USER_TEST_TOKEN) {
              return new Response("not found", { status: 404 });
            }
            const nonce = crypto.randomUUID();
            const body = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Alice Cloudflare canary</title>
            <style nonce="${nonce}">
              :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              body { margin: 0; background: #080a0f; color: #f5f7ff; }
              main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
              h1 { font-size: 24px; margin: 0 0 8px; }
              .note { color: #9da7bf; margin: 0 0 24px; }
              #transcript { min-height: 280px; border: 1px solid #293047; border-radius: 12px; padding: 16px; background: #0e121c; white-space: pre-wrap; }
              .turn { margin: 0 0 16px; }
              .role { color: #72e6b1; font-weight: 700; }
              form { display: flex; gap: 10px; margin-top: 14px; }
              input { flex: 1; min-width: 0; border: 1px solid #39425d; border-radius: 10px; padding: 12px; background: #111625; color: inherit; }
              button { border: 0; border-radius: 10px; padding: 0 18px; background: #72e6b1; color: #07120d; font-weight: 700; cursor: pointer; }
              button:disabled { opacity: .5; cursor: wait; }
            </style>
          </head>
          <body>
            <main>
              <h1>Alice</h1>
              <p class="note">Temporary Cloudflare canary · proposer-only · actions and tools disabled</p>
              <div id="transcript" aria-live="polite"></div>
              <form id="chat-form">
                <input id="prompt" name="prompt" autocomplete="off" placeholder="Message Alice" required>
                <button type="submit">Send</button>
              </form>
            </main>
            <script nonce="${nonce}">
              const capability = window.location.hash.slice(1);
              history.replaceState(null, "", window.location.pathname);
              const transcript = document.getElementById("transcript");
              const form = document.getElementById("chat-form");
              const prompt = document.getElementById("prompt");
              const button = form.querySelector("button");
              const messages = [];
              function append(role, content) {
                const turn = document.createElement("div");
                turn.className = "turn";
                const label = document.createElement("span");
                label.className = "role";
                label.textContent = role + ": ";
                const text = document.createElement("span");
                text.textContent = content;
                turn.append(label, text);
                transcript.append(turn);
              }
              if (!/^[A-Za-z0-9_-]{43,128}$/.test(capability)) {
                append("System", "This test link is incomplete or expired.");
                form.hidden = true;
              }
              form.addEventListener("submit", async (event) => {
                event.preventDefault();
                const content = prompt.value.trim();
                if (!content) return;
                messages.push({ role: "user", content });
                append("You", content);
                prompt.value = "";
                button.disabled = true;
                try {
                  const response = await fetch("/v1/chat/completions", {
                    method: "POST",
                    headers: {
                      "content-type": "application/json",
                      "x-alice-user-test-token": capability,
                    },
                    body: JSON.stringify({ model: "alice-cloudflare-bringup", messages }),
                  });
                  if (!response.ok) throw new Error("HTTP " + response.status);
                  const payload = await response.json();
                  const reply = payload?.choices?.[0]?.message?.content;
                  if (typeof reply !== "string" || !reply.trim()) throw new Error("Empty response");
                  messages.push({ role: "assistant", content: reply });
                  append("Alice", reply);
                } catch (error) {
                  append("System", "Request failed: " + (error instanceof Error ? error.message : "unknown error"));
                } finally {
                  button.disabled = false;
                  prompt.focus();
                }
              });
            </script>
          </body>
          </html>`;
            return new Response(body, {
              headers: {
                "cache-control": "no-store",
                "content-type": "text/html; charset=utf-8",
                "content-security-policy": `default-src 'none'; base-uri 'none'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}'`,
                "referrer-policy": "no-referrer",
                "x-content-type-options": "nosniff",
              },
            });
          }

          async function modelResponse(request: Request, env: AliceEnv) {
            if (bearer(request) !== env.BRINGUP_MODEL_TOKEN) return new Response("not found", { status: 404 });
            let body: Record<string, unknown>;
            try {
              body = await request.json<Record<string, unknown>>();
            } catch {
              return json({ error: "invalid_request" }, 400);
            }
            const pathname = new URL(request.url).pathname;
            if (pathname.endsWith("/embeddings")) {
              const input = Array.isArray(body.input) ? body.input : [body.input];
              return json({
                object: "list",
                model: typeof body.model === "string" ? body.model : "alice-cloudflare-embedding",
                data: input.map((_value, index) => ({ object: "embedding", index, embedding: Array(1024).fill(0) })),
                usage: { prompt_tokens: 0, total_tokens: 0 },
              });
            }
            if (!pathname.endsWith("/chat/completions") || body.stream === true || body.tools !== undefined) {
              return json({ error: "unsupported_request" }, 400);
            }
            const messages = Array.isArray(body.messages) ? body.messages : [];
            const prompt = messages
              .map((message) => {
                const record = message as Record<string, unknown>;
                return `${String(record.role ?? "user")}: ${String(record.content ?? "")}`;
              })
              .join("\n");
            const inference = await env.AI.run("@cf/meta/llama-3.1-8b-instruct-fast", {
              prompt,
              max_tokens: 128,
              temperature: 0.2,
            }) as { response?: string };
            const content = typeof inference.response === "string" ? inference.response.trim() : "";
            if (!content) return json({ error: "empty_model_response" }, 502);
            return json({
              id: "chatcmpl-alice-cloudflare-bringup",
              object: "chat.completion",
              created: Math.floor(Date.now() / 1000),
              model: "@cf/meta/llama-3.1-8b-instruct-fast",
              choices: [{ index: 0, message: { role: "assistant", content }, finish_reason: "stop" }],
              usage: { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 },
            });
          }

          export default {
            async fetch(request: Request, env: AliceEnv) {
              const pathname = new URL(request.url).pathname;
              if (pathname === "/" && request.method === "GET") return userTestPage(env);
              if (pathname.startsWith("/internal-model/v1/")) return modelResponse(request, env);
              const userTestAuthorized =
                pathname === "/v1/chat/completions" &&
                request.method === "POST" &&
                typeof env.BRINGUP_USER_TEST_TOKEN === "string" &&
                request.headers.get("x-alice-user-test-token") === env.BRINGUP_USER_TEST_TOKEN;
              const automatedCanaryAuthorized =
                request.headers.get("x-alice-bringup-token") === env.BRINGUP_EDGE_TOKEN;
              if (!userTestAuthorized && !automatedCanaryAuthorized) {
                return new Response("not found", { status: 404 });
              }
              const headers = new Headers(request.headers);
              headers.delete("x-alice-bringup-token");
              headers.delete("x-alice-user-test-token");
              headers.set("authorization", `Bearer ${env.BRINGUP_RUNTIME_TOKEN}`);
              headers.set("cf-access-authenticated-user-email", "alice-owner-verified.invalid");
              headers.set("x-milady-cloudflare-access-secret", env.BRINGUP_ACCESS_SECRET);
              headers.set("origin", env.BRINGUP_WORKER_ORIGIN);
              return env.ALICE_CONTAINER.getByName("singleton").fetch(new Request(request, { headers }));
            },
          };
          EOF

          WORKER_NAME="$WORKER_NAME" APP_NAME="$APP_NAME" CF_IMAGE_REF="$CF_IMAGE_REF" \
          WORKER_URL="$WORKER_URL" \
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            $schema: "./node_modules/wrangler/config-schema.json",
            name: process.env.WORKER_NAME,
            main: "src/index.ts",
            compatibility_date: "2026-08-27",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            preview_urls: false,
            observability: { enabled: true, head_sampling_rate: 1 },
            ai: { binding: "AI" },
            vars: {
              BRINGUP_WORKER_ORIGIN: process.env.WORKER_URL,
            },
            containers: [{
              name: process.env.APP_NAME,
              class_name: "AliceBringupContainer",
              image: process.env.CF_IMAGE_REF,
              instance_type: "standard-4",
              max_instances: 1,
              rollout_step_percentage: 100,
              ssh: { enabled: false },
            }],
            durable_objects: {
              bindings: [{ name: "ALICE_CONTAINER", class_name: "AliceBringupContainer" }],
            },
            migrations: [{ tag: "v1", new_sqlite_classes: ["AliceBringupContainer"] }],
          };
          fs.writeFileSync("wrangler.jsonc", `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE

          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/alice-bringup-dry-run" >/tmp/alice-bringup-dry-run.log

          echo "IMPORT_START source=${SOURCE_IMAGE}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          pulled_platform="$(docker image inspect "$SOURCE_IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          pulled_revision="$(docker image inspect "$SOURCE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          pulled_repo_digests="$(docker image inspect "$SOURCE_IMAGE" --format '{{json .RepoDigests}}')"
          if [ "$pulled_platform" != "linux/amd64" ] || [ "$pulled_revision" != "$SOURCE_COMMIT" ]; then
            echo "SOURCE_IMAGE_INVALID platform=${pulled_platform} revision=${pulled_revision}" >&2
            exit 1
          fi
          if ! printf '%s' "$pulled_repo_digests" | jq -e --arg image "$SOURCE_IMAGE" 'index($image) != null' >/dev/null; then
            echo "SOURCE_DIGEST_INVALID" >&2
            exit 1
          fi

          docker tag "$SOURCE_IMAGE" "$CF_IMAGE_TAG"
          echo "IMPORT_PUSH_START local=${CF_IMAGE_TAG}"
          if [ "$(date +%s)" -gt "$PROVIDER_CREATE_CUTOFF_EPOCH" ]; then
            echo "PROVIDER_CREATE_BUDGET_INVALID stage=image-push" >&2
            exit 1
          fi
          npx wrangler containers push "$CF_IMAGE_TAG" | tee /tmp/alice-container-push.log
          cf_repo_digests="$(docker image inspect "$CF_IMAGE_REF" --format '{{json .RepoDigests}}')"
          cf_registry_digest="$(printf '%s' "$cf_repo_digests" | jq -r --arg prefix "registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${CF_IMAGE}@" '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else empty end')"
          if ! [[ "$cf_registry_digest" =~ ^registry\.cloudflare\.com/${CLOUDFLARE_ACCOUNT_ID}/${CF_IMAGE}@sha256:[0-9a-f]{64}$ ]]; then
            echo "CLOUDFLARE_REGISTRY_IDENTITY_INVALID" >&2
            exit 1
          fi
          image_inventory="$(npx wrangler containers images list --filter "^(${CLOUDFLARE_ACCOUNT_ID}/)?${CF_IMAGE}$" --json)"
          if [ "$(printf '%s' "$image_inventory" | jq --arg name "$CF_IMAGE" --arg tag "$CF_TAG" '[.[] | select(.name == $name and (.tags | index($tag)))] | length')" != "1" ]; then
            echo "CLOUDFLARE_REGISTRY_READBACK_INVALID" >&2
            exit 1
          fi
          echo "IMPORT_GREEN source=${SOURCE_IMAGE} cloudflare=${cf_registry_digest} tag=${CF_IMAGE_REF}"

          if [ "$(date +%s)" -gt "$PROVIDER_CREATE_CUTOFF_EPOCH" ]; then
            echo "PROVIDER_CREATE_BUDGET_INVALID stage=worker-deploy" >&2
            exit 1
          fi
          echo "CONTAINER_DEPLOY_START worker=${WORKER_NAME} app=${APP_NAME} max_instances=1"
          npx wrangler deploy --containers-rollout=immediate | tee /tmp/alice-worker-deploy.log
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ABSOLUTE_EXPIRY_MINUTES=30
          case "$USER_TEST_WINDOW_MINUTES" in
            60) ABSOLUTE_EXPIRY_MINUTES=85 ;;
            300) ABSOLUTE_EXPIRY_MINUTES=325 ;;
          esac
          ABSOLUTE_EXPIRES_AT="$(date -u -d "+${ABSOLUTE_EXPIRY_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)"
          EXPIRES_AT="$ABSOLUTE_EXPIRES_AT"
          echo "CONTAINER_CREATED worker=${WORKER_NAME} url=${WORKER_URL} created=${CREATED_AT} absolute_expires=${ABSOLUTE_EXPIRES_AT}"

          secret_payload="$(jq -cn \
            --arg access "$ACCESS_SECRET" \
            --arg edge "$EDGE_TOKEN" \
            --arg model "$MODEL_TOKEN" \
            --arg runtime "$RUNTIME_TOKEN" \
            --arg vault "$VAULT_PASSPHRASE" \
            '{BRINGUP_ACCESS_SECRET:$access,BRINGUP_EDGE_TOKEN:$edge,BRINGUP_MODEL_TOKEN:$model,BRINGUP_RUNTIME_TOKEN:$runtime,BRINGUP_VAULT_PASSPHRASE:$vault}')"
          printf '%s' "$secret_payload" | npx wrangler secret bulk --name "$WORKER_NAME" >/tmp/alice-secret-bulk.log
          unset secret_payload
          echo "WORKER_SECRET_BINDINGS_GREEN count=5"

          apps_json="$(list_all_container_apps)"
          app_id="$(printf '%s' "$apps_json" | jq -r --arg name "$APP_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else empty end')"
          if ! [[ "$app_id" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "CONTAINER_ID_INVALID" >&2
            exit 1
          fi
          app_info="$(npx wrangler containers info "$app_id")"
          echo "CONTAINER_IDENTITY id=${app_id} name=${APP_NAME}"
          printf '%s\n' "$app_info"

          timeout --signal=INT 1200s npx wrangler tail "$WORKER_NAME" --format json > "$TAIL_LOG" 2>&1 &
          TAIL_PID=$!

          health_status=""
          BOOT_WINDOW_SECONDS=1200
          BOOT_DEADLINE_EPOCH="$(( $(date +%s) + BOOT_WINDOW_SECONDS ))"
          while [ "$(date +%s)" -lt "$BOOT_DEADLINE_EPOCH" ]; do
            health_status="$(curl --silent --show-error --output /tmp/alice-health.json --write-out '%{http_code}' \
              --max-time 130 \
              -H "x-alice-bringup-token: ${EDGE_TOKEN}" \
              "${WORKER_URL}/health/ready" || true)"
            if [ "$health_status" = "200" ]; then
              break
            fi
            if [ "$health_status" != "" ] && [ "$health_status" != "000" ] && [ "$health_status" != "404" ] && [ "$health_status" != "502" ] && [ "$health_status" != "503" ] && [ "$health_status" != "504" ]; then
              echo "CONTAINER_BOOT_HTTP_INVALID status=${health_status}" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$BOOT_DEADLINE_EPOCH" ]; then
              break
            fi
            sleep 5
          done
          if [ "$health_status" != "200" ]; then
            echo "CONTAINER_BOOT_TIMEOUT status=${health_status:-000}" >&2
            exit 1
          fi
          echo "CONTAINER_BOOT_GREEN url=${WORKER_URL} readiness=200"

          chat_status=""
          for chat_attempt in $(seq 1 6); do
            chat_status="$(curl --silent --show-error --output /tmp/alice-chat.json --write-out '%{http_code}' \
              --max-time 60 \
              -X POST \
              -H "x-alice-bringup-token: ${EDGE_TOKEN}" \
              -H 'content-type: application/json' \
              --data '{"model":"alice-cloudflare-bringup","messages":[{"role":"user","content":"In one short sentence, confirm you are responding from the temporary Cloudflare Alice canary."}]}' \
              "${WORKER_URL}/v1/chat/completions" || true)"
            if [ "$chat_status" = "200" ]; then
              break
            fi
            if [ "$chat_status" != "503" ]; then
              echo "CONVERSATION_HTTP_INVALID status=${chat_status:-000} attempt=${chat_attempt}" >&2
              exit 1
            fi
            if [ "$chat_attempt" -lt 6 ]; then
              echo "CONVERSATION_CONVERGENCE_RETRY status=503 attempt=${chat_attempt}"
              sleep 5
            fi
          done
          if [ "$chat_status" != "200" ]; then
            echo "CONVERSATION_HTTP_INVALID status=${chat_status:-000} attempts=6" >&2
            exit 1
          fi
          chat_content_raw="$(jq -er '.choices[0].message.content | select(type == "string" and length > 0)' /tmp/alice-chat.json)"
          chat_content="$(printf '%s' "$chat_content_raw" | tr '\r\n' '  ' | sed 's/::/: :/g' | cut -c1-400)"
          if [ -z "$chat_content" ]; then
            echo "CONVERSATION_CONTENT_INVALID" >&2
            exit 1
          fi
          chat_boundary="$(jq -cer '.alice_boundary | select(.authorityMode == "proposer-only" and .actionExecution == "disabled" and .tools == "disabled")' /tmp/alice-chat.json)"
          chat_model="$(jq -er '.model // "unknown"' /tmp/alice-chat.json)"
          echo "CONVERSATION_GREEN status=200 model=${chat_model} boundary=${chat_boundary}"
          echo "CONVERSATION_RESPONSE ${chat_content}"

          instances_json="$(npx wrangler containers instances "$app_id" --json)"
          instance_count="$(printf '%s' "$instances_json" | jq 'length')"
          if [ "$instance_count" != "1" ]; then
            echo "CONTAINER_CARDINALITY_INVALID count=${instance_count}" >&2
            exit 1
          fi
          instance_id="$(printf '%s' "$instances_json" | jq -er '.[0].id')"
          instance_state="$(printf '%s' "$instances_json" | jq -er '.[0].state')"
          echo "CONTAINER_INSTANCE_GREEN id=${instance_id} state=${instance_state} count=1"

          sleep 5
          if [ -s "$TAIL_LOG" ]; then
            tail_hash="sha256:$(sha256sum "$TAIL_LOG" | awk '{print $1}')"
            echo "OBSERVABILITY_CAPTURED hash=${tail_hash}"
            grep -E 'ALICE_TEMP_CONTAINER_STARTED|CONVERSATION|health/ready|chat/completions' "$TAIL_LOG" | tail -20 || true
          else
            echo "OBSERVABILITY_EMPTY" >&2
          fi

          if [ "$USER_TEST_WINDOW_MINUTES" != "0" ]; then
            printf '%s' "$ALICE_USER_TEST_LINK_TOKEN" | npx wrangler secret put \
              BRINGUP_USER_TEST_TOKEN --name "$WORKER_NAME" >/tmp/alice-user-test-secret.log
            echo "USER_TEST_LINK_BINDING_GREEN"

            final_page_status=""
            for final_page_attempt in $(seq 1 12); do
              final_page_status="$(curl --silent --show-error \
                --dump-header /tmp/alice-user-page.headers \
                --output /tmp/alice-user-page.html \
                --write-out '%{http_code}' --max-time 10 \
                "${WORKER_URL}/" || true)"
              if [ "$final_page_status" = "200" ]; then
                break
              fi
              if [ "$final_page_status" != "404" ] && [ "$final_page_status" != "503" ]; then
                echo "USER_TEST_FINAL_PAGE_INVALID status=${final_page_status:-000} attempt=${final_page_attempt}" >&2
                exit 1
              fi
              sleep 2
            done
            if [ "$final_page_status" != "200" ] ||
              ! grep -q 'id="chat-form"' /tmp/alice-user-page.html ||
              ! grep -qi '^content-security-policy:' /tmp/alice-user-page.headers; then
              echo "USER_TEST_FINAL_PAGE_INVALID status=${final_page_status:-000}" >&2
              exit 1
            fi
            echo "USER_TEST_FINAL_PAGE_GREEN status=200"

            final_health_status=""
            for final_health_attempt in $(seq 1 6); do
              final_health_status="$(curl --silent --show-error \
                --output /tmp/alice-user-health.json --write-out '%{http_code}' \
                --max-time 60 \
                -H "x-alice-bringup-token: ${EDGE_TOKEN}" \
                "${WORKER_URL}/health/ready" || true)"
              if [ "$final_health_status" = "200" ]; then
                break
              fi
              if [ "$final_health_status" != "503" ]; then
                echo "USER_TEST_FINAL_HEALTH_INVALID status=${final_health_status:-000} attempt=${final_health_attempt}" >&2
                exit 1
              fi
              sleep 5
            done
            if [ "$final_health_status" != "200" ]; then
              echo "USER_TEST_FINAL_HEALTH_INVALID status=${final_health_status:-000} attempts=6" >&2
              exit 1
            fi
            echo "USER_TEST_FINAL_HEALTH_GREEN status=200"

            final_chat_status=""
            for final_chat_attempt in $(seq 1 6); do
              final_chat_status="$(curl --silent --show-error \
                --output /tmp/alice-user-chat.json --write-out '%{http_code}' \
                --max-time 60 -X POST \
                -H "x-alice-user-test-token: ${ALICE_USER_TEST_LINK_TOKEN}" \
                -H 'content-type: application/json' \
                --data '{"model":"alice-cloudflare-bringup","messages":[{"role":"user","content":"Confirm in one short sentence that this private Alice test link is conversational."}]}' \
                "${WORKER_URL}/v1/chat/completions" || true)"
              if [ "$final_chat_status" = "200" ]; then
                break
              fi
              if [ "$final_chat_status" != "503" ]; then
                echo "USER_TEST_FINAL_CHAT_INVALID status=${final_chat_status:-000} attempt=${final_chat_attempt}" >&2
                exit 1
              fi
              sleep 5
            done
            if [ "$final_chat_status" != "200" ] ||
              ! jq -e '.choices[0].message.content | type == "string" and length > 0' /tmp/alice-user-chat.json >/dev/null ||
              ! jq -e '.alice_boundary | .authorityMode == "proposer-only" and .actionExecution == "disabled" and .tools == "disabled"' /tmp/alice-user-chat.json >/dev/null; then
              echo "USER_TEST_FINAL_CHAT_INVALID status=${final_chat_status:-000}" >&2
              exit 1
            fi
            echo "USER_TEST_FINAL_CHAT_GREEN status=200 boundary=proposer-only"

            final_instances_json="$(npx wrangler containers instances "$app_id" --json)"
            final_instance_count="$(printf '%s' "$final_instances_json" | jq 'length')"
            final_instance_state="$(printf '%s' "$final_instances_json" | jq -r 'if length == 1 then .[0].state else empty end')"
            if [ "$final_instance_count" != "1" ] || [ "$final_instance_state" != "running" ]; then
              echo "USER_TEST_FINAL_INSTANCE_INVALID state=${final_instance_state:-unknown} count=${final_instance_count}" >&2
              exit 1
            fi
            echo "USER_TEST_FINAL_INSTANCE_GREEN state=running count=1"

            if [ -n "$TAIL_PID" ]; then
              kill "$TAIL_PID" >/dev/null 2>&1 || true
              wait "$TAIL_PID" >/dev/null 2>&1 || true
              TAIL_PID=""
            fi
            /bin/rm -f /tmp/alice-*.log /tmp/alice-*.err /tmp/alice-health.json /tmp/alice-chat.json
            LINK_READY_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            EXPIRES_AT="$(date -u -d "+${USER_TEST_WINDOW_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$(date -u -d "$EXPIRES_AT" +%s)" -gt "$(date -u -d "$ABSOLUTE_EXPIRES_AT" +%s)" ]; then
              echo "USER_TEST_ABSOLUTE_EXPIRY_INVALID" >&2
              exit 1
            fi
            echo "USER_TEST_LINK_READY url=${WORKER_URL} expires=${EXPIRES_AT}"
            expiry_epoch="$(date -u -d "$EXPIRES_AT" +%s)"
            while true; do
              now_epoch="$(date +%s)"
              if [ "$now_epoch" -ge "$expiry_epoch" ]; then
                break
              fi
              remaining_seconds="$((expiry_epoch - now_epoch))"
              sleep_seconds=30
              if [ "$remaining_seconds" -lt "$sleep_seconds" ]; then
                sleep_seconds="$remaining_seconds"
              fi
              echo "USER_TEST_WINDOW_CHECKPOINT remaining_seconds=${remaining_seconds}"
              sleep "$sleep_seconds"
            done
            echo "USER_TEST_WINDOW_EXPIRED expires=${EXPIRES_AT}"
            cleanup
            CLEANUP_COMPLETE=1
            trap - EXIT INT TERM
            teardown_summary="Primary expiry owner proved Worker, Container, and registry tag absent at ${EXPIRES_AT}"
          else
            cleanup
            CLEANUP_COMPLETE=1
            trap - EXIT INT TERM
            teardown_summary="Worker absent; Container absent; registry tag absent"
          fi

          {
            echo "- GitHub run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "- Cloudflare registry image: ${cf_registry_digest}"
            echo "- Temporary Worker URL: ${WORKER_URL}"
            echo "- Container application: ${app_id}"
            echo "- Runtime readiness: HTTP 200"
            echo "- Conversation model: ${chat_model}"
            echo "- Conversation response: ${chat_content}"
            echo "- Conversation boundary: proposer-only; actions/tools disabled"
            echo "- Teardown: ${teardown_summary}"
          } >> "$GITHUB_STEP_SUMMARY"

  failsafe:
    name: Independent expiry and teardown guard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: alice-cloudflare-bringup
    env:
      CLOUDFLARE_ACCOUNT_ID: "036df6c823669b8fa2f66cf4c16eeb29"
      WRANGLER_VERSION: 4.122.0
      USER_TEST_WINDOW_MINUTES: ${{ inputs.user_test_window_minutes }}
    steps:
      - name: Enforce independent 30-minute expiry and absence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINER_BRINGUP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILSAFE_STARTED_EPOCH="$(date +%s)"

          WORKER_NAME="alice-cf-bringup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APP_NAME="${WORKER_NAME}-app"
          CF_IMAGE="${WORKER_NAME}"
          CF_TAG="ghcr-983041c9d8691bcebda35872f07e8a8d43912fb8594e84f3af5d04d25cc165e2"
          CF_IMAGE_TAG="${CF_IMAGE}:${CF_TAG}"
          REAPER_DIR="${RUNNER_TEMP}/alice-cloudflare-container-reaper"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_CONTAINER_BRINGUP_TOKEN is not configured" >&2
            exit 1
          fi

          mkdir -p "$REAPER_DIR"
          npm install --prefix "$REAPER_DIR" --ignore-scripts --no-audit --no-fund \
            "wrangler@${WRANGLER_VERSION}" >/dev/null
          WRANGLER="${REAPER_DIR}/node_modules/.bin/wrangler"

          list_all_container_apps() (
            set -euo pipefail
            local all_apps='[]'
            local page_token=''
            local previous_page_token=''
            local response_file="${RUNNER_TEMP}/alice-failsafe-container-apps-${BASHPID}.json"
            trap '/bin/rm -f "$response_file"' EXIT

            for page in $(seq 1 20); do
              curl_args=(
                --silent --show-error --max-time 5
                --output "$response_file" --write-out '%{http_code}'
                --get
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
                --data-urlencode 'per_page=1000'
              )
              if [ -n "$page_token" ]; then
                curl_args+=(--data-urlencode "page_token=${page_token}")
              fi
              http_status="$(curl "${curl_args[@]}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/dash/applications")"
              if [ "$http_status" != "200" ] || ! jq -e \
                '.success == true and (.result | type == "array") and ((.result_info // {}) | type == "object")' \
                "$response_file" >/dev/null; then
                echo "CONTAINER_INVENTORY_INVALID page=${page} http=${http_status}" >&2
                return 1
              fi
              page_apps="$(jq -c '.result' "$response_file")"
              all_apps="$(jq -cn --argjson prior "$all_apps" --argjson page "$page_apps" '$prior + $page')"
              previous_page_token="$page_token"
              page_token="$(jq -r '.result_info.next_page_token // empty' "$response_file")"
              if [ -z "$page_token" ]; then
                printf '%s\n' "$all_apps"
                return 0
              fi
              if [ "$page_token" = "$previous_page_token" ]; then
                echo "CONTAINER_INVENTORY_PAGINATION_INVALID page=${page}" >&2
                return 1
              fi
            done
            echo "CONTAINER_INVENTORY_PAGE_LIMIT" >&2
            return 1
          )

          cleanup_exact_resources() (
            local cleanup_rc=0
            set +e
            echo "FAILSAFE_TEARDOWN_START worker=${WORKER_NAME} app=${APP_NAME} image=${CF_IMAGE_TAG}"

            timeout --signal=TERM 30s "$WRANGLER" delete "$WORKER_NAME" --force >/tmp/alice-failsafe-worker-delete.log 2>&1 || true

            for _attempt in $(seq 1 4); do
              apps_json="$(list_all_container_apps 2>/tmp/alice-failsafe-container-list.err)" || {
                cat /tmp/alice-failsafe-container-list.err >&2
                cleanup_rc=1
                apps_json='[]'
                break
              }
              app_id="$(printf '%s' "$apps_json" | jq -r --arg name "$APP_NAME" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else empty end')"
              if [ -z "$app_id" ]; then
                break
              fi
              timeout --signal=TERM 30s "$WRANGLER" containers delete "$app_id" >/tmp/alice-failsafe-container-delete.log 2>&1 || true
              sleep 5
            done

            timeout --signal=TERM 30s "$WRANGLER" containers images delete "$CF_IMAGE_TAG" --skip-confirmation >/tmp/alice-failsafe-image-delete.log 2>&1 || true

            worker_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" || true)"
            final_apps="$(list_all_container_apps 2>/tmp/alice-failsafe-final-container-list.err)" || {
              cat /tmp/alice-failsafe-final-container-list.err >&2
              cleanup_rc=1
              final_apps='[]'
            }
            final_images="$(timeout --signal=TERM 30s "$WRANGLER" containers images list --filter "^(${CLOUDFLARE_ACCOUNT_ID}/)?${CF_IMAGE}$" --json 2>/tmp/alice-failsafe-final-image-list.err)" || {
              cat /tmp/alice-failsafe-final-image-list.err >&2
              cleanup_rc=1
              final_images='[]'
            }
            remaining_apps="$(printf '%s' "$final_apps" | jq --arg name "$APP_NAME" '[.[] | select(.name == $name)] | length')"
            remaining_tags="$(printf '%s' "$final_images" | jq --arg name "$CF_IMAGE" --arg tag "$CF_TAG" '[.[] | select(.name == $name and (.tags | index($tag)))] | length')"

            if [ "$worker_status" != "404" ] || [ "$remaining_apps" != "0" ] || [ "$remaining_tags" != "0" ]; then
              echo "FAILSAFE_TEARDOWN_INVALID worker_http=${worker_status} remaining_apps=${remaining_apps} remaining_tags=${remaining_tags}" >&2
              cleanup_rc=1
            else
              echo "FAILSAFE_TEARDOWN_GREEN worker_http=404 remaining_apps=0 remaining_tags=0"
            fi
            /bin/rm -rf "$REAPER_DIR"
            /bin/rm -f /tmp/alice-failsafe-*.log /tmp/alice-failsafe-*.err
            return "$cleanup_rc"
          )

          FAILSAFE_CLEANUP_COMPLETE=0
          failsafe_cleanup_once() {
            if [ "$FAILSAFE_CLEANUP_COMPLETE" = "1" ]; then
              return 0
            fi
            if cleanup_exact_resources; then
              FAILSAFE_CLEANUP_COMPLETE=1
              return 0
            fi
            return 1
          }
          failsafe_on_exit() {
            local original_rc=$?
            trap - EXIT INT TERM
            if [ "$FAILSAFE_CLEANUP_COMPLETE" != "1" ]; then
              failsafe_cleanup_once || true
            fi
            exit "$original_rc"
          }
          trap failsafe_on_exit EXIT INT TERM

          first_seen_epoch=""
          deadline_epoch=""
          expiry_seconds=1800
          case "$USER_TEST_WINDOW_MINUTES" in
            60) expiry_seconds=5100 ;;
            300) expiry_seconds=19500 ;;
          esac
          while true; do
            now_epoch="$(date +%s)"
            worker_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 5 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" || true)"
            if ! primary_snapshot="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "Import, converse, and tear down")] | if length == 1 then {status:.[0].status,conclusion:(.[0].conclusion // "")} else {status:"unknown",conclusion:""} end')"; then
              primary_snapshot='{"status":"unknown","conclusion":""}'
              echo "FAILSAFE_GITHUB_READ_TRANSIENT"
            fi
            primary_state="$(printf '%s' "$primary_snapshot" | jq -r '.status')"
            primary_conclusion="$(printf '%s' "$primary_snapshot" | jq -r '.conclusion')"

            if [ -z "$first_seen_epoch" ] && [ "$worker_status" = "200" ]; then
              if [ "$USER_TEST_WINDOW_MINUTES" = "300" ] &&
                [ "$now_epoch" -gt "$(( FAILSAFE_STARTED_EPOCH + 1800 ))" ]; then
                echo "FAILSAFE_PROVIDER_BUDGET_EXCEEDED"
                failsafe_cleanup_once
                trap - EXIT INT TERM
                exit 0
              fi
              first_seen_epoch="$now_epoch"
              deadline_epoch="$((now_epoch + expiry_seconds))"
              echo "FAILSAFE_ARMED first_seen_epoch=${first_seen_epoch} deadline_epoch=${deadline_epoch}"
            fi

            case "$primary_conclusion" in
              failure|cancelled|timed_out|action_required|stale|skipped)
                echo "FAILSAFE_PRIMARY_UNSAFE conclusion=${primary_conclusion}"
                failsafe_cleanup_once
                trap - EXIT INT TERM
                exit 0
                ;;
            esac
            if [ "$primary_state" = "completed" ] && [ "$primary_conclusion" != "success" ]; then
              echo "FAILSAFE_PRIMARY_UNSAFE conclusion=unknown"
              failsafe_cleanup_once
              trap - EXIT INT TERM
              exit 0
            fi
            if [ "$primary_state" = "completed" ] && [ "$USER_TEST_WINDOW_MINUTES" = "0" ]; then
              echo "FAILSAFE_PRIMARY_TERMINAL"
              failsafe_cleanup_once
              trap - EXIT INT TERM
              exit 0
            fi
            if [ -n "$first_seen_epoch" ] && [ "$worker_status" = "404" ]; then
              echo "FAILSAFE_PRIMARY_TEARDOWN_OBSERVED"
              failsafe_cleanup_once
              trap - EXIT INT TERM
              exit 0
            fi
            if [ -n "$deadline_epoch" ] && [ "$now_epoch" -ge "$deadline_epoch" ]; then
              echo "FAILSAFE_EXPIRY_REACHED"
              failsafe_cleanup_once
              trap - EXIT INT TERM
              exit 0
            fi

            echo "FAILSAFE_CHECKPOINT worker_http=${worker_status} primary_status=${primary_state} primary_conclusion=${primary_conclusion:-none} now_epoch=${now_epoch}"
            sleep 15
          done
