name: Recover Alice v4 Control Only

on:
  workflow_dispatch:

concurrency:
  group: alice-cloudflare-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  recover:
    name: Restore admitted v15 control reader while paused
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: alice-production
    steps:
      - name: Checkout protected release controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Require exact protected controller
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/release/alice-production-core-2026-08-22"
          test "$REF_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/alice-production-core-2026-08-22" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install exact Wrangler used by recovery dry run
        run: npm install --global wrangler@4.103.0

      - name: Download immutable failed-release rollback anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$(gh api repos/rndrntwrk/milaidy/actions/artifacts/10856594865)"
          test "$(jq -r .name <<<"$artifact")" = "alice-recovery-evidence-c60da065460ce29602475e8fd4a2859b629a1919-36117813657-1"
          test "$(jq -r .digest <<<"$artifact")" = "sha256:b0125ac2d71c10f9594daeffaae582d3a13c1c920e8307850a4512259aedf369"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "36117813657"
          gh run download 36117813657 \
            -n alice-recovery-evidence-c60da065460ce29602475e8fd4a2859b629a1919-36117813657-1 \
            -D "$RUNNER_TEMP/alice-recovery-evidence"

      - name: Build and verify only the compatible prior control Worker
        run: node deploy/recovery/alice_v4_control_recovery.mjs prepare

      - name: Upload, verify, and serve only the compatible control Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALICE_RELEASE_ACCESS_CLIENT_ID: ${{ secrets.ALICE_RELEASE_ACCESS_CLIENT_ID }}
          ALICE_RELEASE_ACCESS_CLIENT_SECRET: ${{ secrets.ALICE_RELEASE_ACCESS_CLIENT_SECRET }}
          ALICE_DEPLOYMENT_PAUSE_TOKEN: ${{ secrets.ALICE_DEPLOYMENT_PAUSE_TOKEN }}
        run: node deploy/recovery/alice_v4_control_recovery.mjs promote
