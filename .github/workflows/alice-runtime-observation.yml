name: Alice runtime observation

on:
  push:
    branches:
      - feat/alice-runtime-observation-2026-09-01

permissions:
  contents: read
  packages: read
  attestations: read
  actions: read

concurrency:
  group: alice-runtime-observation-${{ github.ref }}
  cancel-in-progress: true

env:
  ALICE_SUBJECT_SHA: 7a80b4a2f02cc7f93e91bbc4dc27f080e9947bc1
  ALICE_ELIZA_SHA: c23902bf3f43969736bb9a0f52c99f32239b8aab
  ALICE_SOURCE_IMAGE: ghcr.io/rndrntwrk/milaidy-agent@sha256:fb90ad07408c42e0078c72e63c2cf55e5bf20f4aa1f5cc55d9e673427e9dce2c

jobs:
  observe-existing-runtime:
    name: observe-existing-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact successful-build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.ALICE_SUBJECT_SHA }}
          path: subject
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Use exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Use exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Verify observation implementation
        working-directory: oracle
        run: |
          set -euo pipefail
          bash -n scripts/alice_prepare_legacy_runtime_context.sh
          bash -n scripts/alice_observe_legacy_runtime.sh
          node --test deploy/alice_*.test.mjs

      - name: Observe exact successful legacy runtime
        env:
          ALICE_ORACLE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash oracle/scripts/alice_observe_legacy_runtime.sh \
            oracle \
            subject \
            "${RUNNER_TEMP}/alice-runtime-observation" \
            "${RUNNER_TEMP}/alice-runtime-observation-${ALICE_SUBJECT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Upload exact observation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alice-runtime-observation-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alice-runtime-observation-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
            ${{ runner.temp }}/alice-runtime-observation-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alice-runtime-observation-failure-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-runtime-observation
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: false

      - name: Observation summary
        if: success()
        run: |
          set -euo pipefail
          OBSERVATION="${RUNNER_TEMP}/alice-runtime-observation/runtime-observation.json"
          {
            echo "## Alice runtime observation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Subject source | \`$ALICE_SUBJECT_SHA\` |"
            echo "| Eliza source | \`$ALICE_ELIZA_SHA\` |"
            echo "| Existing image | \`$ALICE_SOURCE_IMAGE\` |"
            echo "| Context entries | \`$(jq -r .context.entryCount "$OBSERVATION")\` |"
            echo "| Context bytes | \`$(jq -r .context.totalFileBytes "$OBSERVATION")\` |"
            echo "| Runtime entries | \`$(jq -r .runtimeRoot.entryCount "$OBSERVATION")\` |"
            echo "| Runtime bytes | \`$(jq -r .runtimeRoot.totalFileBytes "$OBSERVATION")\` |"
            echo "| Runtime contract bytes | \`$(jq -r .runtimeRoot.contractBytes "$OBSERVATION")\` |"
            echo "| Observation digest | \`$(jq -r .observationSha256 "$OBSERVATION")\` |"
            echo ""
            echo "No source image, Worker, route, Cloudflare resource, credential, signature, or production state was mutated."
          } >> "$GITHUB_STEP_SUMMARY"
