name: Alice runtime observation

on:
  push:
    branches:
      - feat/alice-runtime-observation-2026-09-01

permissions:
  contents: read

concurrency:
  group: alice-runtime-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observation-contracts:
    name: observation-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run observation contract suite
        run: node --test deploy/alice_*.test.mjs
