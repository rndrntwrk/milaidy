name: Alice runtime observation

on:
  push:
    branches:
      - feat/alice-runtime-observation-2026-09-01

permissions:
  contents: read
  packages: read
  attestations: read
  actions: read

concurrency:
  group: alice-runtime-observation-${{ github.ref }}
  cancel-in-progress: true

env:
  ALICE_SUBJECT_SHA: 7a80b4a2f02cc7f93e91bbc4dc27f080e9947bc1
  ALICE_ELIZA_SHA: c23902bf3f43969736bb9a0f52c99f32239b8aab
  ALICE_SOURCE_IMAGE: ghcr.io/rndrntwrk/milaidy-agent@sha256:fb90ad07408c42e0078c72e63c2cf55e5bf20f4aa1f5cc55d9e673427e9dce2c

jobs:
  observe-existing-runtime:
    name: observe-existing-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact observation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: oracle
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact successful-build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.ALICE_SUBJECT_SHA }}
          path: subject
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Use exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Use exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: false

      - name: Run observation contract suite
        working-directory: oracle
        run: node --test deploy/alice_*.test.mjs

      - name: Verify immutable observation inputs
        run: |
          set -euo pipefail
          test "$(git -C oracle rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C subject rev-parse HEAD)" = "$ALICE_SUBJECT_SHA"
          test "$(git -C subject ls-tree HEAD eliza | awk '{print $3}')" = "$ALICE_ELIZA_SHA"
          test ! -e subject/.dockerignore
          test ! -e subject/deploy/Dockerfile.runtime-context
          mkdir -p "${RUNNER_TEMP}/alice-runtime-observation"

      - name: Hydrate exact avatar assets
        working-directory: subject
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="apps/app/public/vrms/*.vrm.gz" --exclude=""
          node scripts/validate-cloud-avatar-assets.mjs

      - name: Hydrate exact reviewed Eliza source
        run: |
          set -euo pipefail
          test "$(git -C subject config -f .gitmodules --get submodule.eliza.url)" = \
            "https://github.com/rndrntwrk/eliza.git"
          test "$(git -C subject config -f .gitmodules --get submodule.eliza.branch)" = \
            "alice/runtime-stable-2026-08-22"
          git clone --no-checkout --filter=blob:none \
            https://github.com/rndrntwrk/eliza.git subject/eliza
          git -C subject/eliza fetch --depth=1 origin \
            "refs/pull/6/head:refs/remotes/origin/alice-reviewed-pr-6"
          test "$(git -C subject/eliza rev-parse refs/remotes/origin/alice-reviewed-pr-6)" = \
            "$ALICE_ELIZA_SHA"
          git -C subject/eliza fetch --depth=1 origin "$ALICE_ELIZA_SHA"
          git -C subject/eliza checkout --detach "$ALICE_ELIZA_SHA"
          test "$(git -C subject/eliza rev-parse HEAD)" = "$ALICE_ELIZA_SHA"
          if [ -f subject/cloud/patches/cloud-runtime-patches.patch ]; then
            git -C subject/eliza apply ../cloud/patches/cloud-runtime-patches.patch
          fi
          LIFEOPS_UI=subject/eliza/apps/app-lifeops/src/ui.ts
          if [ -f "$LIFEOPS_UI" ] && ! grep -q 'AppBlockerSettingsCard' "$LIFEOPS_UI"; then
            if grep -q 'WebsiteBlockerSettingsCard' "$LIFEOPS_UI"; then
              WBSC_PATH="$(grep 'WebsiteBlockerSettingsCard' "$LIFEOPS_UI" | grep 'export \*' | sed 's/export \* from "//;s/";$//' | head -1)"
              echo "export { WebsiteBlockerSettingsCard as AppBlockerSettingsCard } from \"${WBSC_PATH:-./components/WebsiteBlockerSettingsCard.tsx}\";" >> "$LIFEOPS_UI"
            fi
          fi
          test -f subject/eliza/package.json

      - name: Restore Bun package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.bun/install/cache
          key: alice-observation-bun-${{ runner.os }}-${{ hashFiles('subject/bun.lock', 'subject/eliza/bun.lock') }}
          restore-keys: |
            alice-observation-bun-${{ runner.os }}-

      - name: Reproduce exact content-producing build sequence
        env:
          ALICE_EXPECTED_SOURCE_COMMIT: ${{ env.ALICE_SUBJECT_SHA }}
          ALICE_EXPECTED_ELIZA_COMMIT: ${{ env.ALICE_ELIZA_SHA }}
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            -o "${RUNNER_TEMP}/alice-runtime-observation/preparation-resource.txt" \
            bash oracle/scripts/alice_prepare_legacy_runtime_context.sh subject

      - name: Materialize exact CI Docker context policy
        run: |
          set -euo pipefail
          node oracle/deploy/alice_ci_dockerignore.mjs \
            --base subject/eliza/packages/app-core/deploy/.dockerignore.ci \
            --output subject/.dockerignore \
            --receipt "${RUNNER_TEMP}/alice-runtime-observation/dockerignore-receipt.json"
          cp -- oracle/deploy/Dockerfile.runtime-context \
            subject/deploy/Dockerfile.runtime-context
          chmod 0444 subject/deploy/Dockerfile.runtime-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2528633257a7a0601cb66c819263f8ac7f4608
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Observe actual BuildKit-visible context
        run: |
          set -euo pipefail
          OBS_ROOT="${RUNNER_TEMP}/alice-runtime-observation"
          CONTEXT_ROOT="${RUNNER_TEMP}/alice-build-context-root"
          CONTEXT_DOCKERFILE_SHA256="$(node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("oracle/deploy/alice_runtime_build_policy.v1.json", "utf8"));
            process.stdout.write(p.contextExporterDockerfileSha256);
          ')"
          /usr/bin/time -v \
            -o "$OBS_ROOT/context-resource.txt" \
            node oracle/deploy/alice_runtime_context_snapshot.mjs \
              --repo-root subject \
              --dockerfile deploy/Dockerfile.runtime-context \
              --dockerfile-sha256 "$CONTEXT_DOCKERFILE_SHA256" \
              --output-directory "$CONTEXT_ROOT" \
              --contract "$OBS_ROOT/build-context.json" \
              --source-commit "$ALICE_SUBJECT_SHA" \
              --eliza-commit "$ALICE_ELIZA_SHA" \
              --policy oracle/deploy/alice_runtime_context_policy.v1.json \
              --timeout-ms 900000
          CONTEXT="$OBS_ROOT/build-context.json" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync(process.env.CONTEXT, "utf8"));
          if (value.entries.some((entry) => entry.path === "deploy/Dockerfile.runtime-context")) {
            throw new Error("ALICE_CONTEXT_EXPORTER_LEAKED_INTO_CONTEXT");
          }
          NODE
          rm -rf -- "$CONTEXT_ROOT"
          rm -f -- subject/deploy/Dockerfile.runtime-context

      - name: Log in to GHCR read-only
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and pull the exact successful image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${ALICE_SOURCE_IMAGE}" \
            --repo rndrntwrk/milaidy \
            --signer-workflow rndrntwrk/milaidy/.github/workflows/build-cloud-agent.yml \
            --source-digest "$ALICE_SUBJECT_SHA" \
            --source-ref refs/heads/release/alice-production-core-2026-08-22 \
            --deny-self-hosted-runners
          docker pull --platform linux/amd64 "$ALICE_SOURCE_IMAGE"
          test "$(docker image inspect "$ALICE_SOURCE_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
            "$ALICE_SUBJECT_SHA"

      - name: Observe exact image configuration and runtime root
        run: |
          set -euo pipefail
          OBS_ROOT="${RUNNER_TEMP}/alice-runtime-observation"
          docker image inspect "$ALICE_SOURCE_IMAGE" > "$OBS_ROOT/image-inspect.raw.json"
          node oracle/deploy/alice_image_observation.mjs image \
            --inspect "$OBS_ROOT/image-inspect.raw.json" \
            --output "$OBS_ROOT/image-observation.json"
          rm -f -- "$OBS_ROOT/image-inspect.raw.json"

          /usr/bin/time -v \
            -o "$OBS_ROOT/runtime-root-resource.txt" \
            docker run --rm \
              --platform linux/amd64 \
              --entrypoint node \
              -v "$GITHUB_WORKSPACE/oracle/deploy/alice_runtime_root_contract.mjs:/oracle/alice_runtime_root_contract.mjs:ro" \
              -v "$GITHUB_WORKSPACE/oracle/deploy/alice_runtime_root_policy.v1.json:/oracle/alice_runtime_root_policy.v1.json:ro" \
              -v "$OBS_ROOT:/out" \
              "$ALICE_SOURCE_IMAGE" \
              /oracle/alice_runtime_root_contract.mjs write \
                --root /app \
                --kind runtime-root \
                --output /out/runtime-root.json \
                --source-commit "$ALICE_SUBJECT_SHA" \
                --eliza-commit "$ALICE_ELIZA_SHA" \
                --platform linux/amd64 \
                --policy /oracle/alice_runtime_root_policy.v1.json

          docker run --rm --platform linux/amd64 --entrypoint cat \
            "$ALICE_SOURCE_IMAGE" \
            /app/alice-runtime-build-manifest.json \
            > "$OBS_ROOT/runtime-build-manifest.json"
          docker run --rm --platform linux/amd64 --entrypoint cat \
            "$ALICE_SOURCE_IMAGE" \
            /app/alice-capability-bom.json \
            > "$OBS_ROOT/capability-bom.json"

          node oracle/deploy/alice_image_observation.mjs runtime \
            --context "$OBS_ROOT/build-context.json" \
            --runtime-root "$OBS_ROOT/runtime-root.json" \
            --image "$OBS_ROOT/image-observation.json" \
            --runtime-manifest "$OBS_ROOT/runtime-build-manifest.json" \
            --capability-bom "$OBS_ROOT/capability-bom.json" \
            --output "$OBS_ROOT/runtime-observation.json"

      - name: Seal exact observation artifact
        run: |
          set -euo pipefail
          OBS_ROOT="${RUNNER_TEMP}/alice-runtime-observation"
          rm -f -- "$OBS_ROOT/image-inspect.raw.json"
          OBS_ROOT="$OBS_ROOT" \
          ORACLE_COMMIT="$GITHUB_SHA" \
          SUBJECT_COMMIT="$ALICE_SUBJECT_SHA" \
          ELIZA_COMMIT="$ALICE_ELIZA_SHA" \
          SOURCE_IMAGE="$ALICE_SOURCE_IMAGE" \
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const root = process.env.OBS_ROOT;
          const names = [
            "build-context.json",
            "capability-bom.json",
            "context-resource.txt",
            "dockerignore-receipt.json",
            "image-observation.json",
            "preparation-resource.txt",
            "runtime-build-manifest.json",
            "runtime-observation.json",
            "runtime-root-resource.txt",
            "runtime-root.json",
          ];
          const digest = (bytes) => `sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`;
          const files = {};
          for (const name of names) {
            const file = path.join(root, name);
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size === 0) {
              throw new Error(`ALICE_OBSERVATION_FILE_INVALID:${name}`);
            }
            const bytes = fs.readFileSync(file);
            files[name] = { bytes: bytes.length, sha256: digest(bytes) };
          }
          const receipt = {
            schemaVersion: "alice.runtime-observation-digests.v1",
            oracleCommit: process.env.ORACLE_COMMIT,
            subjectCommit: process.env.SUBJECT_COMMIT,
            elizaCommit: process.env.ELIZA_COMMIT,
            sourceImage: process.env.SOURCE_IMAGE,
            files,
          };
          const unsigned = Buffer.from(`${JSON.stringify(receipt, null, 2)}\n`);
          receipt.receiptSha256 = digest(unsigned);
          fs.writeFileSync(
            path.join(root, "observation-digests.json"),
            `${JSON.stringify(receipt, null, 2)}\n`,
            { flag: "wx", mode: 0o444 },
          );
          NODE

          ARCHIVE="${RUNNER_TEMP}/alice-runtime-observation-${ALICE_SUBJECT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C "$OBS_ROOT" -cf - . | gzip -n > "$ARCHIVE"
          printf 'sha256:%s\n' "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" \
            > "${ARCHIVE}.sha256"
          echo "ALICE_OBSERVATION_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload exact observation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alice-runtime-observation-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ALICE_OBSERVATION_ARCHIVE }}
            ${{ env.ALICE_OBSERVATION_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alice-runtime-observation-failure-${{ env.ALICE_SUBJECT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alice-runtime-observation
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: false

      - name: Observation summary
        if: success()
        run: |
          OBSERVATION="${RUNNER_TEMP}/alice-runtime-observation/runtime-observation.json"
          {
            echo "## Alice runtime observation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Subject source | \`$ALICE_SUBJECT_SHA\` |"
            echo "| Eliza source | \`$ALICE_ELIZA_SHA\` |"
            echo "| Existing image | \`$ALICE_SOURCE_IMAGE\` |"
            echo "| Context entries | \`$(jq -r .context.entryCount "$OBSERVATION")\` |"
            echo "| Context bytes | \`$(jq -r .context.totalFileBytes "$OBSERVATION")\` |"
            echo "| Runtime entries | \`$(jq -r .runtimeRoot.entryCount "$OBSERVATION")\` |"
            echo "| Runtime bytes | \`$(jq -r .runtimeRoot.totalFileBytes "$OBSERVATION")\` |"
            echo "| Runtime contract bytes | \`$(jq -r .runtimeRoot.contractBytes "$OBSERVATION")\` |"
            echo "| Observation digest | \`$(jq -r .observationSha256 "$OBSERVATION")\` |"
            echo ""
            echo "No source image, Worker, route, Cloudflare resource, credential, signature, or production state was mutated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local image state
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/alice-runtime-observation/image-inspect.raw.json"
          docker image rm "$ALICE_SOURCE_IMAGE" >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true
