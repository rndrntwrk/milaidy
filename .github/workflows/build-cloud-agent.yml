# =============================================================================
# build-cloud-agent.yml — Build cloud agent image with GitHub Actions Docker cache
# =============================================================================
#
# Triggers:
#   - Push to cloud/main or cloud/staging branch
#   - Manual dispatch with version override
#
# Published to: ghcr.io/<repository-owner>/milaidy-agent
#   Tags (production): :cloud-v{version}         and :cloud-latest
#   Tags (staging):    :cloud-staging-v{version} and :cloud-staging-latest
#
# Uses docker/build-push-action's GHA cache for fast rebuilds.
# Typical warm build: ~2-4 min vs ~8-10 min without cache.
# =============================================================================

name: Build Cloud Agent

on:
  push:
    branches:
      - cloud/main
      - cloud/staging
  workflow_dispatch:
    inputs:
      version:
        description: "Cloud version tag (e.g. 2.0.3). Defaults to auto-increment."
        required: false
        type: string
      source_sha:
        description: "Exact Alice commit to build"
        required: false
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        type: boolean
        default: true
      skip_rollout:
        description: "Skip auto-rollout to nodes (build + push only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-cloud-agent-${{ inputs.source_sha || (github.event_name == 'push' && github.ref_name || (github.ref_name == 'cloud/staging' && 'cloud/staging' || 'cloud/main')) }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/milaidy-agent
  SOURCE_REF: ${{ inputs.source_sha || (github.event_name == 'push' && github.ref_name || (github.ref_name == 'cloud/staging' && 'cloud/staging' || 'cloud/main')) }}
  CLOUD_DEPLOY_WEBHOOK_URL: http://89.167.63.246:9876/deploy

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build cloud agent image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Enforce Alice release dispatch contract
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/alice-production-core-2026-08-22' && (inputs.source_sha == '' || inputs.skip_rollout != true) }}
        run: |
          echo "Alice release dispatches require exact source_sha and skip_rollout=true" >&2
          exit 1

      - name: Require isolated Alice candidate mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha != '' && inputs.skip_rollout != true }}
        run: |
          echo "Exact Alice source_sha builds require skip_rollout=true" >&2
          exit 1

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Require exact protected Alice release head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha != '' }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PROTECTED_ALICE_REF: refs/heads/release/alice-production-core-2026-08-22
        run: |
          if ! printf '%s' "$REQUESTED_SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "Alice source_sha must be an exact lowercase commit" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "$PROTECTED_ALICE_REF" ]; then
            echo "Alice exact-image builds must be dispatched from $PROTECTED_ALICE_REF" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$REQUESTED_SOURCE_SHA" != "$GITHUB_SHA" ] || [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "Alice source_sha must equal the protected release branch head" >&2
            exit 1
          fi

      - name: Resolve checked-out source revision
        id: source_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── 2. Set up Node + Bun ────────────────────────────────────────────────
      - name: Setup Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Hydrate Alice runtime avatar assets
        run: |
          git lfs install --local
          git lfs pull --include="apps/app/public/vrms/*.vrm.gz" --exclude=""

      - name: Validate Alice runtime avatar assets
        run: node scripts/validate-cloud-avatar-assets.mjs

      # ── 3. Cache bun store ──────────────────────────────────────────────────
      - name: Cache bun store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-store-cloud-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-cloud-${{ runner.os }}-

      # ── 3.5. Init submodules + patch workspace for CI ──────────────
      - name: Init submodules
        id: eliza_revision
        run: |
          # The parent gitlink is the release authority. Hydrate that exact
          # commit from the independently reviewed PR head in the canonical
          # organization fork; never float on either develop branch.
          eliza_sha="$(git ls-tree HEAD eliza | awk '{print $3}')"
          test "${#eliza_sha}" -eq 40
          expected_eliza_sha="a21d401bf7429bc8c794698b20832512b5315187"
          reviewed_eliza_ref="refs/pull/5/head"
          git clone --no-checkout --filter=blob:none https://github.com/rndrntwrk/eliza.git eliza
          git -C eliza fetch --depth=1 origin "$reviewed_eliza_ref:refs/remotes/origin/alice-reviewed-pr-5"
          reviewed_eliza_sha="$(git -C eliza rev-parse refs/remotes/origin/alice-reviewed-pr-5)"
          test "$reviewed_eliza_sha" = "$expected_eliza_sha"
          test "$eliza_sha" = "$reviewed_eliza_sha"
          git -C eliza fetch --depth=1 origin "$eliza_sha"
          git -C eliza checkout --detach "$eliza_sha"
          test "$(git -C eliza rev-parse HEAD)" = "$eliza_sha"
          echo "sha=$eliza_sha" >> "$GITHUB_OUTPUT"
          test "$(git config -f .gitmodules --get submodule.eliza.branch)" = "alice/runtime-stable-2026-08-22"
          # Apply cloud runtime patches to eliza submodule
          if [ -f cloud/patches/cloud-runtime-patches.patch ]; then
            echo "Applying cloud runtime patches to eliza submodule..."
            cd eliza && git apply ../cloud/patches/cloud-runtime-patches.patch && cd ..
            echo "Cloud patches applied successfully"
          fi
          # AppBlockerSettingsCard alias — not in upstream eliza yet, add inline
          # milady develop main.tsx imports it; alias to WebsiteBlockerSettingsCard until merged upstream
          LIFEOPS_UI=eliza/apps/app-lifeops/src/ui.ts
          if [ -f "$LIFEOPS_UI" ] && ! grep -q 'AppBlockerSettingsCard' "$LIFEOPS_UI"; then
            if grep -q 'WebsiteBlockerSettingsCard' "$LIFEOPS_UI"; then
              WBSC_PATH=$(grep 'WebsiteBlockerSettingsCard' "$LIFEOPS_UI" | grep 'export \*' | sed 's/export \* from "//;s/";$//')
              echo "export { WebsiteBlockerSettingsCard as AppBlockerSettingsCard } from \"${WBSC_PATH:-./components/WebsiteBlockerSettingsCard.tsx}\";" >> "$LIFEOPS_UI"
              echo "AppBlockerSettingsCard alias added to $LIFEOPS_UI"
            fi
          fi
          test -f eliza/package.json

      # ── 4. Install dependencies ─────────────────────────────────────────────
      - name: Port Alice operator bridge
        run: node scripts/port-alice-operator-bridge.mjs

      - name: Port Alice product plugins
        run: node scripts/port-alice-product-plugins.mjs

      - name: Install dependencies
        run: |
          bun install --ignore-scripts --frozen-lockfile
          cd eliza
          bun install --ignore-scripts --frozen-lockfile

      - name: Qualify Alice production-core contracts
        env:
          ALICE_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          ALICE_WORKER_CONTRACT_REPLAY: "1"
          ALICE_REPLAY_SOURCE_COMMIT: ${{ steps.source_revision.outputs.sha }}
        run: |
          bun test \
            packages/app-core/src/api/server.health-probes.test.ts \
            packages/agent/src/api/alice-production-auth-boundary.test.ts \
            packages/agent/src/api/alice-production-capabilities.test.ts \
            packages/agent/src/api/alice-production-chat.test.ts \
            packages/agent/src/api/alice-production-guard.test.ts \
            packages/agent/src/api/alice-production-proof.test.ts \
            packages/agent/src/api/alice-release-metadata.test.ts \
            packages/agent/src/runtime/alice-capability-inventory.test.ts \
            packages/agent/src/runtime/alice-production-plugin-policy.test.ts \
            packages/agent/src/runtime/alice-production-runtime-plugin.test.ts \
            packages/agent/src/runtime/alice-production-startup-guard.test.ts \
            deploy/modal/alice_production_acceptance.test.ts \
            deploy/modal/verify_alice_program_admission.test.ts \
            workers/alice-access-gateway/test/index.test.ts \
            workers/alice-production-control/test/*.test.ts \
            workers/alice-state-plane/test/*.test.ts \
            workers/alice-connector-plane/test/*.test.ts
          node --test \
            deploy/modal/alice_capability_bom.test.mjs \
            deploy/modal/alice_cloudflare_container_image.test.mjs \
            deploy/modal/alice_cloudflare_bootstrap.test.mjs \
            workers/alice-ai-gateway/src/index.test.mjs \
            deploy/modal/alice_cloudflare_config.test.mjs \
            deploy/modal/alice_cloudflare_continuity.test.mjs \
            deploy/modal/alice_cloudflare_live_readback.test.mjs \
            deploy/modal/alice_cloudflare_provider_config.test.mjs \
            deploy/modal/alice_cloudflare_provider_readback.test.mjs \
            deploy/modal/alice_cloudflare_recovery_preprovision.test.mjs \
            deploy/modal/alice_program_signing_key.test.mjs \
            deploy/modal/alice_terminal_publication.test.mjs \
            deploy/modal/alice_cloudflare_release.test.mjs \
            deploy/modal/alice_cloudflare_traffic.test.mjs \
            deploy/modal/alice_cloudflare_worker_rollback.test.mjs \
            deploy/modal/alice_deployment_manifest.test.mjs \
            deploy/modal/alice_modal_promote.test.mjs \
            deploy/modal/alice_modal_release.test.mjs \
            deploy/modal/alice_modal_safe_bootstrap.test.mjs \
            deploy/modal/alice_recovery_credential_binding.test.mjs \
            deploy/modal/alice_release_controller.test.mjs \
            deploy/modal/alice_release_deadline.test.mjs \
            deploy/modal/alice_smoke_model_server.test.mjs \
            deploy/modal/verify_alice_runtime_boundary.test.mjs \
            deploy/modal/verify_alice_capability_bom.test.mjs \
            deploy/modal/write_alice_runtime_build_manifest.test.mjs \
            deploy/modal/alice_worker_bundle_artifact.test.mjs \
            deploy/modal/alice_workflow_binding_canary.test.mjs \
            scripts/deploy-alice-cloudflare-workflow.test.mjs \
            scripts/alice-capability-production-source.test.mjs \
            scripts/build-cloud-agent-workflow.test.mjs
          python3 -m unittest \
            deploy.modal.test_alice_registry_runtime \
            deploy.modal.test_alice_modal_provider_readback \
            deploy.modal.test_alice_safe_bootstrap
          ./node_modules/.bin/wrangler types \
            --config workers/alice-production-control/wrangler.jsonc \
            --env-interface AliceEnv \
            workers/alice-production-control/worker-configuration.d.ts
          ./node_modules/.bin/wrangler types \
            --config workers/alice-access-gateway/wrangler.jsonc \
            --env-interface AliceAccessGatewayBindings \
            workers/alice-access-gateway/worker-configuration.d.ts
          ./node_modules/.bin/wrangler types \
            --config workers/alice-state-plane/wrangler.jsonc \
            workers/alice-state-plane/worker-configuration.d.ts
          ./node_modules/.bin/wrangler types \
            --config workers/alice-connector-plane/wrangler.jsonc \
            workers/alice-connector-plane/worker-configuration.d.ts
          bun x tsc --project workers/alice-production-control/tsconfig.json --noEmit
          bun x tsc --project workers/alice-access-gateway/tsconfig.json --noEmit
          bun x tsc --project workers/alice-state-plane/tsconfig.json --noEmit
          bun x tsc --project workers/alice-connector-plane/tsconfig.json --noEmit

      - name: Build exact Alice Worker bundles
        id: worker_bundles
        env:
          ALICE_SOURCE_COMMIT: ${{ steps.source_revision.outputs.sha }}
        run: |
          bundle_root="$(mktemp -d "${RUNNER_TEMP}/alice-worker-bundles.XXXXXX")"
          wrangler_version="$(./node_modules/.bin/wrangler --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          test "$wrangler_version" = "4.122.0"
          for worker in alice-access-gateway alice-production-control alice-ai-gateway alice-state-plane alice-connector-plane; do
            mkdir "$bundle_root/$worker"
            ./node_modules/.bin/wrangler deploy \
              --dry-run \
              --outdir "$bundle_root/$worker" \
              --config "workers/$worker/wrangler.jsonc"
            if [ "$worker" = "alice-access-gateway" ]; then
              test -f "$bundle_root/$worker/worker.js"
              test ! -L "$bundle_root/$worker/worker.js"
              test ! -e "$bundle_root/$worker/index.js"
              mv "$bundle_root/$worker/worker.js" "$bundle_root/$worker/index.js"
            fi
            test -f "$bundle_root/$worker/index.js"
            test ! -L "$bundle_root/$worker/index.js"
            test -s "$bundle_root/$worker/index.js"
          done
          migration_root="$bundle_root/alice-state-plane/migrations"
          mkdir "$migration_root"
          for migration in 0001_alice_state.sql 0002_execution_records.sql 0003_eliza_database.sql; do
            migration_source="workers/alice-state-plane/migrations/$migration"
            migration_target="$migration_root/$migration"
            test -f "$migration_source"
            test ! -L "$migration_source"
            test -s "$migration_source"
            cp -- "$migration_source" "$migration_target"
            test -f "$migration_target"
            test ! -L "$migration_target"
            test -s "$migration_target"
            cmp -s "$migration_source" "$migration_target"
          done
          ALICE_WORKER_BUNDLE_ROOT="$bundle_root" \
          ALICE_WORKER_BUNDLE_ARTIFACT_PATH="$bundle_root/alice-worker-bundles.json" \
          ALICE_WRANGLER_VERSION="$wrangler_version" \
          node deploy/modal/alice_worker_bundle_artifact.mjs
          test -s "$bundle_root/alice-worker-bundles.json"
          echo "root=$bundle_root" >> "$GITHUB_OUTPUT"
          {
            echo '### Alice Worker bundle artifact'
            echo '```text'
            cat "$bundle_root/alice-worker-bundles.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest exact Alice Worker bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.worker_bundles.outputs.root }}/**/*

      - name: Upload immutable Alice Worker bundle artifact
        id: upload_worker_bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alice-worker-bundles-${{ steps.source_revision.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.worker_bundles.outputs.root }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

      - name: Record immutable Worker artifact identity
        run: |
          {
            echo "Artifact ID: ${{ steps.upload_worker_bundles.outputs.artifact-id }}"
            echo "Artifact digest: ${{ steps.upload_worker_bundles.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-local Worker bundle staging directory
        if: always()
        env:
          BUNDLE_ROOT: ${{ steps.worker_bundles.outputs.root }}
        run: |
          case "$BUNDLE_ROOT" in
            "$RUNNER_TEMP"/alice-worker-bundles.*) rm -rf -- "$BUNDLE_ROOT" ;;
            "") ;;
            *) echo "Refusing unsafe bundle cleanup target" >&2; exit 1 ;;
          esac

      # ── 5. Build Capacitor plugins ──────────────────────────────────────────
      - name: Build Capacitor plugins
        run: |
          node eliza/packages/app-core/scripts/build-native-plugins.mjs

      # ── 5.5. Build @elizaos/core + agent (needed for tsx runtime) ───────
      - name: Build @elizaos/core
        run: |
          cd eliza/packages/core
          bun run build
          test -f dist/node/index.node.js

      - name: Build @elizaos/agent
        run: |
          cd eliza/packages/agent
          bun run build:docker-dist

      - name: Build @miladyai/agent capability descriptors
        run: |
          rm -rf packages/agent/dist
          ./node_modules/.bin/tsc --noCheck --ignoreDeprecations 6.0 -p packages/agent/tsconfig.build.json
          node scripts/prepare-package-dist.mjs packages/agent --compiled-prefix=packages/agent/src
          test -f packages/agent/dist/packages/agent/src/runtime/alice-capability-inventory.js
          test -f packages/agent/dist/packages/agent/src/runtime/alice-runtime-profile.js

      - name: Build @elizaos/shared
        run: |
          cd eliza/packages/shared
          bun run build

      - name: Build @elizaos/skills
        run: |
          cd eliza/packages/skills
          bun run build
          test -f dist/index.js

      - name: Build @elizaos/vault
        run: |
          cd eliza/packages/vault
          bun run build

      - name: Build @elizaos/auth
        run: |
          cd eliza/packages/auth
          bun run build

      - name: Build @elizaos/ui
        run: |
          cd eliza/packages/ui
          bun run build

      - name: Build @elizaos/app-core
        run: |
          cd eliza/packages/app-core
          bun run build

      - name: Build @elizaos/plugin-local-inference
        run: |
          cd eliza/plugins/plugin-local-inference
          bun run build
          test -f dist/runtime/index.js

      - name: Build @elizaos/plugin-openai
        run: |
          cd eliza/plugins/plugin-openai
          bun run build
          test -f dist/node/index.node.js

      - name: Build @elizaos/cloud-sdk
        run: |
          cd eliza/packages/cloud/sdk
          bun run build
          test -f dist/index.js

      - name: Build @elizaos/plugin-elizacloud
        run: |
          cd eliza/plugins/plugin-elizacloud
          bun run build
          test -f dist/utils/config.js

      - name: Build @elizaos/plugin-agent-orchestrator
        run: |
          cd eliza/plugins/plugin-agent-orchestrator
          bun run build

      - name: Build @elizaos/plugin-agent-skills
        run: |
          cd eliza/plugins/plugin-agent-skills
          bun run build

      - name: Build @elizaos/plugin-form
        run: |
          cd eliza/plugins/plugin-form
          bun run build
          test -f dist/index.js

      - name: Build @elizaos/plugin-anthropic
        run: |
          cd eliza/plugins/plugin-anthropic
          bun run build

      - name: Build @elizaos/plugin-commands
        run: |
          cd eliza/plugins/plugin-commands
          bun run build

      - name: Build @elizaos/plugin-sql
        run: |
          cd eliza/plugins/plugin-sql
          bun run build

      - name: Build @elizaos/plugin-app-control
        run: |
          cd eliza/plugins/plugin-app-control
          bun run build

      - name: Build @elizaos/plugin-app-manager
        run: |
          cd eliza/plugins/plugin-app-manager
          bun run build

      - name: Build @elizaos/plugin-scheduling
        run: |
          cd eliza/plugins/plugin-scheduling
          bun run build

      - name: Build @elizaos/plugin-wallet
        run: |
          cd eliza/plugins/plugin-wallet
          bun run build || {
            # Latest official Eliza currently fails only while naming inferred
            # declaration types after its runtime JS bundles are complete.
            # The cloud runtime consumes index.mjs + diagnostic.js, so require
            # those exact outputs and still build the shipped view bundle.
            test -f dist/index.mjs
            test -f dist/diagnostic.js
            bun run build:views
            echo "Using verified plugin-wallet runtime JS after declaration-only failure"
          }

      - name: Build @elizaos/plugin-bluebubbles policy package
        shell: bash
        run: |
          plugins/plugin-bluebubbles/typescript/node_modules/.bin/tsc \
            -p plugins/plugin-bluebubbles/typescript/tsconfig.json \
            --noCheck
          test -f plugins/plugin-bluebubbles/typescript/dist/index.js

      - name: Build Alice policy workspace packages
        shell: bash
        run: |
          while IFS='|' read -r workspace entrypoint
          do
            test -n "$workspace"
            test -n "$entrypoint"
            bun run --cwd "$workspace" build
            test -f "$workspace/$entrypoint"
          done <<'ALICE_POLICY_WORKSPACES'
          eliza/plugins/plugin-browser|dist/index.js
          eliza/plugins/plugin-capacitor-bridge|dist/index.js
          eliza/plugins/plugin-coding-tools|dist/index.js
          eliza/plugins/plugin-computeruse|dist/index.js
          eliza/plugins/plugin-discord|dist/index.js
          eliza/plugins/plugin-google-genai|dist/node/index.node.js
          eliza/plugins/plugin-imessage|dist/index.js
          eliza/plugins/plugin-mcp|dist/node/index.js
          packages/plugin-music-library|dist/index.js
          packages/plugin-music-player|dist/index.js
          eliza/plugins/plugin-pdf|dist/node/index.node.js
          eliza/plugins/plugin-signal|dist/index.js
          eliza/plugins/plugin-telegram|dist/index.js
          eliza/plugins/plugin-whatsapp|dist/index.js
          eliza/plugins/plugin-workflow|dist/index.js
          ALICE_POLICY_WORKSPACES

      - name: Qualify Alice runtime plugin resolver
        run: bun test packages/agent/src/runtime/plugin-resolver.test.ts

      # ── 6. Build runtime (tsdown) ───────────────────────────────────────────
      - name: Build runtime (tsdown)
        run: |
          ./node_modules/.bin/tsdown
          echo '{"type":"module"}' > dist/package.json
          node --import tsx eliza/packages/app-core/scripts/write-build-info.ts 2>/dev/null || true
        env:
          MILADY_ELIZA_APP_CORE_ROOT: packages/app-core

      # ── 7. Determine version ────────────────────────────────────────────────
      - name: Determine version
        id: version
        env:
          ALICE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${SOURCE_REF}" = "cloud/staging" ]; then
            VERSION_PREFIX="cloud-staging-v"
            LATEST_TAG="cloud-staging-latest"
            BUILD_ENVIRONMENT="staging"
          else
            VERSION_PREFIX="cloud-v"
            LATEST_TAG="cloud-latest"
            BUILD_ENVIRONMENT="production"
          fi

          if [ -n "$ALICE_INPUT_VERSION" ]; then
            if ! printf '%s' "$ALICE_INPUT_VERSION" | grep -Eq '^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}(-[0-9A-Za-z][0-9A-Za-z.-]{0,31})?$'; then
              echo "Cloud version input is invalid" >&2
              exit 1
            fi
            VERSION="${VERSION_PREFIX}${ALICE_INPUT_VERSION}"
          else
            VERSION="${VERSION_PREFIX}2.0.${{ github.run_number }}"
          fi

          if [ "${BUILD_ENVIRONMENT}" = "staging" ]; then
            VERSION_CLEAN="${VERSION#cloud-staging-v}"
          else
            VERSION_CLEAN="${VERSION#cloud-v}"
          fi

          PUBLISH_LATEST="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_rollout }}" = "true" ]; then
            PUBLISH_LATEST="false"
          fi

          {
            echo "version=${VERSION}"
            echo "version_clean=${VERSION_CLEAN}"
            echo "latest_tag=${LATEST_TAG}"
            echo "build_environment=${BUILD_ENVIRONMENT}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Cloud version: ${VERSION}"
          echo "Build environment: ${BUILD_ENVIRONMENT}"
          echo "Source branch: ${SOURCE_REF}"
          echo "Source SHA: $(git rev-parse --short HEAD)"

      - name: Load deploy config
        run: |
          set -a
          source eliza/packages/app-core/deploy/deploy.defaults.env
          source deploy/deploy.env
          set +a
          {
            echo "APP_ENTRYPOINT=${APP_ENTRYPOINT}"
            echo "APP_PORT=${APP_PORT}"
            echo "APP_API_BIND=${APP_API_BIND}"
            echo "OCI_SOURCE=${OCI_SOURCE}"
            echo "OCI_LICENSES=${OCI_LICENSES}"
            echo "APP_CMD_START<<EOF"
            echo "${APP_CMD_START}"
            echo "EOF"
            echo "OCI_TITLE<<EOF"
            echo "${OCI_TITLE}"
            echo "EOF"
            echo "OCI_DESCRIPTION<<EOF"
            echo "${OCI_DESCRIPTION}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # ── 8. Build UI (vite) ──────────────────────────────────────────────────
      - name: Build UI (vite)
        run: |
          cd apps/app
          bun run build:web
        env:
          NODE_ENV: production
          ALICE_RUNTIME_PROFILE: full-gated
          MILADY_ELIZA_APP_CORE_ROOT: packages/app-core

      # ── 9. Docker ignore (context root must have .dockerignore; source: deploy/)
      - name: Set up CI dockerignore
        run: |
          cp eliza/packages/app-core/deploy/.dockerignore.ci .dockerignore
          # Whitelist runtime-required app packages (agent imports these at boot)
          echo '!eliza/apps/app-companion' >> .dockerignore
          echo '!eliza/apps/app-lifeops' >> .dockerignore
          echo '!deploy/cloud-agent-template' >> .dockerignore
          echo '!deploy/cloud-agent-template/**' >> .dockerignore
          echo '!deploy/modal' >> .dockerignore
          echo '!deploy/modal/write_alice_runtime_build_manifest.mjs' >> .dockerignore
          echo '!deploy/modal/verify_alice_runtime_build_manifest.mjs' >> .dockerignore
          echo '!deploy/modal/alice_capability_bom.mjs' >> .dockerignore
          echo '!deploy/modal/verify_alice_capability_bom.mjs' >> .dockerignore
          echo '!deploy/alice' >> .dockerignore
          echo '!deploy/alice/alice-capability-policy.v1.json' >> .dockerignore
          echo '!apps/homepage' >> .dockerignore
          echo '!apps/homepage/**' >> .dockerignore
          echo '!eliza/packages/examples' >> .dockerignore
          echo '!eliza/packages/examples/**' >> .dockerignore
          # Alice production admits only the pinned Eliza source tree. Economic
          # and test-contract gitlinks must never enter the image context.
          echo 'steward-fi' >> .dockerignore
          echo 'steward-fi/**' >> .dockerignore
          echo 'test/contracts' >> .dockerignore
          echo 'test/contracts/**' >> .dockerignore

      # ── 10. Set up Docker Buildx ────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # ── 11. Login to GHCR ──────────────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ github.event_name == 'push' || inputs.push_image != false }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Build and push Docker image ────────────────────────────────────
      - name: Build and push Docker image
        id: cloud-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push_image != false }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.publish_latest == 'true' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.version.outputs.latest_tag) || '' }}
          build-args: |
            APP_ENTRYPOINT=${{ env.APP_ENTRYPOINT }}
            APP_CMD_START=${{ env.APP_CMD_START }}
            APP_PORT=${{ env.APP_PORT }}
            APP_API_BIND=${{ env.APP_API_BIND }}
            OCI_SOURCE=${{ env.OCI_SOURCE }}
            OCI_TITLE=${{ env.OCI_TITLE }}
            OCI_DESCRIPTION=${{ env.OCI_DESCRIPTION }}
            OCI_LICENSES=${{ env.OCI_LICENSES }}
            VERSION=${{ steps.version.outputs.version }}
            VERSION_CLEAN=${{ steps.version.outputs.version_clean }}
            REVISION=${{ steps.source_revision.outputs.sha }}
            ELIZA_REVISION=${{ steps.eliza_revision.outputs.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest exact Alice image provenance
        if: success() && (github.event_name == 'push' || inputs.push_image != false)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.cloud-image.outputs.digest }}
          push-to-registry: true

      - name: Smoke exact candidate image
        if: success() && (steps.version.outputs.build_environment == 'staging' || (github.event_name == 'workflow_dispatch' && inputs.skip_rollout == true)) && (github.event_name == 'push' || inputs.push_image != false)
        timeout-minutes: 10
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.cloud-image.outputs.digest }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.cloud-image.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.source_revision.outputs.sha }}
          QUALIFIED_ELIZA_REVISION: ${{ steps.eliza_revision.outputs.sha }}
          SMOKE_CONTAINER: alice-cloud-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_STATE_CONTAINER: alice-cloud-smoke-state-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_NETWORK: alice-cloud-smoke-net-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
            docker rm -f "$SMOKE_STATE_CONTAINER" >/dev/null 2>&1 || true
            docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
            if [ -n "${SMOKE_MODEL_PID:-}" ]; then
              kill "$SMOKE_MODEL_PID" >/dev/null 2>&1 || true
              wait "$SMOKE_MODEL_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          test -n "$EXPECTED_IMAGE_DIGEST"
          EXPECTED_ELIZA_REVISION="$(git ls-tree "$EXPECTED_REVISION" eliza | awk '{print $3}')"
          test "${#EXPECTED_ELIZA_REVISION}" -eq 40
          test "$EXPECTED_ELIZA_REVISION" = "$QUALIFIED_ELIZA_REVISION"

          ALICE_SMOKE_MODEL_PORT=18080 node deploy/modal/alice_smoke_model_server.mjs >/tmp/alice-smoke-model.log 2>&1 &
          SMOKE_MODEL_PID=$!
          printf '%s\n' "$SMOKE_MODEL_PID" > "/tmp/${SMOKE_CONTAINER}.model.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/__smoke/state >/dev/null; then
              break
            fi
            if ! kill -0 "$SMOKE_MODEL_PID" 2>/dev/null; then
              cat /tmp/alice-smoke-model.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/__smoke/state >/dev/null
          docker pull --platform linux/amd64 "$IMAGE"

          EXPECTED_RUNTIME_BUILD_MANIFEST_SHA256="$(docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            "$IMAGE" \
            --input-type=module \
            -e 'import fs from "node:fs"; import crypto from "node:crypto"; const bytes = fs.readFileSync("/app/alice-runtime-build-manifest.json"); process.stdout.write(`sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`);')"
          printf '%s' "$EXPECTED_RUNTIME_BUILD_MANIFEST_SHA256" | grep -Eq '^sha256:[a-f0-9]{64}$'

          EXPECTED_CAPABILITY_BOM_SHA256="$(docker run --rm \
            --platform linux/amd64 \
            --entrypoint node \
            "$IMAGE" \
            --input-type=module \
            -e 'import fs from "node:fs"; import crypto from "node:crypto"; const bytes = fs.readFileSync("/app/alice-capability-bom.json"); process.stdout.write(`sha256:${crypto.createHash("sha256").update(bytes).digest("hex")}`);')"
          printf '%s' "$EXPECTED_CAPABILITY_BOM_SHA256" | grep -Eq '^sha256:[a-f0-9]{64}$'

          actual_revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$actual_revision" != "$EXPECTED_REVISION" ]; then
            echo "Image revision mismatch: expected $EXPECTED_REVISION, got $actual_revision" >&2
            exit 1
          fi

          docker network create "$SMOKE_NETWORK" >/dev/null
          docker run -d \
            --platform linux/amd64 \
            --name "$SMOKE_STATE_CONTAINER" \
            --network "$SMOKE_NETWORK" \
            --network-alias alice-state-plane.internal \
            --no-healthcheck \
            --entrypoint node \
            --env ALICE_SMOKE_MODEL_PORT=80 \
            "$IMAGE" \
            deploy/modal/alice_smoke_model_server.mjs >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$SMOKE_STATE_CONTAINER" node --input-type=module -e '
              const response = await fetch("http://127.0.0.1/__smoke/state");
              if (response.status !== 200) process.exit(1);
            '; then
              break
            fi
            if [ "$(docker inspect "$SMOKE_STATE_CONTAINER" --format '{{ .State.Status }}')" != "running" ]; then
              docker logs "$SMOKE_STATE_CONTAINER" >&2 || true
              exit 1
            fi
            sleep 1
          done
          docker exec "$SMOKE_STATE_CONTAINER" node --input-type=module -e '
            const response = await fetch("http://127.0.0.1/__smoke/state");
            if (response.status !== 200) process.exit(1);
          '

          docker run -d \
            --platform linux/amd64 \
            --name "$SMOKE_CONTAINER" \
            --network "$SMOKE_NETWORK" \
            --add-host host.docker.internal:host-gateway \
            --env MILADY_DISABLE_LOCAL_EMBEDDINGS=1 \
            --env ELIZA_AUTH_DISABLED=0 \
            --env MILADY_API_TOKEN=alice-cloud-smoke-runtime-token \
            --env MILADY_CLOUD_PROVISIONED=1 \
            --env MILADY_TRUST_CLOUDFLARE_ACCESS=1 \
            --env MILADY_CLOUDFLARE_ACCESS_PROXY_SECRET=alice-cloud-smoke-access-proxy-secret \
            --env ALICE_RUNTIME_AUTHORITY_MODE=proposer-only \
            --env ALICE_RUNTIME_PROFILE=full-gated \
            --env ALICE_STATE_PLANE_URL=http://alice-state-plane.internal/v1/eliza-database \
            --env ALICE_COMPANION_STATE_URL=http://alice-state-plane.internal/v1/companion-state \
            --env ALICE_STATE_OWNER_ID=alice-owner-production \
            --env ENABLE_AUTONOMY=false \
            --env ELIZA_TRIGGERS_ENABLED=false \
            --env MILADY_ALLOWED_ORIGINS=https://alice.rndrntwrk.com \
            --env ELIZA_ALLOWED_ORIGINS=https://alice.rndrntwrk.com \
            --env OPENAI_API_KEY=alice-cloud-smoke-provider-sentinel \
            --env OPENAI_BASE_URL=http://host.docker.internal:18080/v1 \
            --env OPENAI_EMBEDDING_URL=http://host.docker.internal:18080/v1 \
            --env ELIZA_VAULT_PASSPHRASE=alice-cloud-smoke-vault-passphrase \
            --env ALICE_PROGRAM_DIGEST=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --env ALICE_RELEASE_DIGEST=sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            --env ALICE_POLICY_HASH=sha256:3333333333333333333333333333333333333333333333333333333333333333 \
            --env ALICE_SOURCE_COMMIT="$EXPECTED_REVISION" \
            --env ALICE_DEPLOYMENT_CONTROLLER_COMMIT="$EXPECTED_REVISION" \
            --env ALICE_RUNTIME_IMAGE="$IMAGE" \
            --env ALICE_RUNTIME_BUILD_MANIFEST_SHA256="$EXPECTED_RUNTIME_BUILD_MANIFEST_SHA256" \
            --env ALICE_CAPABILITY_BOM_SHA256="$EXPECTED_CAPABILITY_BOM_SHA256" \
            --env ALICE_DEPLOYMENT_MANIFEST_SHA256=sha256:9999999999999999999999999999999999999999999999999999999999999999 \
            --env ALICE_ELIZA_COMMIT="$EXPECTED_ELIZA_REVISION" \
            --env ALICE_MODAL_REVISION=49 \
            "$IMAGE"

          smoke_healthy=0
          for attempt in $(seq 1 72); do
            health="$(docker inspect "$SMOKE_CONTAINER" --format '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}missing{{ end }}')"
            state="$(docker inspect "$SMOKE_CONTAINER" --format '{{ .State.Status }}')"

            if [ "$health" = "healthy" ]; then
              smoke_healthy=1
              break
            fi

            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              docker logs "$SMOKE_CONTAINER" >&2 || true
              exit 1
            fi

            sleep 5
          done

          if [ "$smoke_healthy" != 1 ]; then
            docker logs "$SMOKE_CONTAINER" >&2 || true
            echo "Candidate image did not become healthy before the smoke deadline" >&2
            exit 1
          fi

          docker exec "$SMOKE_CONTAINER" sh -lc 'test ! -e /app/steward-fi'
          docker exec "$SMOKE_CONTAINER" sh -lc 'test ! -e /app/test/contracts'
          runtime_build_attestation="$(docker exec "$SMOKE_CONTAINER" node deploy/modal/verify_alice_runtime_build_manifest.mjs)"
          printf '%s' "$runtime_build_attestation" | grep -q '"ok":true'
          capability_bom_attestation="$(docker exec "$SMOKE_CONTAINER" node --import ./node_modules/tsx/dist/loader.mjs deploy/modal/verify_alice_capability_bom.mjs)"
          printf '%s' "$capability_bom_attestation" | grep -q '"ok":true'
          readiness="$(docker exec "$SMOKE_CONTAINER" node --input-type=module -e '
                import { gunzipSync } from "node:zlib";
                const port = process.env.PORT ?? process.env.APP_PORT ?? process.env.ELIZA_PORT ?? "2138";
                const base = `http://127.0.0.1:${port}`;
                const authHeaders = {
                  authorization: `Bearer ${process.env.MILADY_API_TOKEN}`,
                  "cf-access-authenticated-user-email": "alice-owner-verified.invalid",
                  "x-milady-cloudflare-access-secret": process.env.MILADY_CLOUDFLARE_ACCESS_PROXY_SECRET,
                };
                const liveness = await fetch(`${base}/health/live`);
                if (liveness.status !== 200) {
                  console.error(JSON.stringify({ livenessStatus: liveness.status }));
                  process.exit(2);
                }
                const unauthenticatedRuntimeReads = [
                  "/api/health",
                  "/health",
                  "/health/ready",
                  "/api/alice-production/proof",
                  "/api/alice-production/capabilities",
                ];
                for (const pathname of unauthenticatedRuntimeReads) {
                  const unauthenticated = await fetch(`${base}${pathname}`);
                  if (unauthenticated.status !== 401) {
                    console.error(JSON.stringify({ pathname, unauthenticatedStatus: unauthenticated.status }));
                    process.exit(2);
                  }
                }
                const response = await fetch(`${base}/api/health`, { headers: authHeaders });
                const health = await response.json();
                if (response.status !== 200 || health.agentState !== "running") {
                  console.error(JSON.stringify({ status: response.status, agentState: health.agentState, canRespond: health.canRespond }));
                  process.exit(2);
                }
                const capabilitiesResponse = await fetch(`${base}/api/alice-production/capabilities`, { headers: authHeaders });
                const capabilities = await capabilitiesResponse.json();
                if (
                  capabilitiesResponse.status !== 200 ||
                  capabilities.capabilityBomSha256 !== process.env.ALICE_CAPABILITY_BOM_SHA256 ||
                  !Array.isArray(capabilities.entries) ||
                  capabilities.entries.length === 0
                ) {
                  console.error(JSON.stringify({ capabilitiesStatus: capabilitiesResponse.status, capabilities }));
                  process.exit(2);
                }
                const readyResponse = await fetch(`${base}/health/ready`, { headers: authHeaders });
                if (readyResponse.status !== 200) {
                  console.error(JSON.stringify({ readyStatus: readyResponse.status }));
                  process.exit(2);
                }
                const emoteResponse = await fetch(`${base}/api/emotes`, { headers: authHeaders });
                const emoteBody = await emoteResponse.json();
                if (
                  emoteResponse.status !== 200 ||
                  !Array.isArray(emoteBody.emotes) ||
                  !emoteBody.emotes.some((emote) => emote?.id === "dance-happy")
                ) {
                  console.error(JSON.stringify({ emoteStatus: emoteResponse.status, emoteBody }));
                  process.exit(3);
                }
                const initialCompanionResponse = await fetch(`${base}/api/companion/stage`, { headers: authHeaders });
                const initialCompanion = await initialCompanionResponse.json();
                if (
                  initialCompanionResponse.status !== 200 ||
                  initialCompanion?.state?.camera?.zoom !== 0.25
                ) {
                  console.error(JSON.stringify({ companionReadStatus: initialCompanionResponse.status, initialCompanion }));
                  process.exit(15);
                }
                const companionUpdateResponse = await fetch(`${base}/api/companion/stage`, {
                  method: "POST",
                  headers: { ...authHeaders, "content-type": "application/json" },
                  body: JSON.stringify({ patch: { camera: { zoom: 0.5 } } }),
                });
                const companionUpdate = await companionUpdateResponse.json();
                if (
                  companionUpdateResponse.status !== 200 ||
                  companionUpdate?.state?.camera?.zoom !== 0.5
                ) {
                  console.error(JSON.stringify({ companionWriteStatus: companionUpdateResponse.status, companionUpdate }));
                  process.exit(16);
                }
                const persistedCompanionResponse = await fetch(`${base}/api/companion/stage`, { headers: authHeaders });
                const persistedCompanion = await persistedCompanionResponse.json();
                if (
                  persistedCompanionResponse.status !== 200 ||
                  persistedCompanion?.state?.camera?.zoom !== 0.5
                ) {
                  console.error(JSON.stringify({ companionPersistedStatus: persistedCompanionResponse.status, persistedCompanion }));
                  process.exit(17);
                }
                const broadcastResponse = await fetch(`http://127.0.0.1:${port}/broadcast/alice-cam`);
                if (broadcastResponse.status !== 401) {
                  console.error(JSON.stringify({ broadcastStatus: broadcastResponse.status }));
                  process.exit(4);
                }
                const onboardingResponse = await fetch(`${base}/api/onboarding/status`, { headers: authHeaders });
                const onboarding = await onboardingResponse.json();
                const onboardingKeys = Object.keys(onboarding).sort();
                if (
                  onboardingResponse.status !== 200 ||
                  onboarding.complete !== true ||
                  onboarding.cloudProvisioned !== true ||
                  onboardingKeys.length !== 2 ||
                  onboardingKeys[0] !== "cloudProvisioned" ||
                  onboardingKeys[1] !== "complete"
                ) {
                  console.error(JSON.stringify({ onboardingStatus: onboardingResponse.status, onboarding }));
                  process.exit(5);
                }
                const broadcastSceneResponse = await fetch(`${base}/api/broadcast/alice-cam/scene`, { headers: authHeaders });
                const broadcastScene = await broadcastSceneResponse.json();
                const broadcastSceneKeys = Object.keys(broadcastScene).sort();
                const sceneKeys = Object.keys(broadcastScene?.scene ?? {}).sort();
                if (
                  broadcastSceneResponse.status !== 200 ||
                  broadcastScene.ok !== true ||
                  broadcastScene.channel !== "alice-cam" ||
                  broadcastSceneKeys.length !== 3 ||
                  broadcastSceneKeys[0] !== "channel" ||
                  broadcastSceneKeys[1] !== "ok" ||
                  broadcastSceneKeys[2] !== "scene" ||
                  sceneKeys.length !== 3 ||
                  sceneKeys[0] !== "hasCustomBackground" ||
                  sceneKeys[1] !== "hasCustomVrm" ||
                  sceneKeys[2] !== "selectedVrmIndex" ||
                  typeof broadcastScene.scene.hasCustomBackground !== "boolean" ||
                  typeof broadcastScene.scene.hasCustomVrm !== "boolean" ||
                  !(
                    broadcastScene.scene.selectedVrmIndex === null ||
                    Number.isInteger(broadcastScene.scene.selectedVrmIndex)
                  )
                ) {
                  console.error(JSON.stringify({ broadcastSceneStatus: broadcastSceneResponse.status, broadcastScene }));
                  process.exit(5);
                }
                const broadcastShellResponse = await fetch(`${base}/broadcast/alice-cam`, { headers: authHeaders });
                const broadcastContentType = broadcastShellResponse.headers.get("content-type") ?? "";
                const broadcastHtml = await broadcastShellResponse.text();
                if (
                  broadcastShellResponse.status !== 200 ||
                  !broadcastContentType.startsWith("text/html") ||
                  broadcastHtml.includes(process.env.MILADY_API_TOKEN)
                ) {
                  console.error(JSON.stringify({
                    broadcastShellStatus: broadcastShellResponse.status,
                    broadcastContentType,
                    leakedBearer: broadcastHtml.includes(process.env.MILADY_API_TOKEN),
                  }));
                  process.exit(5);
                }
                const deniedReads = [
                  "/api/wallet/keys",
                  "/api/secrets",
                  "/api/runtime",
                ];
                for (const pathname of deniedReads) {
                  const denied = await fetch(`${base}${pathname}`, { headers: authHeaders });
                  const body = await denied.json();
                  if (denied.status !== 403 || body.code !== "ALICE_PRODUCTION_MUTATION_DENIED") {
                    console.error(JSON.stringify({ pathname, status: denied.status, code: body.code }));
                    process.exit(5);
                  }
                }
                const dashboardResponse = await fetch(`${base}/`, { headers: authHeaders });
                const dashboardHtml = await dashboardResponse.text();
                const scriptMatch = dashboardHtml.match(/<script[^>]+src="([^"]+\.js)"/);
                if (!scriptMatch) {
                  console.error(JSON.stringify({ dashboardStatus: dashboardResponse.status, hasScript: false }));
                  process.exit(6);
                }
                const bundleResponse = await fetch(new URL(scriptMatch[1], `${base}/`), { headers: authHeaders });
                if (dashboardResponse.status !== 200 || bundleResponse.status !== 200) {
                  console.error(JSON.stringify({ dashboardStatus: dashboardResponse.status, bundleStatus: bundleResponse.status }));
                  process.exit(7);
                }
                const deniedMutations = [
                  ["POST", "/api/plugins/install", { packageName: "@elizaos/plugin-evm" }],
                  ["POST", "/api/wallet/import", { chain: "evm", privateKey: "blocked" }],
                  ["POST", "/api/wallet/trade/execute", {}],
                  ["POST", "/api/stream/start", {}],
                  ["POST", "/api/terminal/run", { command: "blocked" }],
                ];
                for (const [method, pathname, payload] of deniedMutations) {
                  const denied = await fetch(`${base}${pathname}`, {
                    method,
                    headers: { ...authHeaders, "content-type": "application/json" },
                    body: JSON.stringify(payload),
                  });
                  const body = await denied.json();
                  if (denied.status !== 403 || body.code !== "ALICE_PRODUCTION_MUTATION_DENIED") {
                    console.error(JSON.stringify({ method, pathname, status: denied.status, code: body.code }));
                    process.exit(8);
                  }
                }
                const maliciousOrigin = await fetch(`${base}/api/conversations`, {
                  method: "POST",
                  headers: { ...authHeaders, origin: "https://attacker.example", "content-type": "application/json" },
                  body: "{}",
                });
                if (maliciousOrigin.status !== 403) {
                  console.error(JSON.stringify({ maliciousOriginStatus: maliciousOrigin.status }));
                  process.exit(9);
                }
                const bearerOnlyChat = await fetch(`${base}/v1/chat/completions`, {
                  method: "POST",
                  headers: {
                    authorization: `Bearer ${process.env.MILADY_API_TOKEN}`,
                    "content-type": "application/json",
                  },
                  body: JSON.stringify({
                    model: "alice-exact-image-smoke",
                    messages: [{ role: "user", content: "This must be denied without Access proxy proof." }],
                  }),
                });
                const bearerOnlyBody = await bearerOnlyChat.json();
                if (
                  bearerOnlyChat.status !== 403 ||
                  bearerOnlyBody.code !== "ALICE_DURABLE_CHAT_INGRESS_REQUIRED"
                ) {
                  console.error(JSON.stringify({ bearerOnlyChatStatus: bearerOnlyChat.status, bearerOnlyBody }));
                  process.exit(10);
                }
                const chatResponse = await fetch(`${base}/v1/chat/completions`, {
                  method: "POST",
                  headers: { ...authHeaders, "content-type": "application/json" },
                  body: JSON.stringify({
                    model: "alice-exact-image-smoke",
                    messages: [{ role: "user", content: "Return the bounded smoke sentinel." }],
                  }),
                });
                const chatBody = await chatResponse.json();
                if (
                  chatResponse.status !== 200 ||
                  chatBody?.choices?.[0]?.message?.content !== "ALICE_EXACT_IMAGE_FULL_GATED_OK" ||
                  Object.hasOwn(chatBody, "alice_boundary")
                ) {
                  console.error(JSON.stringify({ chatStatus: chatResponse.status, chatBody }));
                  process.exit(11);
                }
                const modelStateResponse = await fetch("http://host.docker.internal:18080/__smoke/state");
                const modelState = await modelStateResponse.json();
                if (
                  modelStateResponse.status !== 200 ||
                  modelState.chatRequests !== 1 ||
                  modelState.rejectedAuthorityFields !== 0
                ) {
                  console.error(JSON.stringify({ modelStateStatus: modelStateResponse.status, modelState }));
                  process.exit(12);
                }
                const statePlaneStateResponse = await fetch("http://alice-state-plane.internal/__smoke/state");
                const statePlaneState = await statePlaneStateResponse.json();
                if (
                  statePlaneStateResponse.status !== 200 ||
                  statePlaneState.elizaLoadRequests < 1 ||
                  statePlaneState.elizaCommitRequests < 1 ||
                  statePlaneState.companionGetRequests !== 3 ||
                  statePlaneState.companionPutRequests !== 1
                ) {
                  console.error(JSON.stringify({ statePlaneStateStatus: statePlaneStateResponse.status, statePlaneState }));
                  process.exit(18);
                }
                const vrmResponse = await fetch(`${base}/vrms/milady-9.vrm.gz`, { headers: authHeaders });
                const compressedVrm = Buffer.from(await vrmResponse.arrayBuffer());
                let vrmMagic = "";
                try {
                  vrmMagic = gunzipSync(compressedVrm).subarray(0, 4).toString("ascii");
                } catch {
                  // Fail closed below with a stable diagnostic.
                }
                if (vrmResponse.status !== 200 || compressedVrm.length <= 1024 || vrmMagic !== "glTF") {
                  console.error(JSON.stringify({ vrmStatus: vrmResponse.status, vrmBytes: compressedVrm.length, vrmMagic }));
                  process.exit(13);
                }
                process.stdout.write(JSON.stringify({ status: response.status, agentState: health.agentState, canRespond: health.canRespond, capabilityBomSha256: capabilities.capabilityBomSha256, capabilityCount: capabilities.entries.length, emoteStatus: emoteResponse.status, companionReadStatus: initialCompanionResponse.status, companionWriteStatus: companionUpdateResponse.status, companionPersistedStatus: persistedCompanionResponse.status, statePlaneElizaLoadRequests: statePlaneState.elizaLoadRequests, statePlaneElizaCommitRequests: statePlaneState.elizaCommitRequests, statePlaneCompanionGetRequests: statePlaneState.companionGetRequests, statePlaneCompanionPutRequests: statePlaneState.companionPutRequests, broadcastStatus: broadcastResponse.status, authenticatedDeniedReadCount: deniedReads.length, dashboardStatus: dashboardResponse.status, bundleStatus: bundleResponse.status, forbiddenMutationCount: deniedMutations.length, maliciousOriginStatus: maliciousOrigin.status, bearerOnlyChatStatus: bearerOnlyChat.status, chatStatus: chatResponse.status, chatProfile: "full-gated", modelChatRequests: modelState.chatRequests, vrmStatus: vrmResponse.status, vrmBytes: compressedVrm.length, vrmMagic }));
              ')"
          runtime_snapshot="$(docker exec "$SMOKE_CONTAINER" node --input-type=module -e '
                  const port = process.env.PORT ?? process.env.APP_PORT ?? process.env.ELIZA_PORT ?? "2138";
                  const response = await fetch(`http://127.0.0.1:${port}/api/alice-production/proof`, { headers: { authorization: `Bearer ${process.env.MILADY_API_TOKEN}` } });
                  const body = await response.text();
                  if (response.status !== 200) {
                    console.error(JSON.stringify({ proofStatus: response.status }));
                    process.exit(14);
                  }
                  process.stdout.write(body);
              ')"
          boundary="$(printf '%s' "$runtime_snapshot" | EXPECTED_SOURCE_COMMIT="$EXPECTED_REVISION" EXPECTED_DEPLOYMENT_CONTROLLER_COMMIT="$EXPECTED_REVISION" EXPECTED_RUNTIME_IMAGE="$IMAGE" EXPECTED_RUNTIME_BUILD_MANIFEST_SHA256="$EXPECTED_RUNTIME_BUILD_MANIFEST_SHA256" EXPECTED_CAPABILITY_BOM_SHA256="$EXPECTED_CAPABILITY_BOM_SHA256" EXPECTED_DEPLOYMENT_MANIFEST_SHA256=sha256:9999999999999999999999999999999999999999999999999999999999999999 EXPECTED_ELIZA_COMMIT="$EXPECTED_ELIZA_REVISION" node deploy/modal/verify_alice_runtime_boundary.mjs)"
          echo "Candidate image runtime ready: image=$IMAGE revision=$actual_revision build=$runtime_build_attestation health=$readiness boundary=$boundary"

      - name: Cleanup candidate smoke container
        if: always() && (steps.version.outputs.build_environment == 'staging' || (github.event_name == 'workflow_dispatch' && inputs.skip_rollout == true))
        env:
          SMOKE_CONTAINER: alice-cloud-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_STATE_CONTAINER: alice-cloud-smoke-state-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_NETWORK: alice-cloud-smoke-net-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$SMOKE_STATE_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          if [ -s "/tmp/${SMOKE_CONTAINER}.model.pid" ]; then
            kill "$(cat "/tmp/${SMOKE_CONTAINER}.model.pid")" >/dev/null 2>&1 || true
            rm -f "/tmp/${SMOKE_CONTAINER}.model.pid"
          fi

      # ── 13. Trigger production deploy webhook ──────────────────────────────
      - name: Trigger cloud fleet deploy webhook
        if: success() && steps.version.outputs.build_environment == 'production' && (github.event_name == 'push' || inputs.push_image != false) && (github.event_name == 'push' || inputs.skip_rollout != true)
        env:
          WEBHOOK_SECRET: ${{ secrets.CLOUD_DEPLOY_WEBHOOK_SECRET }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          GIT_SHA: ${{ steps.source_revision.outputs.sha }}
          GIT_REF: ${{ env.SOURCE_REF }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "CLOUD_DEPLOY_WEBHOOK_SECRET is required" >&2
            exit 1
          fi

          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"image": os.environ["IMAGE"], "tag": os.environ["IMAGE_TAG"], "sha": os.environ["GIT_SHA"], "ref": os.environ["GIT_REF"], "run_id": os.environ["DELIVERY_ID"], "skip_rollout": False}, separators=(",", ":")))')
          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"

          curl --fail --show-error --silent \
            -X POST "${{ env.CLOUD_DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: cloud_deploy" \
            -H "X-GitHub-Delivery: ${DELIVERY_ID}" \
            -H "X-Hub-Signature-256: ${SIGNATURE}" \
            --data "$PAYLOAD"

      # ── 13. Build summary ──────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          if [ "${{ steps.version.outputs.build_environment }}" = "staging" ]; then
            BUILD_LABEL="Staging"
          else
            BUILD_LABEL="Production"
          fi

          if [ "${SOURCE_REF}" = "cloud/main" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_rollout }}" = "true" ]; then
              ROLLOUT_STATUS="skipped (workflow_dispatch skip_rollout=true)"
            else
              ROLLOUT_STATUS="enabled via webhook"
            fi
          else
            ROLLOUT_STATUS="not applicable (staging)"
          fi

          {
            echo "## ☁️ Cloud Agent Image (${BUILD_LABEL})"
            echo ""
            echo "> ${BUILD_LABEL} build for branch \`${SOURCE_REF}\`."
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Environment | \`${{ steps.version.outputs.build_environment }}\` |"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Digest | \`${{ steps.cloud-image.outputs.digest }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Branch | \`${SOURCE_REF}\` |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
            echo "| SBOM | OCI attestation |"
            echo "| Provenance | BuildKit mode=max plus GitHub artifact attestation |"
            echo "| Auto-deploy | ${ROLLOUT_STATUS} |"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.latest_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
