name: Alice Corpus Binding CI

on:
  push:
    branches:
      - feat/alice-corpus-runtime-binding-2026-08-22
    paths:
      - ".github/workflows/alice-corpus-binding-ci.yml"
      - ".env.alice-corpus.example"
      - "packages/agent/src/plugins/alice-corpus/**"
      - "packages/agent/src/runtime/core-plugins.ts"
      - "packages/agent/src/runtime/core-plugins.alice-corpus.test.ts"
      - "packages/agent/src/runtime/eliza.ts"
      - "packages/agent/src/runtime/eliza.alice-corpus.test.ts"
      - "scripts/verify-alice-corpus-runtime.ts"
      - "docs/operators/alice-corpus-runtime-binding.md"
      - "docs/superpowers/specs/2026-08-22-alice-corpus-runtime-binding-design.md"
      - "docs/superpowers/plans/2026-08-22-alice-corpus-runtime-binding*.md"
  pull_request:
    branches:
      - release/alice-production-core-2026-08-22
    paths:
      - ".github/workflows/alice-corpus-binding-ci.yml"
      - ".env.alice-corpus.example"
      - "packages/agent/src/plugins/alice-corpus/**"
      - "packages/agent/src/runtime/core-plugins.ts"
      - "packages/agent/src/runtime/core-plugins.alice-corpus.test.ts"
      - "packages/agent/src/runtime/eliza.ts"
      - "packages/agent/src/runtime/eliza.alice-corpus.test.ts"
      - "scripts/verify-alice-corpus-runtime.ts"
  workflow_dispatch:

concurrency:
  group: alice-corpus-binding-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.4.1"

jobs:
  verify:
    name: Corpus Runtime Binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup exact local runtime workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-command: bun install --ignore-scripts --no-frozen-lockfile
          install-native-deps: "false"
          run-postinstall: "false"
          skip-avatar-clone: "true"
          no-vision-deps: "true"
          disable-local-eliza-workspace: "false"
          prepare-local-eliza-runtime: "false"
          skip-cloud-submodule: "false"
          skip-local-upstreams-postinstall: "false"

      - name: Generate local eliza protobuf types
        shell: bash
        run: |
          if [ -d eliza/packages/schemas ] && [ -f eliza/packages/schemas/buf.gen.yaml ] && [ ! -f eliza/packages/core/src/types/generated/eliza/v1/agent_pb.ts ]; then
            cd eliza/packages/schemas
            node node_modules/@bufbuild/buf/install.js 2>/dev/null || true
            bunx @bufbuild/buf@1.67.0 generate
          fi

      - name: Generate eliza i18n keyword data
        if: ${{ hashFiles('eliza/package.json') != '' }}
        run: node packages/shared/scripts/generate-keywords.mjs --target ts
        working-directory: eliza

      - name: Build eliza packages required by agent typecheck
        if: ${{ hashFiles('eliza/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f eliza/packages/core/dist/index.node.js ] || [ ! -f eliza/packages/core/dist/index.d.ts ]; then
            (cd eliza/packages/core && bun run build)
          fi
          if [ ! -f eliza/packages/skills/dist/index.js ]; then
            (cd eliza/packages/skills && bun run build)
          fi
          if [ ! -f eliza/packages/cloud-routing/dist/index.js ]; then
            (cd eliza/packages/cloud-routing && bun run build)
          fi
          if [ -f eliza/plugins/plugin-agent-skills/package.json ] && [ ! -f eliza/plugins/plugin-agent-skills/dist/index.d.ts ]; then
            (cd eliza/plugins/plugin-agent-skills && bun run build)
          fi
          if [ -f eliza/plugins/plugin-pdf/package.json ] && [ ! -f eliza/plugins/plugin-pdf/dist/index.d.ts ]; then
            (cd eliza/plugins/plugin-pdf && bun run build)
          fi
          if [ -f eliza/plugins/plugin-sql/package.json ] && [ ! -f eliza/plugins/plugin-sql/typescript/dist/index.d.ts ]; then
            (cd eliza/plugins/plugin-sql && bun run build)
          fi
          if [ -f eliza/plugins/plugin-streaming/package.json ] && [ ! -f eliza/plugins/plugin-streaming/dist/index.d.ts ]; then
            (cd eliza/plugins/plugin-streaming && bun run build)
          fi

      - name: Run focused corpus tests
        run: >-
          bunx vitest run
          packages/agent/src/plugins/alice-corpus/*.test.ts
          packages/agent/src/runtime/core-plugins.alice-corpus.test.ts
          packages/agent/src/runtime/eliza.alice-corpus.test.ts

      - name: Check corpus binding format and lint
        run: >-
          bunx @biomejs/biome check
          packages/agent/src/plugins/alice-corpus
          packages/agent/src/runtime/core-plugins.ts
          packages/agent/src/runtime/core-plugins.alice-corpus.test.ts
          packages/agent/src/runtime/eliza.ts
          packages/agent/src/runtime/eliza.alice-corpus.test.ts
          scripts/verify-alice-corpus-runtime.ts

      - name: Typecheck agent package
        working-directory: packages/agent
        run: bun run typecheck

      - name: Build agent package
        working-directory: packages/agent
        run: bun run build
